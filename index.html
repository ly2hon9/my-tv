<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的电视与影视聚合</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #0f0f0f; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; }

    #player-wrap { 
      width: 100%; 
      height: 40vh; 
      min-height: 240px; 
      background: #000; 
      position: relative; 
      flex-shrink: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
    }
    
    #player-wrap.pseudo-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      max-height: none !important;
    }

    video { width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; }

    #top-bar { 
      position: absolute; top: 0; left: 0; right: 0; 
      padding: 12px 18px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 10; pointer-events: none; 
    }
    #current-title { font-size: 15px; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    #current-route-badge { font-size: 12px; background: #0070f3; color: #fff; padding: 2px 8px; border-radius: 4px; display: none; }

    #status-layer { 
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 8; 
      color: #fff; 
      background: rgba(25, 25, 25, 0.88); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.12); 
      padding: 14px 22px; 
      border-radius: 12px; 
      font-size: 13px; 
      pointer-events: none; 
      display: none; 
      text-align: center; 
      max-width: 85%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      line-height: 1.6;
    }
    #status-layer .icon { font-size: 20px; margin-bottom: 4px; display: block; }

    #custom-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 46px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 15;
    }

    .ctrl-left { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85; transition: opacity 0.2s; }
    .ctrl-btn:hover { opacity: 1; }
    .ctrl-time { font-size: 12px; color: #aaa; font-family: monospace; }

    .ctrl-right { display: flex; align-items: center; gap: 8px; }

    .external-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 3px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .ext-btn {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.9);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, background 0.2s;
    }
    .ext-btn:hover { transform: scale(1.1); background: #fff; }
    .ext-btn:active { transform: scale(0.92); }
    .ext-btn svg { width: 16px; height: 16px; }

    #sidebar { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #161616; border-top: 1px solid #282828; }
    
    #search-box { 
      padding: 10px 12px; 
      background: #1f1f1f; 
      border-bottom: 1px solid #2b2b2b; 
      flex-shrink: 0; 
      display: flex; 
      flex-direction: column;
      gap: 8px; 
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #search-box input { 
      flex: 1; 
      padding: 8px 14px; 
      border-radius: 6px; 
      border: 1px solid #444; 
      background: #111; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
    }
    .btn-search {
      background: #0070f3;
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn-search:active { background: #005bb5; }

    .mode-tab-group {
      display: flex;
      gap: 6px;
    }
    .mode-tab {
      flex: 1;
      padding: 6px 0;
      background: #252525;
      border: 1px solid #383838;
      color: #999;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .mode-tab.active {
      background: #0070f3;
      color: #fff;
      border-color: #0070f3;
      font-weight: 500;
    }

    .btn-source-mgr {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #eee;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-source-mgr:hover { background: #3a3a3a; }

    #channel-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .group-header { padding: 12px 16px; background: #222; font-size: 13px; font-weight: bold; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; user-select: none; }
    .channel-row { border-bottom: 1px solid #222; background: #181818; }
    .channel-main { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; user-select: none; }
    .channel-main:active { background: #222; }
    .channel-title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .channel-arrow { font-size: 11px; color: #777; transition: transform 0.2s; }
    .channel-row.expanded .channel-arrow { transform: rotate(90deg); color: #0070f3; }
    .channel-row.playing .channel-title { color: #0070f3; font-weight: bold; }

    .channel-right-tools { display: flex; align-items: center; gap: 8px; }
    .badge-lines { font-size: 11px; background: #333; color: #bbb; padding: 2px 7px; border-radius: 10px; }
    .btn-ping-channel { background: #238636; border: 1px solid #2ea043; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 3px; }

    .sources-panel { display: none; background: #111; padding: 8px 12px 12px 16px; border-top: 1px solid #242424; }
    .channel-row.expanded .sources-panel { display: block; }
    
    .source-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-top: 6px; background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 6px; cursor: pointer; }
    .source-item:active { background: #242424; }
    .source-item.active-source { border-color: #0070f3; background: #0d2847; }
    .source-name { font-size: 13px; font-weight: 500; color: #ddd; }

    .ping-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-family: monospace; display: none; font-weight: 500; }
    .ping-testing { background: #444; color: #fff; }
    .ping-fast { background: #238636; color: #fff; }
    .ping-medium { background: #d29922; color: #fff; }
    .ping-slow { background: #cf222e; color: #fff; }

    /* 选集网格 */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .episode-btn {
      background: #202020;
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 4px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .episode-btn:active { background: #333; }
    .episode-btn.active-source { background: #0070f3; color: #fff; border-color: #0070f3; }

    /* 弹窗样式 */
    #modal-mask {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #source-modal {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 20px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.8);
    }
    #source-modal h3 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input-label { font-size: 12px; color: #aaa; margin-top: 10px; margin-bottom: 4px; display: block; }
    #source-modal input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .sub-stats { font-size: 12px; color: #0070f3; margin-top: 6px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn-action { padding: 8px 16px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; }
    .btn-cancel { background: #333; color: #eee; }
    .btn-save { background: #0070f3; color: #fff; }

    @media (min-width: 768px) {
      body { flex-direction: row; }
      #sidebar { width: 400px; border-top: none; border-right: 1px solid #282828; height: 100%; }
      #player-wrap { flex: 1; height: 100%; min-height: auto; }
    }
  </style>
</head>
<body>

  <div id="player-wrap">
    <div id="top-bar">
      <div id="current-title">请选择视频或频道</div>
      <div id="current-route-badge"></div>
    </div>
    
    <div id="status-layer">
      <span class="icon">📺</span>
      <div id="status-text">正在连接直播源...</div>
    </div>

    <video id="video" autoplay playsinline webkit-playsinline></video>

    <!-- 控制条 -->
    <div id="custom-controls">
      <div class="ctrl-left">
        <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()" title="播放/暂停">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="#fff"><polygon points="6,4 20,12 6,20"/></svg>
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="#fff" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <span class="ctrl-time" id="stream-time">播放中</span>
      </div>

      <div class="ctrl-right">
        <div class="external-group" title="使用第三方播放器打开该流">
          <!-- 复制直链 -->
          <button class="ext-btn" onclick="copyCurrentUrl()" title="复制直链">
            <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <!-- VLC -->
          <button class="ext-btn" onclick="openPlayer('vlc')" title="VLC 播放器">
            <svg viewBox="0 0 48 48">
              <path fill="#FF8800" d="M24 4c-.9 0-1.7.6-1.9 1.5L16.2 32h15.6l-5.9-26.5c-.2-.9-1-1.5-1.9-1.5z"/>
              <path fill="#FFFFFF" d="M19.1 19h9.8l-1.8-8h-6.2l-1.8 8z"/>
              <path fill="#FFFFFF" d="M16.9 29h14.2l-1.6-7H18.5l-1.6 7z"/>
              <path fill="#FF8800" d="M7 40c0 2.2 7.6 4 17 4s17-1.8 17-4l-3-6H10l-3 6z"/>
              <ellipse cx="24" cy="40" rx="17" ry="3.5" fill="#E65100"/>
              <path fill="#FF9800" d="M10 34h28l-2.4 5H12.4L10 34z"/>
            </svg>
          </button>
          <!-- PotPlayer -->
          <button class="ext-btn" onclick="openPlayer('potplayer')" title="PotPlayer">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC800"/><polygon points="9,7 17,12 9,17" fill="#333"/></svg>
          </button>
          <!-- IINA -->
          <button class="ext-btn" onclick="openPlayer('iina')" title="IINA">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#4B3869"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
          </button>
          <!-- nPlayer -->
          <button class="ext-btn" onclick="openPlayer('nplayer')" title="nPlayer">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#007AFF"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
          </button>
          <!-- APTV -->
          <button class="ext-btn" onclick="openPlayer('aptv')" title="APTV">
            <svg viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="4" fill="#000"/><polygon points="8,6 16,12 8,18" fill="#30D158"/></svg>
          </button>
        </div>

        <button class="ctrl-btn" onclick="toggleMute()" title="音量/静音">
          <svg id="volume-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>

        <button class="ctrl-btn" onclick="toggleFullScreen()" title="全屏">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div id="search-box">
      <div class="search-row">
        <input type="text" id="filter" placeholder="搜索片名、视频、电视频道..." onkeydown="handleEnterSearch(event)">
        <button class="btn-search" onclick="triggerSearch()">搜索</button>
        <button class="btn-source-mgr" onclick="openSourceModal()">⚙️ 订阅</button>
      </div>
      <div class="mode-tab-group">
        <button class="mode-tab active" id="tab-tv" onclick="switchMode('tv')">📺 电视直播</button>
        <button class="mode-tab" id="tab-vod" onclick="switchMode('vod')">🎬 聚合搜影视</button>
      </div>
    </div>
    <div id="channel-list">
      <div style="padding: 24px; color: #888; text-align: center;">正在同步节目单...</div>
    </div>
  </div>

  <!-- 订阅设置弹窗 -->
  <div id="modal-mask">
    <div id="source-modal">
      <h3>
        <span>订阅源与配置</span>
        <span style="font-size:14px;color:#888;cursor:pointer;" onclick="closeSourceModal()">✕</span>
      </h3>
      
      <label class="input-label">1. 影视聚合订阅 URL（支持 MoonTV Base58 编码与标准 JSON）：</label>
      <input type="text" id="sub-url-input" placeholder="https://pz.v88.qzz.io?format=2&source=jingjian">
      <div class="sub-stats" id="sub-stats-label">当前已解析 0 个可用影视站点</div>

      <label class="input-label">2. 电视直播源（M3U 地址）：</label>
      <input type="text" id="source-m3u-input" placeholder="https://.../hotel_tvn.m3u">

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="resetDefaultSource()">恢复默认</button>
        <button class="btn-action btn-save" onclick="updateSubscriptionAndSave()">🔄 更新订阅并保存</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_M3U = "https://www.luyizhong.eu.org/hotel_tvn.m3u";
    // 默认内置你的 MoonTV Base58 精简版订阅
    const DEFAULT_SUB_URL = "https://pz.v88.qzz.io?format=2&source=jingjian";

    const STORAGE_KEY_M3U = "custom_tv_m3u_url";
    const STORAGE_KEY_SUB = "custom_vod_sub_url";
    const STORAGE_KEY_SITES = "cached_parsed_sites";

    // 核心算法：标准 Base58 纯 JS 解码器 (Bitcoin / MoonTV 规范)
    const B58_ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    function decodeBase58(input) {
      input = input.trim();
      if (input.length === 0) return '';
      const bytes = [0];
      for (let i = 0; i < input.length; i++) {
        const c = input[i];
        const value = B58_ALPHABET.indexOf(c);
        if (value === -1) {
          throw new Error('Non-base58 character: ' + c);
        }
        for (let j = 0; j < bytes.length; j++) {
          bytes[j] *= 58;
        }
        bytes[0] += value;
        let carry = 0;
        for (let j = 0; j < bytes.length; ++j) {
          bytes[j] += carry;
          carry = bytes[j] >> 8;
          bytes[j] &= 0xff;
        }
        while (carry > 0) {
          bytes.push(carry & 0xff);
          carry >>= 8;
        }
      }
      for (let i = 0; i < input.length && input[i] === '1'; i++) {
        bytes.push(0);
      }
      bytes.reverse();
      const uint8 = new Uint8Array(bytes);
      return new TextDecoder('utf-8').decode(uint8);
    }

    function getM3uUrl() {
      return (localStorage.getItem(STORAGE_KEY_M3U) || DEFAULT_M3U).trim();
    }

    function getSubUrl() {
      return (localStorage.getItem(STORAGE_KEY_SUB) || DEFAULT_SUB_URL).trim();
    }

    let parsedSites = [];
    let currentMode = 'tv';
    let groups = {};
    let activeChannelRow = null;
    let activeSourceItem = null;
    let currentStreamUrl = "";
    let hls = null;
    const video = document.getElementById('video');
    const wrap = document.getElementById('player-wrap');
    const statusLayer = document.getElementById('status-layer');
    const statusText = document.getElementById('status-text');
    const currentTitle = document.getElementById('current-title');
    const routeBadge = document.getElementById('current-route-badge');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');

    function setStatus(text, show = true) {
      if (show) {
        statusText.innerHTML = text;
        statusLayer.style.display = 'block';
      } else {
        statusLayer.style.display = 'none';
      }
    }

    function togglePlay() {
      if (video.paused) {
        video.play().then(() => updatePlayBtn(true)).catch(() => {});
      } else {
        video.pause();
        updatePlayBtn(false);
      }
    }

    function updatePlayBtn(isPlaying) {
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
    }

    function toggleMute() {
      video.muted = !video.muted;
      const volIcon = document.getElementById('volume-icon');
      volIcon.setAttribute('stroke', video.muted ? '#ff6b6b' : '#fff');
    }

    function toggleFullScreen() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
        return;
      }
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrap.requestFullscreen) {
          wrap.requestFullscreen().catch(() => enterPseudoFullscreen());
        } else if (wrap.webkitRequestFullscreen) {
          wrap.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        } else {
          enterPseudoFullscreen();
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function enterPseudoFullscreen() {
      wrap.classList.toggle('pseudo-fullscreen');
    }

    function openPlayer(type) {
      if (!currentStreamUrl) {
        alert("请先点击选择一条线路或视频！");
        return;
      }
      let targetScheme = "";
      const rawUrl = currentStreamUrl.trim();

      switch (type) {
        case 'vlc':
          targetScheme = navigator.userAgent.match(/(iPhone|iPad|iPod)/i) 
            ? `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}`
            : `vlc://${rawUrl}`;
          break;
        case 'potplayer':
          const cleanUrl = rawUrl.replace(/^https?:\/\//i, '');
          targetScheme = `potplayer://${cleanUrl}`;
          break;
        case 'iina':
          targetScheme = `iina://weblink?url=${encodeURIComponent(rawUrl)}`;
          break;
        case 'nplayer':
          targetScheme = `nplayer-${rawUrl}`;
          break;
        case 'aptv':
          targetScheme = `aptv://install?url=${encodeURIComponent(rawUrl)}`;
          break;
      }

      if (targetScheme) window.location.href = targetScheme;
    }

    function copyCurrentUrl() {
      if (!currentStreamUrl) {
        alert("请先选择线路或视频！");
        return;
      }
      navigator.clipboard.writeText(currentStreamUrl).then(() => {
        alert("已复制当前视频直链，可粘贴至播放器：\n" + currentStreamUrl);
      }).catch(() => {
        prompt("请手动复制链接：", currentStreamUrl);
      });
    }

    function openSourceModal() {
      document.getElementById('sub-url-input').value = getSubUrl();
      document.getElementById('source-m3u-input').value = getM3uUrl();
      document.getElementById('sub-stats-label').textContent = `当前已解析并缓存 ${parsedSites.length} 个视频源接口`;
      document.getElementById('modal-mask').style.display = 'flex';
    }

    function closeSourceModal() {
      document.getElementById('modal-mask').style.display = 'none';
    }

    function resetDefaultSource() {
      localStorage.removeItem(STORAGE_KEY_M3U);
      localStorage.removeItem(STORAGE_KEY_SUB);
      localStorage.removeItem(STORAGE_KEY_SITES);
      document.getElementById('source-m3u-input').value = DEFAULT_M3U;
      document.getElementById('sub-url-input').value = DEFAULT_SUB_URL;
      closeSourceModal();
      initSubscription();
      initTv();
    }

    // 智能解析：同时支持 MoonTV Base58 格式与明文 JSON
    function parseSubscriptionPayload(text) {
      let rawJson = text.trim();
      if (!rawJson.startsWith('{') && !rawJson.startsWith('[')) {
        try {
          rawJson = decodeBase58(rawJson);
        } catch (e) {
          throw new Error("Base58 解码失败: " + e.message);
        }
      }
      // 过滤 JSON 内部注释
      rawJson = rawJson.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '');
      const parsed = JSON.parse(rawJson);

      let sites = [];
      if (Array.isArray(parsed.sites)) {
        sites = parsed.sites;
      } else if (Array.isArray(parsed)) {
        sites = parsed;
      }

      // 提取所有带 api 字段的站点
      const valid = sites.filter(s => s && s.api && typeof s.api === 'string');
      return valid.map(s => ({
        name: s.name || s.key || '未命名源站',
        api: s.api.trim()
      }));
    }

    async function updateSubscriptionAndSave() {
      const subUrl = document.getElementById('sub-url-input').value.trim();
      const m3uUrl = document.getElementById('source-m3u-input').value.trim();

      if (m3uUrl) localStorage.setItem(STORAGE_KEY_M3U, m3uUrl);
      if (subUrl) localStorage.setItem(STORAGE_KEY_SUB, subUrl);

      document.getElementById('sub-stats-label').textContent = "正在拉取并解析 Base58 订阅...";

      try {
        let text = await fetchWithFallback(subUrl, 6000);
        const validSites = parseSubscriptionPayload(text);

        if (validSites.length === 0) {
          throw new Error("未解析到任何可用 API 视频源接口");
        }

        parsedSites = validSites;
        localStorage.setItem(STORAGE_KEY_SITES, JSON.stringify(parsedSites));
        alert(`订阅更新成功！已成功解码并载入 ${validSites.length} 个视频源接口！`);
        closeSourceModal();

        if (currentMode === 'vod') triggerSearch();
      } catch (err) {
        alert("订阅更新失败：" + (err.message || "网络超时或格式错误"));
        document.getElementById('sub-stats-label').textContent = "订阅更新失败，请重试";
      }
    }

    function initSubscription() {
      const cached = localStorage.getItem(STORAGE_KEY_SITES);
      if (cached) {
        try {
          parsedSites = JSON.parse(cached);
          if (parsedSites.length > 0) return;
        } catch (_) {}
      }
      // 初次自动拉取并解析默认源
      fetchWithFallback(DEFAULT_SUB_URL, 6000).then(text => {
        const sites = parseSubscriptionPayload(text);
        if (sites.length > 0) {
          parsedSites = sites;
          localStorage.setItem(STORAGE_KEY_SITES, JSON.stringify(parsedSites));
        }
      }).catch(() => {});
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-tv').className = 'mode-tab ' + (mode === 'tv' ? 'active' : '');
      document.getElementById('tab-vod').className = 'mode-tab ' + (mode === 'vod' ? 'active' : '');
      const filterInput = document.getElementById('filter');
      
      if (mode === 'tv') {
        filterInput.placeholder = "搜索电视频道...";
        renderList(groups, false);
      } else {
        filterInput.placeholder = "输入片名/剧名点击搜索（多源聚合匹配）...";
        const kw = filterInput.value.trim();
        if (kw) triggerSearch();
        else {
          document.getElementById('channel-list').innerHTML = 
            `<div style="padding: 30px 16px; color: #777; text-align: center; font-size: 13px;">已就绪 ${parsedSites.length} 个视频源接口。<br>在上方输入想搜的电影或电视剧名称 🔍</div>`;
        }
      }
    }

    function handleEnterSearch(e) {
      if (e.key === 'Enter') triggerSearch();
    }

    function triggerSearch() {
      const kw = document.getElementById('filter').value.trim();
      if (currentMode === 'vod') {
        if (!kw) return;
        aggregateSearchVod(kw);
      } else {
        handleSearchTv();
      }
    }

    // 多源并发聚合搜索
    async function aggregateSearchVod(keyword) {
      const container = document.getElementById('channel-list');
      container.innerHTML = `<div style="padding: 24px; color: #888; text-align: center;">正在向 ${parsedSites.length} 个视频源并发检索《${keyword}》...</div>`;

      if (parsedSites.length === 0) {
        container.innerHTML = 
          `<div style="padding: 30px 16px; color: #ff6b6b; font-size: 13px; text-align: center;">
             未检测到视频源接口，请先点击【⚙️ 订阅】点击“更新订阅并保存”！
           </div>`;
        return;
      }

      // 并发请求前 15 个源站以保证响应速度与覆盖度
      const activeSites = parsedSites.slice(0, 15);
      const searchPromises = activeSites.map(async site => {
        let apiUrl = site.api;
        if (!apiUrl.includes('?')) apiUrl += '?';
        else if (!apiUrl.endsWith('&') && !apiUrl.endsWith('?')) apiUrl += '&';
        apiUrl += `ac=videolist&wd=${encodeURIComponent(keyword)}`;

        try {
          const resText = await fetchWithFallback(apiUrl, 4500);
          const data = JSON.parse(resText);
          if (Array.isArray(data.list) && data.list.length > 0) {
            return { siteName: site.name, list: data.list };
          }
        } catch (_) {}
        return null;
      });

      const results = (await Promise.all(searchPromises)).filter(Boolean);

      if (results.length === 0) {
        container.innerHTML = `<div style="padding: 30px; color: #777; text-align: center; font-size: 13px;">在所有源站中未检索到《${keyword}》，请尝试缩短片名或更换关键词</div>`;
        return;
      }

      renderAggregatedVodResults(results);
    }

    function renderAggregatedVodResults(groupedResults) {
      const container = document.getElementById('channel-list');
      container.innerHTML = '';

      groupedResults.forEach(group => {
        const groupEl = document.createElement('div');
        groupEl.className = 'group-header';
        groupEl.innerHTML = `<span>🎬 ${group.siteName} (${group.list.length} 条结果)</span><span>▼</span>`;

        const subList = document.createElement('div');
        subList.className = 'group-channels';
        subList.style.display = 'block';

        groupEl.onclick = () => {
          const isHide = subList.style.display === 'none';
          subList.style.display = isHide ? 'block' : 'none';
          groupEl.querySelector('span:last-child').textContent = isHide ? '▼' : '▶';
        };

        group.list.forEach(item => {
          const rowEl = document.createElement('div');
          rowEl.className = 'channel-row';

          const mainEl = document.createElement('div');
          mainEl.className = 'channel-main';

          const leftEl = document.createElement('div');
          leftEl.className = 'channel-title';
          const typeNote = item.type_name ? `[${item.type_name}] ` : '';
          leftEl.innerHTML = `<span class="channel-arrow">▶</span><span>${typeNote}${item.vod_name}</span>`;

          const rightEl = document.createElement('div');
          rightEl.className = 'channel-right-tools';
          const remarkSpan = document.createElement('span');
          remarkSpan.className = 'badge-lines';
          remarkSpan.textContent = item.vod_remarks || '正片';
          rightEl.appendChild(remarkSpan);

          mainEl.appendChild(leftEl);
          mainEl.appendChild(rightEl);

          const panelEl = document.createElement('div');
          panelEl.className = 'sources-panel';
          const episodesGrid = document.createElement('div');
          episodesGrid.className = 'episodes-grid';

          const playUrlStr = item.vod_play_url || '';
          const playGroups = playUrlStr.split('$$$');
          let m3u8Group = playGroups.find(g => g.includes('.m3u8')) || playGroups[0] || '';

          const episodes = m3u8Group.split('#').filter(Boolean);
          episodes.forEach(ep => {
            const parts = ep.split('$');
            const epName = parts[0] || '正片';
            const epUrl = parts[1] || parts[0];

            if (epUrl && (epUrl.startsWith('http://') || epUrl.startsWith('https://'))) {
              const epBtn = document.createElement('button');
              epBtn.className = 'episode-btn';
              epBtn.textContent = epName;
              epBtn.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.episode-btn.active-source').forEach(el => el.classList.remove('active-source'));
                epBtn.classList.add('active-source');
                currentTitle.textContent = `${item.vod_name} - ${epName}`;
                routeBadge.style.display = 'inline-block';
                routeBadge.textContent = group.siteName;
                currentStreamUrl = epUrl.trim();
                playStream(currentStreamUrl);
              };
              episodesGrid.appendChild(epBtn);
            }
          });

          panelEl.appendChild(episodesGrid);

          mainEl.onclick = () => {
            const isExpanded = rowEl.classList.contains('expanded');
            if (!isExpanded) {
              rowEl.classList.add('expanded');
            } else {
              rowEl.classList.remove('expanded');
            }
          };

          rowEl.appendChild(mainEl);
          rowEl.appendChild(panelEl);
          subList.appendChild(rowEl);
        });

        container.appendChild(groupEl);
        container.appendChild(subList);
      });
    }

    async function fetchWithFallback(url, timeout = 5000) {
      const fetchWithTimeout = (target) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        return fetch(target, { signal: controller.signal })
          .then(res => { clearTimeout(timer); if(!res.ok) throw new Error(); return res.text(); })
          .catch(e => { clearTimeout(timer); throw e; });
      };

      try { return await fetchWithTimeout(url); } catch (_) {}
      try { return await fetchWithTimeout("https://corsproxy.io/?" + encodeURIComponent(url)); } catch (_) {}
      try { return await fetchWithTimeout("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)); } catch (_) {}
      throw new Error("连接超时或受阻");
    }

    async function initTv() {
      const targetUrl = getM3uUrl();
      try {
        const text = await fetchWithFallback(targetUrl, 3500);
        parseM3U(text);
        if (currentMode === 'tv') renderList(groups, false);
      } catch (e) {
        if (currentMode === 'tv') {
          document.getElementById('channel-list').innerHTML = 
            `<div style="padding: 30px 16px; color: #ff6b6b; font-size: 13px; text-align: center; line-height: 1.8;">
               电视源同步超时或受限<br>
               <button class="btn-source-mgr" style="margin: 10px auto;" onclick="openSourceModal()">⚙️ 点击更换电视源</button>
             </div>`;
        }
      }
    }

    function parseM3U(content) {
      groups = {};
      const lines = content.split('\n');
      let temp = null;

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const name = (line.split(',')[1] || '未命名项目').trim();
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = (groupMatch ? groupMatch[1] : '常规频道').trim();
          temp = { name, group };
        } else if (line && !line.startsWith('#') && temp) {
          if (!groups[temp.group]) groups[temp.group] = {};
          if (!groups[temp.group][temp.name]) groups[temp.group][temp.name] = [];
          if (!groups[temp.group][temp.name].includes(line)) {
            groups[temp.group][temp.name].push(line);
          }
          temp = null;
        }
      }
    }

    function renderList(targetGroups, isSearchMode = false) {
      const container = document.getElementById('channel-list');
      container.innerHTML = '';

      const groupKeys = Object.keys(targetGroups);
      if (groupKeys.length === 0) {
        container.innerHTML = `<div style="padding: 30px; color: #777; text-align: center; font-size: 13px;">未找到匹配的项目</div>`;
        return;
      }

      for (let groupName in targetGroups) {
        const channels = targetGroups[groupName];
        if (Object.keys(channels).length === 0) continue;

        const groupEl = document.createElement('div');
        groupEl.className = 'group-header';
        groupEl.innerHTML = `<span>${groupName}</span><span>▼</span>`;

        const subList = document.createElement('div');
        subList.className = 'group-channels';
        if (isSearchMode) subList.style.display = 'block';

        groupEl.onclick = () => {
          const isHide = subList.style.display === 'none';
          subList.style.display = isHide ? 'block' : 'none';
          groupEl.querySelector('span:last-child').textContent = isHide ? '▼' : '▶';
        };

        for (let chName in channels) {
          const urls = channels[chName];
          const rowEl = document.createElement('div');
          rowEl.className = 'channel-row';

          const panelEl = document.createElement('div');
          panelEl.className = 'sources-panel';
          const pingTags = [];

          urls.forEach((url, idx) => {
            const itemEl = document.createElement('div');
            itemEl.className = 'source-item';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'source-name';
            nameSpan.textContent = `线路 ${idx + 1}`;

            const pingTag = document.createElement('span');
            pingTag.className = 'ping-tag';
            pingTags.push({ url, tag: pingTag });

            itemEl.appendChild(nameSpan);
            itemEl.appendChild(pingTag);

            itemEl.onclick = (e) => {
              e.stopPropagation();
              playSelectedSource(chName, idx + 1, url, rowEl, itemEl);
            };

            panelEl.appendChild(itemEl);
          });

          const mainEl = document.createElement('div');
          mainEl.className = 'channel-main';

          const leftEl = document.createElement('div');
          leftEl.className = 'channel-title';
          leftEl.innerHTML = `<span class="channel-arrow">▶</span><span>${chName}</span>`;

          const rightEl = document.createElement('div');
          rightEl.className = 'channel-right-tools';

          const badgeEl = document.createElement('span');
          badgeEl.className = 'badge-lines';
          badgeEl.textContent = `${urls.length} 路线`;

          const pingBtn = document.createElement('button');
          pingBtn.className = 'btn-ping-channel';
          pingBtn.innerHTML = `⚡ 测速`;
          
          pingBtn.onclick = (e) => {
            e.stopPropagation();
            if (!rowEl.classList.contains('expanded')) {
              rowEl.classList.add('expanded');
            }
            pingTags.forEach(item => {
              measureStreamLatency(item.url, item.tag);
            });
          };

          rightEl.appendChild(badgeEl);
          rightEl.appendChild(pingBtn);

          mainEl.appendChild(leftEl);
          mainEl.appendChild(rightEl);

          mainEl.onclick = () => {
            const isExpanded = rowEl.classList.contains('expanded');
            document.querySelectorAll('.channel-row.expanded').forEach(el => {
              if (el !== rowEl) el.classList.remove('expanded');
            });

            if (!isExpanded) {
              rowEl.classList.add('expanded');
              const firstItem = panelEl.querySelector('.source-item');
              playSelectedSource(chName, 1, urls[0], rowEl, firstItem);
            } else {
              rowEl.classList.remove('expanded');
            }
          };

          rowEl.appendChild(mainEl);
          rowEl.appendChild(panelEl);
          subList.appendChild(rowEl);
        }

        container.appendChild(groupEl);
        container.appendChild(subList);
      }
    }

    function measureStreamLatency(url, tagElement) {
      tagElement.style.display = 'inline-block';
      tagElement.textContent = '测速中...';
      tagElement.className = 'ping-tag ping-testing';

      const startTime = performance.now();
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3500);

      fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-cache', signal: controller.signal })
        .then(() => {
          clearTimeout(timer);
          const duration = Math.round(performance.now() - startTime);
          tagElement.textContent = `${duration}ms`;
          tagElement.className = 'ping-tag ' + (duration < 400 ? 'ping-fast' : duration < 900 ? 'ping-medium' : 'ping-slow');
        })
        .catch(() => {
          clearTimeout(timer);
          tagElement.textContent = "无法连通";
          tagElement.className = 'ping-tag ping-slow';
        });
    }

    function playSelectedSource(chName, routeIndex, url, rowEl, itemEl) {
      if (activeChannelRow) activeChannelRow.classList.remove('playing');
      if (activeSourceItem) activeSourceItem.classList.remove('active-source');

      activeChannelRow = rowEl;
      activeSourceItem = itemEl;

      if (rowEl) rowEl.classList.add('playing');
      if (itemEl) itemEl.classList.add('active-source');

      currentTitle.textContent = chName;
      routeBadge.style.display = 'inline-block';
      routeBadge.textContent = `线 ${routeIndex}`;
      currentStreamUrl = url;

      playStream(url);
    }

    function playStream(url) {
      setStatus("正在建立连接...");

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("", false);
          video.play().then(() => updatePlayBtn(true)).catch(() => {
            setStatus("请轻触视频画面或播放按钮开始播放");
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            setStatus("当前网页环境受限无法硬解该流格式<br><span style='color:#aaa;font-size:12px;'>请点击下方对应图标直接唤醒外部播放器</span>", true);
            updatePlayBtn(false);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false);
          updatePlayBtn(true);
        }).catch(() => {
          setStatus("当前网页环境受限无法硬解该流格式<br><span style='color:#aaa;font-size:12px;'>请点击下方对应图标直接唤醒外部播放器</span>", true);
          updatePlayBtn(false);
        });
      }
    }

    video.addEventListener('playing', () => {
      setStatus("", false);
      updatePlayBtn(true);
    });

    video.addEventListener('pause', () => updatePlayBtn(false));

    function handleSearchTv() {
      const kw = document.getElementById('filter').value.trim().toLowerCase();
      if (!kw) {
        renderList(groups, false);
        return;
      }
      const filtered = {};
      for (let g in groups) {
        for (let ch in groups[g]) {
          if (ch.toLowerCase().includes(kw) || g.toLowerCase().includes(kw)) {
            if (!filtered[g]) filtered[g] = {};
            filtered[g][ch] = groups[g][ch];
          }
        }
      }
      renderList(filtered, true);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSubscription();
      initTv();
    });
  </script>
</body>
