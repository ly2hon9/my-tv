<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f0f">
  <title>拾光影院</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #0f0f0f; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; display: flex; flex-direction: column; }

    #player-wrap { 
      width: 100%; height: 40vh; min-height: 240px; background: #000; position: relative; 
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: default;
    }
    #player-wrap.pseudo-fullscreen {
      position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 99999 !important; max-height: none !important;
    }

    video { width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; transition: object-fit 0.2s; }
    video.fit-cover { object-fit: cover; }
    video.fit-fill { object-fit: fill; }

    #top-bar { 
      position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); 
      display: flex; justify-content: space-between; align-items: center; z-index: 10; transition: opacity 0.3s ease;
    }
    .top-left-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #current-title { font-size: 14px; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #btn-fav-toggle { background: none; border: none; font-size: 18px; cursor: pointer; color: #aaa; transition: transform 0.15s, color 0.15s; line-height: 1; flex-shrink: 0; }
    #btn-fav-toggle.active { color: #facc15; transform: scale(1.15); }
    #current-route-badge { font-size: 11px; background: #0070f3; color: #fff; padding: 2px 6px; border-radius: 4px; display: none; flex-shrink: 0; }

    #status-layer { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 8; 
      color: #fff; background: rgba(25, 25, 25, 0.9); backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.15); padding: 12px 20px; border-radius: 12px; 
      font-size: 13px; pointer-events: none; display: none; text-align: center; max-width: 85%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); line-height: 1.6;
    }

    #gesture-tip {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 8px 16px; border-radius: 20px;
      font-size: 13px; z-index: 9; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }

    #custom-controls {
      position: absolute; bottom: 0; left: 0; right: 0; 
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 75%, transparent 100%); 
      display: flex; flex-direction: column; z-index: 15; transition: opacity 0.3s ease;
    }
    #player-wrap.controls-hidden #custom-controls,
    #player-wrap.controls-hidden #top-bar { opacity: 0; pointer-events: none; }
    #player-wrap.controls-hidden { cursor: none; }

    #progress-container {
      width: 100%; height: 18px; cursor: pointer; display: flex; align-items: center; padding: 0 10px; touch-action: none; user-select: none;
    }
    #progress-track {
      width: 100%; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; position: relative; transition: height 0.15s ease;
    }
    #progress-container.dragging #progress-track,
    #progress-container:hover #progress-track { height: 5px; }
    #progress-bar { height: 100%; width: 0%; background: #0070f3; border-radius: 2px; position: relative; }
    #progress-thumb {
      width: 12px; height: 12px; border-radius: 50%; background: #fff; position: absolute; right: -6px; top: 50%; 
      transform: translateY(-50%) scale(0); transition: transform 0.15s ease; box-shadow: 0 0 6px rgba(0,0,0,0.8); pointer-events: none;
    }
    #progress-container.dragging #progress-thumb,
    #progress-container:hover #progress-thumb { transform: translateY(-50%) scale(1); }

    .controls-inner { 
      height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 6px;
    }
    .ctrl-left { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85; transition: opacity 0.2s; font-size: 12px; padding: 2px; }
    .ctrl-btn:hover { opacity: 1; }
    .ctrl-time { font-size: 11px; color: #aaa; font-family: monospace; white-space: nowrap; user-select: none; }
    
    .pill-btn {
      font-size: 11px; font-weight: 600; padding: 2px 5px; border-radius: 4px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #ddd; white-space: nowrap;
    }

    .volume-box { display: flex; align-items: center; gap: 4px; }
    .volume-slider { width: 50px; height: 3px; -webkit-appearance: none; background: rgba(255,255,255,0.3); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }

    .ctrl-right { display: flex; align-items: center; gap: 6px; min-width: 0; }

    .external-group { 
      display: flex; align-items: center; gap: 5px; 
      background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px); 
      padding: 3px 6px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); 
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 1; max-width: 140px;
    }
    .external-group::-webkit-scrollbar { display: none; }
    .ext-btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer; padding: 0; flex-shrink: 0; }
    .ext-btn svg { width: 14px; height: 14px; }

    #sidebar { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #161616; border-top: 1px solid #282828; }
    #search-box { 
      padding: 10px 12px; background: #1f1f1f; border-bottom: 1px solid #2b2b2b; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; 
    }

    .search-row-primary { display: flex; align-items: center; gap: 8px; width: 100%; }
    .search-row-secondary { display: flex; align-items: center; gap: 6px; width: 100%; }

    .search-input-wrap { flex: 1; position: relative; display: flex; align-items: center; }
    #search-box input { width: 100%; padding: 8px 28px 8px 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 13px; outline: none; }
    .btn-clear-kw { position: absolute; right: 8px; color: #777; cursor: pointer; font-size: 14px; display: none; }

    .btn-search { background: #0070f3; border: none; color: #fff; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    
    .btn-tool-mid { 
      flex: 1; background: #2b2b2b; border: 1px solid #444; color: #eee; border-radius: 6px; 
      padding: 7px 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; text-align: center;
    }
    .btn-tool-mid:hover { background: #383838; }
    .btn-tool-mid.active { background: #0070f3; border-color: #0070f3; color: #fff; }
    
    .btn-source-mgr { 
      flex: 1; background: #2b2b2b; border: 1px solid #444; color: #eee; border-radius: 6px; 
      padding: 7px 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; text-align: center;
    }

    .mode-tab-group { display: flex; gap: 6px; }
    .mode-tab { flex: 1; padding: 6px 0; background: #252525; border: 1px solid #383838; color: #999; font-size: 12px; border-radius: 4px; cursor: pointer; text-align: center; }
    .mode-tab.active { background: #0070f3; color: #fff; border-color: #0070f3; font-weight: 500; }

    #channel-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .sources-header-bar { 
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; 
      background: #1c1c1c; border-bottom: 1px solid #282828; 
    }
    .sources-header-title { font-size: 13px; font-weight: bold; color: #fff; }
    .btn-sort-speed { 
      background: #238636; border: 1px solid #2ea043; color: #fff; border-radius: 4px; 
      padding: 3px 10px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 3px; font-weight: 500;
    }
    .btn-sort-speed:active { background: #1e702e; }

    .title-group-box { border-bottom: 1px solid #252525; background: #161616; }
    .title-group-header {
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; transition: background 0.15s;
    }
    .title-group-header:hover { background: #1f1f1f; }
    .title-group-box.active-group .title-group-header { background: #152438; border-left: 3px solid #0070f3; }
    .group-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .group-poster {
      width: 44px; height: 60px; border-radius: 4px; object-fit: cover; background: #222; flex-shrink: 0;
    }
    .group-info-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .group-main-title { font-size: 14px; font-weight: bold; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-meta-tag { font-size: 11px; color: #888; display: flex; align-items: center; gap: 6px; }
    .group-badge-count { background: #2a2a2a; color: #0070f3; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
    .group-arrow { font-size: 12px; color: #777; transition: transform 0.2s ease; }
    .title-group-box.expanded .group-arrow { transform: rotate(90deg); color: #0070f3; }

    .group-body-panel { display: none; background: #111; padding: 6px 10px 12px 10px; border-top: 1px solid #222; }
    .title-group-box.expanded .group-body-panel { display: block; }

    .episodes-collapse-box { 
      background: #181818; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
    }
    .episodes-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #ddd; }
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
    .ep-item { background: #222; border: 1px solid #333; padding: 5px 2px; border-radius: 4px; font-size: 11px; color: #bbb; text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ep-item.active { background: #0070f3; color: #fff; border-color: #0070f3; font-weight: bold; }

    .source-sub-card { 
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; margin-top: 6px; background: #191919; border: 1px solid #282828; 
      border-radius: 6px; cursor: pointer; transition: background 0.15s;
    }
    .source-sub-card:hover { background: #222; }
    .source-sub-card.active-sub { border-color: #0070f3; background: #0e243f; }
    
    .source-sub-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .card-sitename-tag { background: #2a2a2a; padding: 2px 6px; border-radius: 3px; font-size: 11px; color: #ddd; font-weight: 500; }
    .source-sub-card.active-sub .card-sitename-tag { background: #0070f3; color: #fff; }
    
    /* 动态清晰度徽章样式 */
    .card-quality { font-size: 10px; background: #283e2e; color: #4ade80; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
    .card-quality.q-4k { background: #4a2828; color: #f87171; }
    .card-quality.q-1080 { background: #283e2e; color: #4ade80; }
    .card-quality.q-720 { background: #26354a; color: #60a5fa; }
    .card-quality.q-normal { background: #2b2b2b; color: #bbb; }

    .card-status-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: monospace; }
    .metric-ping-ok { color: #4ade80; }
    .metric-ping-warn { color: #facc15; }
    .metric-ping-err { color: #f87171; }
    .metric-ping-wait { color: #888; }

    .history-card { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #222; background: #181818; cursor: pointer; }
    .history-card:hover { background: #222; }
    .history-info { flex: 1; min-width: 0; }
    .history-title { font-size: 14px; font-weight: 500; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; gap: 10px; align-items: center; }
    .btn-del-item { background: none; border: none; color: #666; font-size: 14px; cursor: pointer; padding: 4px; }
    .btn-del-item:hover { color: #ef4444; }

    .group-header { padding: 12px 16px; background: #222; font-size: 13px; font-weight: bold; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; user-select: none; }
    .channel-row { border-bottom: 1px solid #222; background: #181818; }
    .channel-main { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .channel-title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .channel-row.expanded .channel-arrow { transform: rotate(90deg); color: #0070f3; }
    .channel-row.playing .channel-title { color: #0070f3; font-weight: bold; }
    .sources-panel { display: none; background: #111; padding: 8px 12px 12px 16px; border-top: 1px solid #242424; }
    .channel-row.expanded .sources-panel { display: block; }
    .source-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-top: 6px; background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 6px; cursor: pointer; }
    .source-item.active-source { border-color: #0070f3; background: #0d2847; }

    #modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 16px; }
    #source-modal { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 520px; padding: 20px; box-shadow: 0 16px 36px rgba(0,0,0,0.8); }
    #source-modal h3 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input-label { font-size: 12px; color: #aaa; margin-top: 10px; margin-bottom: 4px; display: block; }
    #source-modal input { width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 13px; outline: none; }
    .sub-stats { font-size: 12px; color: #0070f3; margin-top: 6px; }
    
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn-action { padding: 8px 14px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .btn-cancel { background: #333; color: #eee; }
    .btn-sync { background: #238636; color: #fff; }
    .btn-save { background: #0070f3; color: #fff; }

    @media (max-width: 600px) {
      .volume-slider { display: none; }
      .pip-btn { display: none; }
    }

    @media (min-width: 601px) {
      .search-row-primary { flex: 1; }
      .search-row-secondary { width: auto; flex-shrink: 0; gap: 6px; }
      .btn-tool-mid, .btn-source-mgr { flex: none; padding: 8px 12px; }
      .external-group { max-width: none; }
    }

    @media (min-width: 768px) {
      body { flex-direction: row; }
      #sidebar { width: 420px; border-top: none; border-right: 1px solid #282828; height: 100%; }
      #player-wrap { flex: 1; height: 100%; min-height: auto; }
    }
  </style>
</head>
<body>

  <div id="player-wrap">
    <div id="top-bar">
      <div class="top-left-title">
        <div id="current-title">请选择视频或频道</div>
        <button id="btn-fav-toggle" onclick="toggleCurrentFavorite()" title="收藏当前项目">★</button>
      </div>
      <div id="current-route-badge"></div>
    </div>
    
    <div id="status-layer">
      <span class="icon">📺</span>
      <div id="status-text">正在连接直播源...</div>
    </div>

    <div id="gesture-tip"></div>

    <video id="video" autoplay playsinline webkit-playsinline></video>

    <!-- 底部控制栏 -->
    <div id="custom-controls">
      <div id="progress-container">
        <div id="progress-track">
          <div id="progress-bar">
            <div id="progress-thumb"></div>
          </div>
        </div>
      </div>

      <div class="controls-inner">
        <div class="ctrl-left">
          <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()" title="播放/暂停">
            <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="#fff"><polygon points="6,4 20,12 6,20"/></svg>
            <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="#fff" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          
          <button class="ctrl-btn pill-btn" id="speed-btn" onclick="cyclePlaybackRate()" title="倍速">1.0倍</button>
          <button class="ctrl-btn pill-btn" id="ratio-btn" onclick="cycleAspectRatio()" title="画面比例">适应</button>
          
          <div class="volume-box">
            <button class="ctrl-btn" onclick="toggleMute()" title="静音切换">
              <svg id="volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <input type="range" class="volume-slider" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
          </div>

          <span class="ctrl-time" id="stream-time">00:00 / 00:00</span>
        </div>

        <div class="ctrl-right">
          <div class="external-group" title="横向滑动选择播放器">
            <button class="ext-btn" onclick="copyCurrentUrl()" title="复制直链">
              <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('vlc')" title="VLC 播放器">
              <svg viewBox="0 0 48 48">
                <path fill="#FF8800" d="M24 4c-.9 0-1.7.6-1.9 1.5L16.2 32h15.6l-5.9-26.5c-.2-.9-1-1.5-1.9-1.5z"/>
                <path fill="#FFFFFF" d="M19.1 19h9.8l-1.8-8h-6.2l-1.8 8z"/>
                <path fill="#FFFFFF" d="M16.9 29h14.2l-1.6-7H18.5l-1.6 7z"/>
                <path fill="#FF8800" d="M7 40c0 2.2 7.6 4 17 4s17-1.8 17-4l-3-6H10l-3 6z"/>
                <ellipse cx="24" cy="40" rx="17" ry="3.5" fill="#E65100"/>
                <path fill="#FF9800" d="M10 34h28l-2.4 5H12.4L10 34z"/>
              </svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('potplayer')" title="PotPlayer 播放器">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC800"/><polygon points="9,7 17,12 9,17" fill="#333"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('iina')" title="IINA 播放器">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#4B3869"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('nplayer')" title="nPlayer 播放器">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#007AFF"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('aptv')" title="APTV 播放器">
              <svg viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="4" fill="#000"/><polygon points="8,6 16,12 8,18" fill="#30D158"/></svg>
            </button>
          </div>

          <button class="ctrl-btn pip-btn" onclick="togglePiP()" title="画中画小窗">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1"/></svg>
          </button>

          <button class="ctrl-btn" onclick="toggleFullScreen()" title="全屏模式">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div id="search-box">
      <div class="search-row-primary">
        <div class="search-input-wrap">
          <input type="text" id="filter" placeholder="搜索片名、视频、电视频道..." onkeydown="handleEnterSearch(event)" oninput="toggleClearBtn(this.value)">
          <span class="btn-clear-kw" id="clear-kw" onclick="clearSearchInput()">✕</span>
        </div>
        <button class="btn-search" onclick="triggerSearch()">搜索</button>
      </div>

      <div class="search-row-secondary">
        <button class="btn-tool-mid" id="btn-show-fav" onclick="switchSidebarView('fav')">⭐ 我的收藏</button>
        <button class="btn-tool-mid" id="btn-show-history" onclick="switchSidebarView('history')">🕒 播放历史</button>
        <button class="btn-source-mgr" onclick="openSourceModal()">⚙ 订阅配置</button>
      </div>

      <div class="mode-tab-group">
        <button class="mode-tab" id="tab-tv" onclick="switchMode('tv')">📺 电视直播</button>
        <button class="mode-tab active" id="tab-vod" onclick="switchMode('vod')">🎬 选集与换源</button>

    <div id="channel-list">
      <div style="padding: 24px; color: #888; text-align: center;">正在同步资源列表...</div>

  <!-- 订阅配置弹窗 -->
  <div id="modal-mask">
    <div id="source-modal">
      <h3>
        <span>订阅与配置 (云数据库存储)</span>
        <span style="font-size:14px;color:#888;cursor:pointer;" onclick="closeSourceModal()">✕</span>
      </h3>
      <label class="input-label">影视订阅地址：</label>
      <input type="text" id="sub-url-input" placeholder="输入影视订阅地址">
      <div class="sub-stats">数据将永久安全保存在云数据库中</div>

      <label class="input-label">电视直播源地址（M3U）：</label>
      <input type="text" id="source-m3u-input" placeholder="输入直播源 M3U 地址">

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeSourceModal()">取消</button>
        <button class="btn-action btn-sync" id="btn-modal-sync" onclick="manualSyncSubscription()">🔄 同步更新源</button>
        <button class="btn-action btn-save" onclick="saveToD1()">保存配置</button>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function isSafeUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const t = url.trim().toLowerCase();
      return t.startsWith('http://') || t.startsWith('https://');
    }

    // 智能画质解析：剔除原先强行标记 720p 的逻辑
    function parseQualityTag(remarks) {
      if (!remarks) return { text: '正片', cls: 'q-normal' };
      const r = remarks.toUpperCase();
      if (r.includes('4K') || r.includes('2160')) return { text: '4K', cls: 'q-4k' };
      if (r.includes('1080') || r.includes('BD') || r.includes('蓝光') || r.includes('FHD')) return { text: '1080p', cls: 'q-1080' };
      if (r.includes('720') || r.includes('HD')) return { text: '720p', cls: 'q-720' };
      if (r.includes('TC') || r.includes('抢先')) return { text: 'TC', cls: 'q-normal' };
      return { text: remarks.length <= 6 ? remarks : '正片', cls: 'q-normal' };
    }

    async function getD1Data(key, defaultVal = '') {
      try {
        const res = await fetch(`/api/data?key=${encodeURIComponent(key)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.value !== null && data.value !== undefined) {
            localStorage.setItem(key, data.value);
            return data.value;
          }
        }
      } catch (_) {}
      return localStorage.getItem(key) || defaultVal;
    }

    async function setD1Data(key, value) {
      const valStr = typeof value === 'object' ? JSON.stringify(value) : String(value);
      localStorage.setItem(key, valStr);
      try {
        await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value: valStr })
        });
      } catch (_) {}
    }

    const KEY_M3U = "custom_tv_m3u_url";
    const KEY_SUB = "custom_vod_sub_url";
    const KEY_SITES = "cached_parsed_sites";
    const KEY_HISTORY = "history_list_v2";
    const KEY_FAVS = "favorites_list_v2";

    const B58_CHARS = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const B58_MAP = {};
    for (let i = 0; i < B58_CHARS.length; i++) B58_MAP[B58_CHARS[i]] = i;

    function decodeBase58(string) {
      if (!string || typeof string !== 'string') return '';
      const input = string.trim();
      let leadingOnes = 0;
      while (leadingOnes < input.length && input[leadingOnes] === '1') leadingOnes++;

      const bytes = [0];
      for (let i = leadingOnes; i < input.length; i++) {
        const c = input[i];
        if (!(c in B58_MAP)) throw new Error('无效字符: ' + c);
        for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
        bytes[0] += B58_MAP[c];
        let carry = 0;
        for (let j = 0; j < bytes.length; ++j) {
          bytes[j] += carry;
          carry = bytes[j] >> 8;
          bytes[j] &= 0xff;
        }
        while (carry > 0) {
          bytes.push(carry & 0xff);
          carry >>= 8;
        }
      }

      const result = new Uint8Array(leadingOnes + bytes.length);
      for (let i = 0; i < leadingOnes; i++) result[i] = 0;
      for (let i = 0; i < bytes.length; i++) result[leadingOnes + i] = bytes[bytes.length - 1 - i];
      return new TextDecoder('utf-8').decode(result);
    }

    let parsedSites = [];
    let currentMode = 'vod';
    let currentView = 'normal';
    let groups = {};
    let currentStreamUrl = "";
    
    let groupedVodList = [];
    let activeGroupTitle = "";
    let activeSubItemId = "";
    let currentActiveEp = 0;
    let isLiveMode = false;
    let hls = null;

    let isDraggingProgress = false;
    let dragTargetTime = 0;
    let currentVodUniqueKey = "";
    let currentPlayingMeta = null;
    let controlsHideTimer = null;

    const RATES = [1.0, 1.25, 1.5, 2.0, 0.75];
    let currentRateIdx = 0;

    const RATIOS = [
      { text: "适应", class: "" },
      { text: "裁剪", class: "fit-cover" },
      { text: "拉伸", class: "fit-fill" }
    ];
    let currentRatioIdx = 0;

    const video = document.getElementById('video');
    const wrap = document.getElementById('player-wrap');
    const statusLayer = document.getElementById('status-layer');
    const statusText = document.getElementById('status-text');
    const currentTitle = document.getElementById('current-title');
    const routeBadge = document.getElementById('current-route-badge');
    const favToggleBtn = document.getElementById('btn-fav-toggle');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const streamTimeEl = document.getElementById('stream-time');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressTrack = document.getElementById('progress-track');
    const speedBtn = document.getElementById('speed-btn');
    const ratioBtn = document.getElementById('ratio-btn');
    const gestureTip = document.getElementById('gesture-tip');
    const volSlider = document.getElementById('vol-slider');

    function setStatus(text, show = true) {
      if (show) {
        statusText.innerHTML = text;
        statusLayer.style.display = 'block';
      } else {
        statusLayer.style.display = 'none';
      }
    }

    function showGestureTip(text) {
      gestureTip.textContent = text;
      gestureTip.style.opacity = '1';
      setTimeout(() => { gestureTip.style.opacity = '0'; }, 800);
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showControls() {
      wrap.classList.remove('controls-hidden');
      clearTimeout(controlsHideTimer);
      if (!video.paused && !isDraggingProgress) {
        controlsHideTimer = setTimeout(() => wrap.classList.add('controls-hidden'), 3500);
      }
    }

    wrap.addEventListener('mousemove', showControls);
    wrap.addEventListener('pointerdown', showControls);

    let lastTapTime = 0;
    wrap.addEventListener('touchend', (e) => {
      const now = performance.now();
      const rect = wrap.getBoundingClientRect();
      const touch = e.changedTouches[0];
      if (now - lastTapTime < 300) {
        const xRatio = (touch.clientX - rect.left) / rect.width;
        if (xRatio < 0.35) {
          if (!isLiveMode) {
            video.currentTime = Math.max(0, video.currentTime - 10);
            showGestureTip("⏪ 快退 10 秒");
          }
        } else if (xRatio > 0.65) {
          if (!isLiveMode) {
            video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
            showGestureTip("⏩ 快进 10 秒");
          }
        } else {
          togglePlay();
          showGestureTip(video.paused ? "⏸ 暂停" : "▶ 播放");
        }
      }
      lastTapTime = now;
      showControls();
    }, { passive: true });

    function cyclePlaybackRate() {
      currentRateIdx = (currentRateIdx + 1) % RATES.length;
      const rate = RATES[currentRateIdx];
      video.playbackRate = rate;
      speedBtn.textContent = `${rate}倍`;
      showGestureTip(`倍速：${rate}x`);
    }

    function cycleAspectRatio() {
      currentRatioIdx = (currentRatioIdx + 1) % RATIOS.length;
      const item = RATIOS[currentRatioIdx];
      video.className = item.class;
      ratioBtn.textContent = item.text;
      showGestureTip(`画面比例：${item.text}`);
    }

    function changeVolume(val) {
      video.volume = parseFloat(val);
      video.muted = (val == 0);
      document.getElementById('volume-icon').setAttribute('stroke', video.muted ? '#ff6b6b' : '#fff');
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (video.requestPictureInPicture) await video.requestPictureInPicture();
      } catch (_) {
        alert("当前浏览器暂不支持画中画");
      }
    }

    video.addEventListener('ended', () => {
      if (isLiveMode || !currentPlayingMeta) return;
      const activeGroup = groupedVodList.find(g => g.title === activeGroupTitle);
      if (!activeGroup) return;
      const currentItem = activeGroup.items.find(r => r.id === activeSubItemId) || activeGroup.items[0];
      const episodes = getEpisodesList(currentItem);
      if (episodes.length > 0 && currentActiveEp < episodes.length - 1) {
        const nextEpIdx = currentActiveEp + 1;
        setStatus(`🎉 本集播放完毕，自动连播第 ${nextEpIdx + 1} 集...`, true);
        setTimeout(() => {
          currentActiveEp = nextEpIdx;
          renderGroupedVodSources();
          playCurrentVodSource(currentItem, nextEpIdx);
        }, 1500);
      }
    });

    // 关键优化：根据真实底层解码高度动态校准画质徽章
    video.addEventListener('loadedmetadata', () => {
      if (video.videoHeight && routeBadge.style.display !== 'none') {
        let realRes = '720p';
        if (video.videoHeight >= 2160) realRes = '4K';
        else if (video.videoHeight >= 1080) realRes = '1080p';
        else if (video.videoHeight >= 720) realRes = '720p';
        else realRes = `${video.videoHeight}p`;
        routeBadge.textContent = `${currentPlayingMeta?.siteName || ''} · ${realRes}`;
      }
    });

    async function getFavoritesList() {
      const data = await getD1Data(KEY_FAVS, '[]');
      try { return Array.isArray(JSON.parse(data)) ? JSON.parse(data) : []; } catch (_) { return []; }
    }

    async function getHistoryList() {
      const data = await getD1Data(KEY_HISTORY, '[]');
      try { return Array.isArray(JSON.parse(data)) ? JSON.parse(data) : []; } catch (_) { return []; }
    }

    function updateFavIconState() {
      if (!currentPlayingMeta) {
        favToggleBtn.classList.remove('active');
        return;
      }
      getFavoritesList().then(favs => {
        const isFav = favs.some(f => f.title === currentPlayingMeta.title && f.epName === (currentPlayingMeta.epName || '正片'));
        favToggleBtn.classList.toggle('active', isFav);
      });
    }

    async function toggleCurrentFavorite() {
      if (!currentPlayingMeta) { alert("请先选择播放项目！"); return; }
      let favs = await getFavoritesList();
      const currentEpName = currentPlayingMeta.epName || '正片';
      const idx = favs.findIndex(f => f.title === currentPlayingMeta.title && f.epName === currentEpName);
      
      if (idx >= 0) {
        favs.splice(idx, 1);
        setStatus("已取消收藏", true);
      } else {
        favs.unshift({
          title: currentPlayingMeta.title,
          epName: currentEpName,
          url: currentStreamUrl,
          type: isLiveMode ? 'tv' : 'vod',
          siteName: currentPlayingMeta.siteName || '',
          thumb: currentPlayingMeta.thumb || '',
          savedAt: new Date().toLocaleDateString()
        });
        setStatus("⭐ 已加入收藏", true);
      }
      setTimeout(() => setStatus("", false), 1500);
      await setD1Data(KEY_FAVS, favs);
      updateFavIconState();
      if (currentView === 'fav') renderFavoritesView();
    }

    let lastSavedTime = 0;
    async function savePlaybackProgress() {
      if (isLiveMode || !currentPlayingMeta || !video.duration || video.currentTime < 2) return;
      const nowSec = Math.floor(video.currentTime);
      if (Math.abs(nowSec - lastSavedTime) < 4) return;
      lastSavedTime = nowSec;

      let history = await getHistoryList();
      const existingIdx = history.findIndex(h => h.key === currentVodUniqueKey);
      const item = {
        key: currentVodUniqueKey,
        title: currentPlayingMeta.title,
        epName: currentPlayingMeta.epName || '正片',
        url: currentStreamUrl,
        time: nowSec,
        duration: Math.floor(video.duration),
        siteName: currentPlayingMeta.siteName || '',
        thumb: currentPlayingMeta.thumb || '',
        updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      if (existingIdx >= 0) history.splice(existingIdx, 1);
      history.unshift(item);
      if (history.length > 50) history.pop();
      setD1Data(KEY_HISTORY, history);
    }

    async function restorePlaybackProgress() {
      if (isLiveMode || !currentVodUniqueKey) return;
      const history = await getHistoryList();
      const record = history.find(h => h.key === currentVodUniqueKey);
      if (record && record.time > 5 && (!video.duration || record.time < video.duration - 15)) {
        video.currentTime = record.time;
        setStatus(`已自动跳转至进度：${formatTime(record.time)}`, true);
        setTimeout(() => setStatus("", false), 1800);
      }
    }

    function switchSidebarView(view) {
      currentView = view;
      document.getElementById('btn-show-fav').classList.toggle('active', view === 'fav');
      document.getElementById('btn-show-history').classList.toggle('active', view === 'history');

      if (view === 'fav') renderFavoritesView();
      else if (view === 'history') renderHistoryView();
      else {
        if (currentMode === 'tv') renderList(groups, false);
        else renderGroupedVodSources();
      }
    }

    async function renderFavoritesView() {
      const container = document.getElementById('channel-list');
      container.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">正在读取收藏...</div>';
      const favs = await getFavoritesList();

      if (favs.length === 0) {
        container.innerHTML = `<div style="padding:40px 16px;text-align:center;color:#777;font-size:13px;">暂无收藏项目<br><span style="font-size:11px;color:#555;">播放时轻触顶部的 ★ 即可收藏</span></div>`;
        return;
      }

      container.innerHTML = `
        <div class="sources-header-bar">
          <span class="sources-header-title">⭐ 我的收藏 (${favs.length})</span>
          <button class="btn-search" style="padding:2px 8px;font-size:11px;" onclick="switchSidebarView('normal')">返回</button>
        </div>
      `;

      favs.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-info">
            <div class="history-title">${escapeHtml(item.title)} <span style="font-size:12px;color:#0070f3;">(${escapeHtml(item.epName || '正片')})</span></div>
            <div class="history-meta">
              <span>${item.type === 'tv' ? '📺 电视' : '🎬 影视'}</span>
              <span>${escapeHtml(item.siteName)}</span>
              <span>${escapeHtml(item.savedAt)}</span>
            </div>
          </div>
          <button class="btn-del-item" title="删除" onclick="event.stopPropagation(); removeFavoriteItem(${idx})">✕</button>
        `;

        card.onclick = () => {
          if (item.type === 'tv') {
            isLiveMode = true;
            currentStreamUrl = item.url;
            currentTitle.textContent = item.title;
            routeBadge.style.display = 'inline-block';
            routeBadge.textContent = '直播';
            currentPlayingMeta = { title: item.title, epName: '直播', siteName: '直播' };
            manualPlayOnly(item.url);
          } else {
            document.getElementById('filter').value = item.title;
            toggleClearBtn(item.title);
            switchMode('vod');
            triggerSearch();
          }
        };
        container.appendChild(card);
      });
    }

    async function removeFavoriteItem(idx) {
      let favs = await getFavoritesList();
      favs.splice(idx, 1);
      await setD1Data(KEY_FAVS, favs);
      updateFavIconState();
      renderFavoritesView();
    }

    async function renderHistoryView() {
      const container = document.getElementById('channel-list');
      container.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">正在读取历史...</div>';
      const history = await getHistoryList();

      if (history.length === 0) {
        container.innerHTML = `<div style="padding:40px 16px;text-align:center;color:#777;font-size:13px;">暂无播放历史记录<br><span style="font-size:11px;color:#555;">播放视频时将自动在此记录进度</span></div>`;
        return;
      }

      container.innerHTML = `
        <div class="sources-header-bar">
          <span class="sources-header-title">🕒 播放历史 (${history.length})</span>
          <div>
            <button class="btn-search" style="padding:2px 8px;font-size:11px;background:#cf222e;margin-right:6px;" onclick="clearAllHistory()">清空</button>
            <button class="btn-search" style="padding:2px 8px;font-size:11px;" onclick="switchSidebarView('normal')">返回</button>
          </div>
        </div>
      `;

      history.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-info">
            <div class="history-title">${escapeHtml(item.title)} <span style="font-size:12px;color:#0070f3;">(${escapeHtml(item.epName)})</span></div>
            <div class="history-meta">
              <span>看到：${formatTime(item.time)} / ${formatTime(item.duration)}</span>
              <span>${escapeHtml(item.siteName)}</span>
              <span>${escapeHtml(item.updatedAt || '')}</span>
            </div>
          </div>
          <button class="btn-del-item" title="删除" onclick="event.stopPropagation(); removeHistoryItem(${idx})">✕</button>
        `;

        card.onclick = () => {
          isLiveMode = false;
          currentStreamUrl = item.url;
          currentVodUniqueKey = item.key;
          currentTitle.textContent = `${item.title} - ${item.epName}`;
          routeBadge.style.display = 'inline-block';
          routeBadge.textContent = item.siteName;
          currentPlayingMeta = { title: item.title, epName: item.epName, siteName: item.siteName };
          updateFavIconState();
          manualPlayOnly(item.url);
        };
        container.appendChild(card);
      });
    }

    async function removeHistoryItem(idx) {
      let history = await getHistoryList();
      history.splice(idx, 1);
      await setD1Data(KEY_HISTORY, history);
      renderHistoryView();
    }

    async function clearAllHistory() {
      if (!confirm("确定清空全部历史记录吗？")) return;
      await setD1Data(KEY_HISTORY, []);
      renderHistoryView();
    }

    video.addEventListener('timeupdate', () => {
      savePlaybackProgress();
      if (isDraggingProgress) return;

      if (isLiveMode || !video.duration || !isFinite(video.duration)) {
        streamTimeEl.textContent = "直播";
        progressBar.style.width = "100%";
        return;
      }
      const cur = video.currentTime;
      const dur = video.duration;
      streamTimeEl.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      progressBar.style.width = `${(cur / dur) * 100}%`;
    });

    function calcProgressRatio(clientX) {
      const rect = progressTrack.getBoundingClientRect();
      return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    }

    function onPointerDown(e) {
      if (isLiveMode || !video.duration || !isFinite(video.duration)) return;
      isDraggingProgress = true;
      showControls();
      progressContainer.classList.add('dragging');
      progressContainer.setPointerCapture(e.pointerId);

      const ratio = calcProgressRatio(e.clientX);
      progressBar.style.width = `${ratio * 100}%`;
      dragTargetTime = ratio * video.duration;
      streamTimeEl.textContent = `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
    }

    function onPointerMove(e) {
      if (!isDraggingProgress) return;
      showControls();
      const ratio = calcProgressRatio(e.clientX);
      progressBar.style.width = `${ratio * 100}%`;
      dragTargetTime = ratio * video.duration;
      streamTimeEl.textContent = `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
    }

    function onPointerUp(e) {
      if (!isDraggingProgress) return;
      isDraggingProgress = false;
      progressContainer.classList.remove('dragging');
      try { progressContainer.releasePointerCapture(e.pointerId); } catch (_) {}
      video.currentTime = dragTargetTime;
      showControls();
    }

    progressContainer.addEventListener('pointerdown', onPointerDown);
    progressContainer.addEventListener('pointermove', onPointerMove);
    progressContainer.addEventListener('pointerup', onPointerUp);
    progressContainer.addEventListener('pointercancel', onPointerUp);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.code) {
        case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
        case 'ArrowLeft': case 'KeyJ': e.preventDefault(); if (!isLiveMode) { video.currentTime = Math.max(0, video.currentTime - 10); showControls(); } break;
        case 'ArrowRight': case 'KeyL': e.preventDefault(); if (!isLiveMode) { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showControls(); } break;
        case 'ArrowUp': e.preventDefault(); changeVolume(Math.min(1, video.volume + 0.1)); volSlider.value = video.volume; showControls(); break;
        case 'ArrowDown': e.preventDefault(); changeVolume(Math.max(0, video.volume - 0.1)); volSlider.value = video.volume; showControls(); break;
        case 'KeyM': e.preventDefault(); toggleMute(); break;
        case 'KeyF': e.preventDefault(); toggleFullScreen(); break;
      }
    });

    function togglePlay() {
      if (video.paused) video.play().then(() => { updatePlayBtn(true); showControls(); }).catch(() => {});
      else { video.pause(); updatePlayBtn(false); showControls(); }
    }

    function updatePlayBtn(isPlaying) {

    async function manualSyncSubscription() {
      const subUrl = (document.getElementById('sub-url-input').value || '').trim();
      const m3uUrl = (document.getElementById('source-m3u-input').value || '').trim();

      if (!subUrl && !m3uUrl) { alert("请先输入订阅或直播源地址！"); return; }
      const syncBtn = document.getElementById('btn-modal-sync');
      syncBtn.textContent = "⏳ 正在同步...";
      syncBtn.disabled = true;

      if (subUrl) await setD1Data(KEY_SUB, subUrl);
      if (m3uUrl) await setD1Data(KEY_M3U, m3uUrl);

      let msg = [];
      if (subUrl) {
        try {
          let text = await fetchWithSmartProxy(subUrl, 6000);
          let sites = parseSubscriptionPayload(text);
          if (sites.length === 0 && subUrl.includes('format=2')) {
            text = await fetchWithSmartProxy(subUrl.replace('format=2', 'format=1'), 6000);
            sites = parseSubscriptionPayload(text);
          }
          if (sites.length > 0) {
            parsedSites = sites;
            await setD1Data(KEY_SITES, JSON.stringify(parsedSites));
            msg.push(`影视源已更新: ${sites.length} 个`);
          } else msg.push(`影视源解析为空`);
        } catch (e) { msg.push(`影视源更新失败: ${e.message}`); }
      }

      if (m3uUrl) {
        try {
          await initTv();
          msg.push(`电视直播源已刷新`);
        } catch (e) { msg.push(`电视源失败: ${e.message}`); }
      }

      syncBtn.textContent = "🔄 同步更新源";
      syncBtn.disabled = false;
      closeSourceModal();
      alert("同步完成:\n" + msg.join('\n'));
    }

    function extractSitesFromAnyJson(parsed) {
      const results = [];
      if (!parsed || typeof parsed !== 'object') return results;
      if (parsed.api_site && typeof parsed.api_site === 'object') {
        for (let key in parsed.api_site) {
          const item = parsed.api_site[key];
          if (item?.api && isSafeUrl(item.api)) results.push({ name: item.name || key, api: item.api.trim() });
        }
      }
      let list = Array.isArray(parsed) ? parsed : (parsed.video?.sites) || parsed.sites || [];
      for (const item of list) {
        const api = item.api || item.url;
        if (api && typeof api === 'string' && isSafeUrl(api)) results.push({ name: item.name || item.key || '影视源', api: api.trim() });
      }
      return results;
    }

    function parseSubscriptionPayload(text) {
      let raw = text.trim();
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (_) {
        try {
          const decoded = decodeBase58(raw);
          parsed = JSON.parse(decoded.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, ''));
        } catch (_) {}
      }
      return extractSitesFromAnyJson(parsed);
    }

    async function fetchWithSmartProxy(targetUrl, timeout = 5000) {
      const fetchWithTimer = (url) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        return fetch(url, { signal: controller.signal })
          .then(res => { clearTimeout(timer); if (!res.ok) throw new Error(); return res.text(); })
          .catch(e => { clearTimeout(timer); throw e; });
      };

      try { return await fetchWithTimer(targetUrl); } catch (_) {}
      try { return await fetchWithTimer(`/api/data?action=proxy&proxy_url=${encodeURIComponent(targetUrl)}`); } catch (_) {}
      throw new Error("网络抓取受阻");
    }

    function normalizeTitle(rawTitle) { return rawTitle ? String(rawTitle).trim() : "未知影视"; }

    async function asyncPool(poolLimit, array, iteratorFn) {
      const ret = [];
      const executing = [];
      for (const item of array) {
        const p = Promise.resolve().then(() => iteratorFn(item));
        ret.push(p);
        if (poolLimit <= array.length) {
          const e = p.then(() => executing.splice(executing.indexOf(e), 1));
          executing.push(e);
          if (executing.length >= poolLimit) await Promise.race(executing);
        }
      }
      return Promise.all(ret);
    }

    async function probeStreamLatency(testUrl) {
      if (!isSafeUrl(testUrl)) return 9999;
      const t0 = performance.now();
      try {
        await fetch(testUrl, { method: 'HEAD', mode: 'no-cors', cache: 'no-cache' });
        return Math.round(performance.now() - t0);
      } catch (_) { return 9999; }
    }

    async function fastStreamSearchVod(keyword) {
      const container = document.getElementById('channel-list');
      container.innerHTML = `<div style="padding: 24px; color: #888; text-align: center;">⚡ 正在全源并发检索《${escapeHtml(keyword)}》...</div>`;
      
      groupedVodList = [];
      let autoPlayLock = false;

      await asyncPool(5, parsedSites, async (site) => {
        let apiUrl = site.api + (site.api.includes('?') ? '&' : '?') + `ac=videolist&wd=${encodeURIComponent(keyword)}&out=json&pg=1`;

        try {
          const resText = await fetchWithSmartProxy(apiUrl, 4500);
          const data = JSON.parse(resText);

          if (Array.isArray(data.list) && data.list.length > 0) {
            data.list.forEach((item, itemIdx) => {
              const exactTitle = normalizeTitle(item.vod_name);
              const uniqueId = `${site.name}_${item.vod_id || itemIdx}_${exactTitle}`;
              
              const itemResult = {
                id: uniqueId,
                siteName: site.name,
                vod: item,
                ping: -1
              };

              let group = groupedVodList.find(g => g.title === exactTitle);
              if (!group) {
                group = {
                  title: exactTitle,
                  poster: isSafeUrl(item.vod_pic) ? item.vod_pic : '',
                  type: item.type_name || '',
                  items: []
                };
                groupedVodList.push(group);
              }
              group.items.push(itemResult);
            });

            if (currentView === 'normal') renderGroupedVodSources();

            if (!autoPlayLock && groupedVodList.length > 0) {
              autoPlayLock = true;
              activeGroupTitle = groupedVodList[0].title;
              activeSubItemId = groupedVodList[0].items[0].id;
              currentActiveEp = 0;
              playCurrentVodSource(groupedVodList[0].items[0], 0);
              startSpeedTest();
            }
          }
        } catch (_) {}
      });

      if (groupedVodList.length === 0 && currentView === 'normal') {
        container.innerHTML = `<div style="padding: 30px; color: #777; text-align: center; font-size: 13px;">未检索到《${escapeHtml(keyword)}》，请更换关键词</div>`;
      }
    }

    async function startSpeedTest() {
      const activeGroup = groupedVodList.find(g => g.title === activeGroupTitle);
      if (!activeGroup?.items?.length) return;
      
      const sortBtn = document.querySelector('.btn-sort-speed');
      if (sortBtn) {
        sortBtn.textContent = "⚡ 测速中...";
        sortBtn.disabled = true;
      }

      await Promise.allSettled(activeGroup.items.map(async (item) => {
        const episodes = getEpisodesList(item);
        const targetEp = episodes[currentActiveEp] || episodes[0];
        const testUrl = targetEp ? targetEp.url : (item.vod.vod_play_url || '');
        item.ping = await probeStreamLatency(testUrl);
      }));

      activeGroup.items.sort((a, b) => {
        const pa = a.ping < 0 ? 9999 : a.ping;
        const pb = b.ping < 0 ? 9999 : b.ping;
        return pa - pb;
      });

      renderGroupedVodSources();

      if (sortBtn) {
        sortBtn.textContent = "⚡ 测速";
        sortBtn.disabled = false;
      }
    }

    function getEpisodesList(item) {
      if (!item?.vod) return [];
      const playUrlStr = item.vod.vod_play_url || '';
      const playGroups = playUrlStr.split('$$$');
      const m3u8Group = playGroups.find(g => g.includes('.m3u8')) || playGroups[0] || '';
      const rawEps = m3u8Group.split('#').filter(Boolean);

      return rawEps.map((ep, idx) => {
        const parts = ep.split('$');
        const urlCandidate = (parts[1] || parts[0]).trim();
        return { name: parts[0] || `第${idx+1}集`, url: isSafeUrl(urlCandidate) ? urlCandidate : '' };
      }).filter(ep => ep.url !== '');
    }

    function playCurrentVodSource(item, epIdx = 0) {
      if (!item?.vod) return;
      isLiveMode = false;

      const episodes = getEpisodesList(item);
      const targetEp = episodes[epIdx] || episodes[0];
      if (!targetEp?.url) return;

      let rawUrl = targetEp.url;
      if (window.location.protocol === 'https:' && rawUrl.startsWith('http://')) {
        rawUrl = rawUrl.replace('http://', 'https://');
      }

      currentVodUniqueKey = `${item.vod.vod_name}_${targetEp.name}`;
      currentTitle.textContent = `${item.vod.vod_name} - ${targetEp.name}`;
      routeBadge.style.display = 'inline-block';
      routeBadge.textContent = item.siteName;
      currentStreamUrl = rawUrl;

      currentPlayingMeta = {
        title: item.vod.vod_name,
        epName: targetEp.name,
        siteName: item.siteName,
        thumb: item.vod.vod_pic || ''
      };
      updateFavIconState();
      manualPlayOnly(rawUrl);
    }

    function destroyHlsInstance() {
      if (hls) {
        hls.stopLoad();
        hls.detachMedia();
        hls.destroy();
        hls = null;
      }
    }

    function manualPlayOnly(url) {
      setStatus("正在建立连接...");
      destroyHlsInstance();

      const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) && !window.MSStream;

      if (isApple && video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false); updatePlayBtn(true); restorePlaybackProgress(); showControls();
        }).catch(() => setStatus("请轻触画面或播放按钮起播"));
        video.onerror = () => showFailTip();
        return;
      }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          xhrSetup: (xhr) => { xhr.withCredentials = false; }
        });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("", false); 
          video.play().then(() => { 
            updatePlayBtn(true); 
            restorePlaybackProgress(); 
            showControls(); 
          }).catch(() => setStatus("请轻触画面开始播放"));
        });

        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
              case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
              default:
                destroyHlsInstance();
                showFailTip();
                updatePlayBtn(false);
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false); updatePlayBtn(true); restorePlaybackProgress(); showControls();
        }).catch(() => { showFailTip(); updatePlayBtn(false); });
      }
    }

    function showFailTip() {
      setStatus("当前线路受限<br><span style='color:#aaa;font-size:12px;'>请在右侧列表中手动选择其他源，或点击下方播放器图标一键秒播</span>", true);
    }

    async function initTv() {
      const targetUrl = await getD1Data(KEY_M3U, '');
      if (!targetUrl) return;
      try {
        const text = await fetchWithSmartProxy(targetUrl, 4000);
        parseM3U(text);
        if (currentMode === 'tv' && currentView === 'normal') renderList(groups, false);
      } catch (_) {}
    }

    function parseM3U(content) {
      groups = {};
      const lines = content.split('\n');
      let temp = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const rawName = (line.split(',')[1] || '').trim();
          const tvgMatch = line.match(/tvg-name="([^"]+)"/);
          const name = tvgMatch ? tvgMatch[1] : (rawName || '未命名频道');
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = (groupMatch ? groupMatch[1] : '常规频道').trim();
          temp = { name, group };
        } else if (line && !line.startsWith('#') && temp) {
          if (isSafeUrl(line)) {
            if (!groups[temp.group]) groups[temp.group] = {};
            if (!groups[temp.group][temp.name]) groups[temp.group][temp.name] = [];
            if (!groups[temp.group][temp.name].includes(line)) groups[temp.group][temp.name].push(line);
          }
          temp = null;
        }
      }
    }

    function renderList(targetGroups, isSearchMode = false) {
      const container = document.getElementById('channel-list');
      container.innerHTML = '';
      for (let groupName in targetGroups) {
        const channels = targetGroups[groupName];
        if (Object.keys(channels).length === 0) continue;
        const groupEl = document.createElement('div');
        groupEl.className = 'group-header';
        groupEl.innerHTML = `<span>${escapeHtml(groupName)}</span><span>▼</span>`;
        const subList = document.createElement('div');
        subList.className = 'group-channels';
        if (isSearchMode) subList.style.display = 'block';

        groupEl.onclick = () => {
          const isHide = subList.style.display === 'none';
          subList.style.display = isHide ? 'block' : 'none';
          groupEl.querySelector('span:last-child').textContent = isHide ? '▼' : '▶';
        };

        for (let chName in channels) {
          const urls = channels[chName];
          const rowEl = document.createElement('div');
          rowEl.className = 'channel-row';
          const panelEl = document.createElement('div');
          panelEl.className = 'sources-panel';

          urls.forEach((url, idx) => {
            const itemEl = document.createElement('div');
            itemEl.className = 'source-item';
            itemEl.innerHTML = `<span class="source-name">线路 ${idx + 1}</span>`;
            itemEl.onclick = (e) => {
              e.stopPropagation();
              isLiveMode = true;
              currentVodUniqueKey = "";
              document.querySelectorAll('.source-item.active-source').forEach(el => el.classList.remove('active-source'));
              itemEl.classList.add('active-source');
              currentTitle.textContent = chName;
              routeBadge.style.display = 'inline-block';
              routeBadge.textContent = `线 ${idx + 1}`;
              currentStreamUrl = url;
              currentPlayingMeta = { title: chName, epName: '直播', siteName: `线路 ${idx + 1}` };
              updateFavIconState();
              manualPlayOnly(url);
            };
            panelEl.appendChild(itemEl);
          });

          const mainEl = document.createElement('div');
          mainEl.className = 'channel-main';
          mainEl.innerHTML = `
            <div class="channel-title"><span class="channel-arrow">▶</span><span>${escapeHtml(chName)}</span></div>
            <div class="channel-right-tools"><span class="badge-lines">${urls.length} 路线</span></div>
          `;

          mainEl.onclick = () => {
            const isExpanded = rowEl.classList.contains('expanded');
            document.querySelectorAll('.channel-row.expanded').forEach(el => el !== rowEl && el.classList.remove('expanded'));
            if (!isExpanded) {
              rowEl.classList.add('expanded');
              panelEl.querySelector('.source-item')?.click();
            } else {
              rowEl.classList.remove('expanded');
            }
          };

          rowEl.appendChild(mainEl);
          rowEl.appendChild(panelEl);
          subList.appendChild(rowEl);
        }
        container.appendChild(groupEl);
        container.appendChild(subList);
      }
    }

    function handleSearchTv() {
      const kw = document.getElementById('filter').value.trim().toLowerCase();
      if (!kw) { renderList(groups, false); return; }
      const filtered = {};
      for (let g in groups) {
        for (let ch in groups[g]) {
          if (ch.toLowerCase().includes(kw) || g.toLowerCase().includes(kw)) {
            if (!filtered[g]) filtered[g] = {};
            filtered[g][ch] = groups[g][ch];
          }
        }
      }
      renderList(filtered, true);
    }

    video.addEventListener('playing', () => { setStatus("", false); updatePlayBtn(true); showControls(); });
    video.addEventListener('pause', () => { updatePlayBtn(false); showControls(); });

    // 开页只从 D1 纯净加载，零多余外部请求
    window.addEventListener('DOMContentLoaded', async () => {
      const cachedSites = await getD1Data(KEY_SITES, null);
      if (cachedSites) {
        try {
          const parsed = typeof cachedSites === 'object' ? cachedSites : JSON.parse(cachedSites);
          if (Array.isArray(parsed) && parsed.length > 0) parsedSites = parsed;
        } catch (_) {}
      }
      initTv();
      switchMode('vod');
    });
  </script>
</body>
</html>
