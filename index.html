    #player-wrap {

      height: 42vh; 
      min-height: 250px; 
      background: #000; 
      position: relative; 
      flex-shrink: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
    }
    
    #player-wrap.pseudo-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      max-height: none !important;

    video { width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; }

    #top-bar {

      padding: 12px 18px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 10; pointer-events: none; 
    }
    #current-title { font-size: 16px; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    #current-route-badge { font-size: 12px; background: #0070f3; color: #fff; padding: 2px 8px; border-radius: 4px; display: none; }

    #status-layer { 
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 8; 
      color: #fff; 
      background: rgba(25, 25, 25, 0.88); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.12); 
      padding: 14px 22px; 
      border-radius: 12px; 
      font-size: 13px; 
      pointer-events: none; 
      display: none; 
      text-align: center; 
      max-width: 85%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      line-height: 1.6;
    }
    #status-layer .icon { font-size: 20px; margin-bottom: 4px; display: block; }

    #custom-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 15;
    }

    .ctrl-left { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85; transition: opacity 0.2s; }
    .ctrl-btn:hover { opacity: 1; }
    .ctrl-time { font-size: 12px; color: #aaa; font-family: monospace; }

    .ctrl-right { display: flex; align-items: center; gap: 10px; }

    .external-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 3px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .ext-btn {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: none;
      background: rgba(255,255,255,0.9);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, background 0.2s;
