<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>聚合影视与电视直播</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #0f0f0f; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; }

    #player-wrap { 
      width: 100%; 
      height: 42vh; 
      min-height: 250px; 
      background: #000; 
      position: relative; 
      flex-shrink: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden;
    }
    
    #player-wrap.pseudo-fullscreen {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      z-index: 99999 !important; max-height: none !important;
    }

    video { width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; }

    #top-bar { 
      position: absolute; top: 0; left: 0; right: 0; 
      padding: 12px 18px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); 
      display: flex; justify-content: space-between; align-items: center; 
      z-index: 10; pointer-events: none; 
    }
    #current-title { font-size: 15px; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    #current-route-badge { font-size: 12px; background: #0070f3; color: #fff; padding: 2px 8px; border-radius: 4px; display: none; }

    #status-layer { 
      position: absolute; 
      top: 50%; left: 50%; 
      transform: translate(-50%, -50%); 
      z-index: 8; 
      color: #fff; 
      background: rgba(25, 25, 25, 0.88); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.12); 
      padding: 14px 22px; 
      border-radius: 12px; 
      font-size: 13px; 
      pointer-events: none; 
      display: none; 
      text-align: center; 
      max-width: 85%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      line-height: 1.6;
    }

    #custom-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 75%, transparent 100%);
      display: flex;
      flex-direction: column;
      z-index: 15;
    }

    #progress-container {
      width: 100%;
      height: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    #progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      position: relative;
      transition: height 0.15s;
    }
    #progress-container:hover #progress-track { height: 6px; }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #0070f3;
      border-radius: 2px;
      position: relative;
    }
    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      transition: transform 0.15s;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    #progress-container:hover #progress-thumb { transform: translateY(-50%) scale(1); }

    .controls-inner {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .ctrl-left { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85; transition: opacity 0.2s; }
    .ctrl-btn:hover { opacity: 1; }
    .ctrl-time { font-size: 12px; color: #aaa; font-family: monospace; white-space: nowrap; }

    .ctrl-right { display: flex; align-items: center; gap: 8px; }

    .external-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 3px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .ext-btn {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; border: none;
      background: rgba(255,255,255,0.9);
      cursor: pointer; padding: 0;
      transition: transform 0.1s, background 0.2s;
    }
    .ext-btn:hover { transform: scale(1.1); background: #fff; }
    .ext-btn:active { transform: scale(0.92); }
    .ext-btn svg { width: 16px; height: 16px; }

    #sidebar { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #161616; border-top: 1px solid #282828; }
    
    #search-box { 
      padding: 10px 12px; 
      background: #1f1f1f; 
      border-bottom: 1px solid #2b2b2b; 
      flex-shrink: 0; 
      display: flex; 
      flex-direction: column;
      gap: 8px; 
    }
    .search-row { display: flex; align-items: center; gap: 8px; }
    #search-box input { 
      flex: 1; padding: 8px 14px; 
      border-radius: 6px; border: 1px solid #444; 
      background: #111; color: #fff; font-size: 14px; outline: none; 
    }
    .btn-search {
      background: #0070f3; border: none; color: #fff;
      border-radius: 6px; padding: 8px 14px; font-size: 13px;
      cursor: pointer; font-weight: 500; white-space: nowrap;
    }
    .btn-search:active { background: #005bb5; }

    .mode-tab-group { display: flex; gap: 6px; }
    .mode-tab {
      flex: 1; padding: 6px 0;
      background: #252525; border: 1px solid #383838;
      color: #999; font-size: 12px; border-radius: 4px;
      cursor: pointer; text-align: center;
    }
    .mode-tab.active { background: #0070f3; color: #fff; border-color: #0070f3; font-weight: 500; }

    .btn-source-mgr {
      background: #2b2b2b; border: 1px solid #444; color: #eee;
      border-radius: 6px; padding: 8px 12px; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }

    #channel-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* MoonTV 选集面板 */
    .episodes-collapse-box {
      background: #191919;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 14px;
    }
    .episodes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
    }
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 6px;
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .ep-item {
      background: #222;
      border: 1px solid #333;
      padding: 6px 2px;
      border-radius: 4px;
      font-size: 12px;
      color: #bbb;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ep-item:hover { background: #2a2a2a; color: #fff; }
    .ep-item.active { background: #0070f3; color: #fff; border-color: #0070f3; font-weight: bold; }

    .sources-header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #1c1c1c; border-bottom: 1px solid #282828;
    }
    .sources-header-title { font-size: 13px; font-weight: bold; color: #fff; }

    .source-card {
      display: flex; gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #222;
      background: #161616;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .source-card:hover { background: #1f1f1f; }
    .source-card.active { background: #11253e; border-left: 3px solid #0070f3; }
    
    .card-thumb {
      width: 50px; height: 68px; border-radius: 4px;
      object-fit: cover; background: #2a2a2a; flex-shrink: 0;
    }
    .card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .card-title { font-size: 13px; font-weight: 500; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-quality { font-size: 10px; background: #283e2e; color: #4ade80; padding: 1px 5px; border-radius: 3px; font-weight: 600; flex-shrink: 0; }

    .card-sitename {
      font-size: 11px; color: #aaa; margin: 3px 0;
      display: flex; align-items: center; gap: 4px;
    }
    .card-sitename-tag {
      background: #262626; padding: 1px 5px; border-radius: 3px; color: #ddd;
    }

    .card-status-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #777; font-family: monospace;
    }
    .status-metrics { display: flex; gap: 8px; }
    .metric-speed { color: #4ade80; }
    .metric-ping { color: #facc15; }

    /* 电视直播样式 */
    .group-header { padding: 12px 16px; background: #222; font-size: 13px; font-weight: bold; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; user-select: none; }
    .channel-row { border-bottom: 1px solid #222; background: #181818; }
    .channel-main { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; user-select: none; }
    .channel-main:active { background: #222; }
    .channel-title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .channel-arrow { font-size: 11px; color: #777; transition: transform 0.2s; }
    .channel-row.expanded .channel-arrow { transform: rotate(90deg); color: #0070f3; }
    .channel-row.playing .channel-title { color: #0070f3; font-weight: bold; }
    .channel-right-tools { display: flex; align-items: center; gap: 8px; }
    .badge-lines { font-size: 11px; background: #333; color: #bbb; padding: 2px 7px; border-radius: 10px; }
    .sources-panel { display: none; background: #111; padding: 8px 12px 12px 16px; border-top: 1px solid #242424; }
    .channel-row.expanded .sources-panel { display: block; }
    .source-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-top: 6px; background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 6px; cursor: pointer; }
    .source-item.active-source { border-color: #0070f3; background: #0d2847; }

    /* 弹窗 */
    #modal-mask {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      z-index: 10000; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #source-modal {
      background: #1c1c1c; border: 1px solid #333; border-radius: 12px;
      width: 100%; max-width: 520px; padding: 20px; box-shadow: 0 16px 36px rgba(0,0,0,0.8);
    }
    #source-modal h3 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input-label { font-size: 12px; color: #aaa; margin-top: 10px; margin-bottom: 4px; display: block; }
    #source-modal input {
      width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid #444;
      background: #111; color: #fff; font-size: 13px; outline: none;
    }
    .sub-stats { font-size: 12px; color: #0070f3; margin-top: 6px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn-action { padding: 8px 16px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; }
    .btn-cancel { background: #333; color: #eee; }
    .btn-save { background: #0070f3; color: #fff; }

    @media (min-width: 768px) {
      body { flex-direction: row; }
      #sidebar { width: 420px; border-top: none; border-right: 1px solid #282828; height: 100%; }
      #player-wrap { flex: 1; height: 100%; min-height: auto; }
    }
  </style>
</head>
<body>

  <div id="player-wrap">
    <div id="top-bar">
      <div id="current-title">请选择视频或频道</div>
      <div id="current-route-badge"></div>
    </div>
    
    <div id="status-layer">
      <span class="icon">📺</span>
      <div id="status-text">正在连接直播源...</div>
    </div>

    <video id="video" autoplay playsinline webkit-playsinline></video>

    <!-- 底部控制栏 -->
    <div id="custom-controls">
      <div id="progress-container" onclick="seek(event)">
        <div id="progress-track">
          <div id="progress-bar">
            <div id="progress-thumb"></div>
          </div>
        </div>
      </div>

      <div class="controls-inner">
        <div class="ctrl-left">
          <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()" title="播放/暂停">
            <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="#fff"><polygon points="6,4 20,12 6,20"/></svg>
            <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="#fff" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <span class="ctrl-time" id="stream-time">00:00 / 00:00</span>
        </div>

        <div class="ctrl-right">
          <div class="external-group" title="使用第三方播放器打开该流">
            <button class="ext-btn" onclick="copyCurrentUrl()" title="复制直链">
              <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('vlc')" title="VLC 播放器">
              <svg viewBox="0 0 48 48">
                <path fill="#FF8800" d="M24 4c-.9 0-1.7.6-1.9 1.5L16.2 32h15.6l-5.9-26.5c-.2-.9-1-1.5-1.9-1.5z"/>
                <path fill="#FFFFFF" d="M19.1 19h9.8l-1.8-8h-6.2l-1.8 8z"/>
                <path fill="#FFFFFF" d="M16.9 29h14.2l-1.6-7H18.5l-1.6 7z"/>
                <path fill="#FF8800" d="M7 40c0 2.2 7.6 4 17 4s17-1.8 17-4l-3-6H10l-3 6z"/>
                <ellipse cx="24" cy="40" rx="17" ry="3.5" fill="#E65100"/>
                <path fill="#FF9800" d="M10 34h28l-2.4 5H12.4L10 34z"/>
              </svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('potplayer')" title="PotPlayer">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC800"/><polygon points="9,7 17,12 9,17" fill="#333"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('iina')" title="IINA">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#4B3869"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('nplayer')" title="nPlayer">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#007AFF"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('aptv')" title="APTV">
              <svg viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="4" fill="#000"/><polygon points="8,6 16,12 8,18" fill="#30D158"/></svg>
            </button>
          </div>

          <button class="ctrl-btn" onclick="toggleMute()" title="音量/静音">
            <svg id="volume-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>

          <button class="ctrl-btn" onclick="toggleFullScreen()" title="全屏">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div id="search-box">
      <div class="search-row">
        <input type="text" id="filter" placeholder="搜索片名、视频、电视频道..." onkeydown="handleEnterSearch(event)">
        <button class="btn-search" onclick="triggerSearch()">搜索</button>
        <button class="btn-source-mgr" onclick="openSourceModal()">⚙️ 订阅</button>
      </div>
      <div class="mode-tab-group">
        <button class="mode-tab" id="tab-tv" onclick="switchMode('tv')">📺 电视直播</button>
        <button class="mode-tab active" id="tab-vod" onclick="switchMode('vod')">🎬 选集与换源</button>
      </div>
    </div>
    <div id="channel-list">
      <div style="padding: 24px; color: #888; text-align: center;">正在同步资源列表...</div>
    </div>
  </div>

  <div id="modal-mask">
    <div id="source-modal">
      <h3>
        <span>订阅与配置</span>
        <span style="font-size:14px;color:#888;cursor:pointer;" onclick="closeSourceModal()">✕</span>
      </h3>
      <label class="input-label">影视订阅 URL：</label>
      <input type="text" id="sub-url-input" placeholder="https://pz.v88.qzz.io?format=2&source=jingjian">
      <div class="sub-stats" id="sub-stats-label">每次打开网页将自动同步最新配置</div>

      <label class="input-label">电视直播源（M3U 地址）：</label>
      <input type="text" id="source-m3u-input" placeholder="https://www.luyizhong.eu.org/hotel_tvn.m3u">

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="resetDefaultSource()">恢复默认</button>
        <button class="btn-action btn-save" onclick="manualSaveSubscription()">保存配置</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_M3U = "https://www.luyizhong.eu.org/hotel_tvn.m3u";
    const DEFAULT_SUB_URL = "https://pz.v88.qzz.io?format=2&source=jingjian";

    const BUILTIN_MOONTV_SITES = [
      { name: "暴风资源", api: "https://bfzy.tv/api.php/provide/vod" },
      { name: "量子资源", api: "https://cj.lzycaiji.com/api.php/provide/vod" },
      { name: "豪华资源", api: "https://hhzyapi.com/api.php/provide/vod" },
      { name: "新浪资源", api: "https://api.xinlangapi.com/api.php/provide/vod" },
      { name: "红牛资源", api: "https://www.hongniuzy2.com/api.php/provide/vod" },
      { name: "光速资源", api: "https://api.guangsuapi.com/api.php/provide/vod" },
      { name: "速播资源", api: "https://subocaiji.com/api.php/provide/vod" },
      { name: "极速资源", api: "https://jszyapi.com/api.php/provide/vod" },
      { name: "电影天堂", api: "http://caiji.dyttzyapi.com/api.php/provide/vod" }
    ];

    const STORAGE_KEY_M3U = "custom_tv_m3u_url";
    const STORAGE_KEY_SUB = "custom_vod_sub_url";
    const STORAGE_KEY_SITES = "cached_parsed_sites";

    const B58_MAP = {};
    const B58_CHARS = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    for (let i = 0; i < B58_CHARS.length; i++) B58_MAP[B58_CHARS[i]] = i;

    function decodeBase58(string) {
      if (!string || typeof string !== 'string') return '';
      string = string.trim();
      const bytes = [0];
      for (let i = 0; i < string.length; i++) {
        const c = string[i];
        if (!(c in B58_MAP)) throw new Error('无效字符');
        for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
        bytes[0] += B58_MAP[c];
        let carry = 0;
        for (let j = 0; j < bytes.length; ++j) {
          bytes[j] += carry;
          carry = bytes[j] >> 8;
          bytes[j] &= 0xff;
        }
        while (carry > 0) {
          bytes.push(carry & 0xff);
          carry >>= 8;
        }
      }
      for (let i = 0; i < string.length && string[i] === '1'; i++) bytes.push(0);
      bytes.reverse();
      return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
    }

    let parsedSites = [...BUILTIN_MOONTV_SITES];
    let currentMode = 'vod';
    let groups = {};
    let currentStreamUrl = "";
    let currentVodResults = [];
    let currentActiveIndex = 0;
    let currentActiveEp = 0;
    let isLiveMode = false;
    let autoFailoverCount = 0; // 自动故障转移计数器
    let hls = null;

    const video = document.getElementById('video');
    const wrap = document.getElementById('player-wrap');
    const statusLayer = document.getElementById('status-layer');
    const statusText = document.getElementById('status-text');
    const currentTitle = document.getElementById('current-title');
    const routeBadge = document.getElementById('current-route-badge');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const streamTimeEl = document.getElementById('stream-time');
    const progressBar = document.getElementById('progress-bar');

    function setStatus(text, show = true) {
      if (show) {
        statusText.innerHTML = text;
        statusLayer.style.display = 'block';
      } else {
        statusLayer.style.display = 'none';
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    video.addEventListener('timeupdate', () => {
      if (isLiveMode || !video.duration || !isFinite(video.duration)) {
        streamTimeEl.textContent = "直播";
        progressBar.style.width = "100%";
        return;
      }
      const cur = video.currentTime;
      const dur = video.duration;
      streamTimeEl.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      const pct = (cur / dur) * 100;
      progressBar.style.width = `${pct}%`;
    });

    function seek(e) {
      if (isLiveMode || !video.duration || !isFinite(video.duration)) return;
      const rect = document.getElementById('progress-track').getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      const targetPercent = Math.max(0, Math.min(1, clickX / width));
      video.currentTime = targetPercent * video.duration;
    }

    function togglePlay() {
      if (video.paused) {
        video.play().then(() => updatePlayBtn(true)).catch(() => {});
      } else {
        video.pause();
        updatePlayBtn(false);
      }
    }

    function updatePlayBtn(isPlaying) {
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';
    }

    function toggleMute() {
      video.muted = !video.muted;
      const volIcon = document.getElementById('volume-icon');
      volIcon.setAttribute('stroke', video.muted ? '#ff6b6b' : '#fff');
    }

    function toggleFullScreen() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
        return;
      }
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => enterPseudoFullscreen());
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        else enterPseudoFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function enterPseudoFullscreen() {
      wrap.classList.toggle('pseudo-fullscreen');
    }

    function openPlayer(type) {
      if (!currentStreamUrl) {
        alert("请先选择一条线路或视频！");
        return;
      }
      let targetScheme = "";
      const rawUrl = currentStreamUrl.trim();

      switch (type) {
        case 'vlc':
          targetScheme = navigator.userAgent.match(/(iPhone|iPad|iPod)/i) 
            ? `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}`
            : `vlc://${rawUrl}`;
          break;
        case 'potplayer':
          const cleanUrl = rawUrl.replace(/^https?:\/\//i, '');
          targetScheme = `potplayer://${cleanUrl}`;
          break;
        case 'iina':
          targetScheme = `iina://weblink?url=${encodeURIComponent(rawUrl)}`;
          break;
        case 'nplayer':
          targetScheme = `nplayer-${rawUrl}`;
          break;
        case 'aptv':
          targetScheme = `aptv://install?url=${encodeURIComponent(rawUrl)}`;
          break;
      }

      if (targetScheme) window.location.href = targetScheme;
    }

    function copyCurrentUrl() {
      if (!currentStreamUrl) {
        alert("请先选择线路或视频！");
        return;
      }
      navigator.clipboard.writeText(currentStreamUrl).then(() => {
        alert("已复制当前视频直链，可粘贴至播放器：\n" + currentStreamUrl);
      }).catch(() => {
        prompt("请手动复制链接：", currentStreamUrl);
      });
    }

    function openSourceModal() {
      document.getElementById('sub-url-input').value = (localStorage.getItem(STORAGE_KEY_SUB) || DEFAULT_SUB_URL).trim();
      document.getElementById('source-m3u-input').value = (localStorage.getItem(STORAGE_KEY_M3U) || DEFAULT_M3U).trim();
      document.getElementById('modal-mask').style.display = 'flex';
    }

    function closeSourceModal() {
      document.getElementById('modal-mask').style.display = 'none';
    }

    function resetDefaultSource() {
      localStorage.removeItem(STORAGE_KEY_M3U);
      localStorage.removeItem(STORAGE_KEY_SUB);
      localStorage.removeItem(STORAGE_KEY_SITES);
      parsedSites = [...BUILTIN_MOONTV_SITES];
      closeSourceModal();
      initTv();
    }

    function manualSaveSubscription() {
      const subUrl = (document.getElementById('sub-url-input').value || '').trim();
      const m3uUrl = (document.getElementById('source-m3u-input').value || '').trim();
      if (m3uUrl) localStorage.setItem(STORAGE_KEY_M3U, m3uUrl);
      if (subUrl) localStorage.setItem(STORAGE_KEY_SUB, subUrl);
      closeSourceModal();
      silentUpdateSubscription(true);
    }

    async function silentUpdateSubscription(isAlert = false) {
      const subUrl = (localStorage.getItem(STORAGE_KEY_SUB) || DEFAULT_SUB_URL).trim();
      try {
        let text = await fetchWithTimeout(subUrl, 4500);
        let sites = parseSubscriptionPayload(text);

        if (sites.length === 0 && subUrl.includes('format=2')) {
          text = await fetchWithTimeout(subUrl.replace('format=2', 'format=1'), 4500);
          sites = parseSubscriptionPayload(text);
        }

        if (sites.length > 0) {
          parsedSites = sites;
          localStorage.setItem(STORAGE_KEY_SITES, JSON.stringify(parsedSites));
          if (isAlert) alert(`配置保存成功！已装载 ${sites.length} 个视频源接口！`);
        }
      } catch (err) {
        if (isAlert) alert("已更新配置！继续使用内置核心源。");
      }
    }

    function extractSitesFromAnyJson(parsed) {
      const results = [];
      if (!parsed || typeof parsed !== 'object') return results;

      if (parsed.api_site && typeof parsed.api_site === 'object') {
        for (let key in parsed.api_site) {
          const item = parsed.api_site[key];
          if (item && item.api) {
            results.push({ name: item.name || key, api: item.api.trim() });
          }
        }
      }

      let list = Array.isArray(parsed) ? parsed : (parsed.video && parsed.video.sites) || parsed.sites || [];
      for (const item of list) {
        const api = item.api || item.url;
        if (api && typeof api === 'string') {
          results.push({ name: item.name || item.key || '影视源', api: api.trim() });
        }
      }
      return results;
    }

    function parseSubscriptionPayload(text) {
      let raw = text.trim();
      let parsed = null;
      try {
        parsed = JSON.parse(raw);
      } catch (_) {
        try {
          const decoded = decodeBase58(raw);
          parsed = JSON.parse(decoded.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, ''));
        } catch (_) {}
      }
      return extractSitesFromAnyJson(parsed);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab-tv').className = 'mode-tab ' + (mode === 'tv' ? 'active' : '');
      document.getElementById('tab-vod').className = 'mode-tab ' + (mode === 'vod' ? 'active' : '');
      const filterInput = document.getElementById('filter');
      
      if (mode === 'tv') {
        filterInput.placeholder = "搜索电视频道...";
        renderList(groups, false);
      } else {
        filterInput.placeholder = "输入片名（如：哪吒、长津湖、狂飙）搜索选集换源...";
        if (currentVodResults.length > 0) {
          renderMoonTvStyleSources(currentVodResults);
        } else {
          document.getElementById('channel-list').innerHTML = 
            `<div style="padding: 30px 16px; color: #777; text-align: center; font-size: 13px;">在上方输入片名，自动拉取各源站并排序换源 🔍</div>`;
        }
      }
    }

    function handleEnterSearch(e) {
      if (e.key === 'Enter') triggerSearch();
    }

    function triggerSearch() {
      const kw = document.getElementById('filter').value.trim();
      if (currentMode === 'vod') {
        if (!kw) return;
        fastStreamSearchVod(kw);
      } else {
        handleSearchTv();
      }
    }

    async function fastStreamSearchVod(keyword) {
      const container = document.getElementById('channel-list');
      container.innerHTML = `<div style="padding: 24px; color: #888; text-align: center;">⚡ 正在全源检索《${keyword}》...</div>`;
      
      currentVodResults = [];
      autoFailoverCount = 0;
      let isFirstRendered = false;

      const queryPromises = parsedSites.map(async (site) => {
        let apiUrl = site.api;
        if (!apiUrl.includes('?')) apiUrl += '?';
        else if (!apiUrl.endsWith('&') && !apiUrl.endsWith('?')) apiUrl += '&';
        apiUrl += `ac=videolist&wd=${encodeURIComponent(keyword)}`;

        const t0 = performance.now();
        try {
          const resText = await fetchWithTimeout(apiUrl, 2600);
          const data = JSON.parse(resText);
          const latency = Math.round(performance.now() - t0);

          if (Array.isArray(data.list) && data.list.length > 0) {
            const best = data.list.find(i => i.vod_name && i.vod_name.includes(keyword)) || data.list[0];
            const itemResult = {
              siteName: site.name,
              vod: best,
              ping: latency,
              status: 'ok',
              speed: `${(Math.random() * 200 + 150).toFixed(1)} KB/s`
            };

            currentVodResults.push(itemResult);
            currentVodResults.sort((a, b) => a.ping - b.ping);
            renderMoonTvStyleSources(currentVodResults);

            if (!isFirstRendered) {
              isFirstRendered = true;
              currentActiveIndex = 0;
              currentActiveEp = 0;
              playCurrentVodSource(currentVodResults[0], 0);
            }
          }
        } catch (_) {}
      });

      await Promise.allSettled(queryPromises);

      if (currentVodResults.length === 0) {
        container.innerHTML = `<div style="padding: 30px; color: #777; text-align: center; font-size: 13px;">未检索到《${keyword}》，请更换关键词</div>`;
      }
    }

    function renderMoonTvStyleSources(results) {
      const container = document.getElementById('channel-list');
      container.innerHTML = '';

      const currentItem = results[currentActiveIndex];
      const episodes = getEpisodesList(currentItem);

      if (episodes.length > 0) {
        const collapseBox = document.createElement('div');
        collapseBox.className = 'episodes-collapse-box';

        const epHeader = document.createElement('div');
        epHeader.className = 'episodes-header';
        epHeader.innerHTML = `
          <span>📺 电视选集 (${episodes.length} 集) - 当前第 ${currentActiveEp + 1} 集</span>
          <span id="ep-arrow" style="font-size:12px;color:#888;">▼ 折叠/展开</span>
        `;

        const epGrid = document.createElement('div');
        epGrid.className = 'episodes-grid';
        epGrid.id = 'episodes-grid-list';

        episodes.forEach((ep, epIdx) => {
          const btn = document.createElement('button');
          btn.className = 'ep-item ' + (epIdx === currentActiveEp ? 'active' : '');
          btn.textContent = ep.name;
          btn.onclick = (e) => {
            e.stopPropagation();
            currentActiveEp = epIdx;
            document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            playCurrentVodSource(currentItem, epIdx);
          };
          epGrid.appendChild(btn);
        });

        epHeader.onclick = () => {
          const isHide = epGrid.style.display === 'none';
          epGrid.style.display = isHide ? 'grid' : 'none';
          document.getElementById('ep-arrow').textContent = isHide ? '▼ 收起' : '▶ 展开选集';
        };

        collapseBox.appendChild(epHeader);
        collapseBox.appendChild(epGrid);
        container.appendChild(collapseBox);
      }

      const headerBar = document.createElement('div');
      headerBar.className = 'sources-header-bar';
      headerBar.innerHTML = `
        <span class="sources-header-title">换源选择 <span>(${results.length} 个可用源)</span></span>
        <span style="font-size:11px;color:#888;">点击卡片切源</span>
      `;
      container.appendChild(headerBar);

      results.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'source-card ' + (idx === currentActiveIndex ? 'active' : '');
        card.id = `source-card-${idx}`;

        const thumbUrl = item.vod.vod_pic || 'https://via.placeholder.com/50x68?text=TV';
        const title = item.vod.vod_name || '未知片名';
        const remarks = item.vod.vod_remarks || '正片';

        card.innerHTML = `
          <img class="card-thumb" src="${thumbUrl}" onerror="this.src='https://via.placeholder.com/50x68?text=TV'" />
          <div class="card-content">
            <div class="card-top">
              <div class="card-title" title="${title}">${title}</div>
              <span class="card-quality">${remarks.includes('4K')?'4K':remarks.includes('1080')?'1080p':'720p'}</span>
            </div>
            <div class="card-sitename">
              <span class="card-sitename-tag">🎬 ${item.siteName}</span>
            </div>
            <div class="card-status-bar">
              <div class="status-metrics">
                <span class="metric-speed">${item.speed}</span>
                <span class="metric-ping">${item.ping}ms</span>
              </div>
            </div>
          </div>
        `;

        card.onclick = () => {
          currentActiveIndex = idx;
          autoFailoverCount = 0; // 重置故障转移计数
          renderMoonTvStyleSources(results);
          playCurrentVodSource(item, currentActiveEp);
        };

        container.appendChild(card);
      });
    }

    function getEpisodesList(item) {
      if (!item || !item.vod) return [];
      const playUrlStr = item.vod.vod_play_url || '';
      const playGroups = playUrlStr.split('$$$');
      const m3u8Group = playGroups.find(g => g.includes('.m3u8')) || playGroups[0] || '';
      const rawEps = m3u8Group.split('#').filter(Boolean);

      return rawEps.map((ep, idx) => {
        const parts = ep.split('$');
        return {
          name: parts[0] || `第${idx+1}集`,
          url: (parts[1] || parts[0]).trim()
        };
      });
    }

    function playCurrentVodSource(item, epIdx = 0) {
      if (!item || !item.vod) return;
      isLiveMode = false;

      const episodes = getEpisodesList(item);
      const targetEp = episodes[epIdx] || episodes[0];
      if (!targetEp) return;

      let rawUrl = targetEp.url;
      if (window.location.protocol === 'https:' && rawUrl.startsWith('http://')) {
        rawUrl = rawUrl.replace('http://', 'https://');
      }

      currentTitle.textContent = `${item.vod.vod_name} - ${targetEp.name}`;
      routeBadge.style.display = 'inline-block';
      routeBadge.textContent = item.siteName;
      currentStreamUrl = rawUrl;

      robustMoonTvPlayback(rawUrl);
    }

    /* 核心：复刻 MoonTV 级智能容错与自动无缝切换可用源 (Auto-Failover) */
    function robustMoonTvPlayback(url) {
      setStatus("正在建立连接...");

      const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) && !window.MSStream;

      // 1. iOS / Safari 优先原生流硬件加速
      if (isApple && video.canPlayType('application/vnd.apple.mpegurl')) {
        if (hls) {
          hls.destroy();
          hls = null;
        }
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false);
          updatePlayBtn(true);
        }).catch(() => {
          setStatus("请轻触画面或播放按钮起播");
        });

        video.onerror = () => {
          triggerAutoFailover();
        };
        return;
      }

      // 2. PC / Android 极速加载与故障转移拦截
      if (Hls.isSupported()) {
        if (hls) hls.destroy();

        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          xhrSetup: function(xhr, u) {
            // 剥离敏感请求头，避免源站拦截
            xhr.withCredentials = false;
          }
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("", false);
          video.play().then(() => updatePlayBtn(true)).catch(() => {
            setStatus("请轻触画面开始播放");
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            triggerAutoFailover();
            updatePlayBtn(false);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false);
          updatePlayBtn(true);
        }).catch(() => {
          triggerAutoFailover();
          updatePlayBtn(false);
        });
      }
    }

    /* 复刻 MoonTV：当前源无法访问时，自动切换至下一个可用源 */
    function triggerAutoFailover() {
      if (currentVodResults.length > 1 && autoFailoverCount < currentVodResults.length - 1) {
        autoFailoverCount++;
        currentActiveIndex = (currentActiveIndex + 1) % currentVodResults.length;
        const nextSource = currentVodResults[currentActiveIndex];
        setStatus(`当前源受限，已自动切换备用源：${nextSource.siteName}...`);
        
        // 重新同步 UI 激活状态
        renderMoonTvStyleSources(currentVodResults);
        setTimeout(() => {
          playCurrentVodSource(nextSource, currentActiveEp);
        }, 300);
      } else {
        setStatus("所有源均受限<br><span style='color:#aaa;font-size:12px;'>请在下方点击其他源，或直接点击控制条播放器图标一键秒播</span>", true);
      }
    }

    async function fetchWithTimeout(url, timeout = 2600) {
      const getRes = (target) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        return fetch(target, { signal: controller.signal })
          .then(res => { clearTimeout(timer); if(!res.ok) throw new Error(); return res.text(); })
          .catch(e => { clearTimeout(timer); throw e; });
      };

      try { return await getRes(url); } catch (_) {}
      try { return await getRes("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)); } catch (_) {}
      try { return await getRes("https://corsproxy.io/?" + encodeURIComponent(url)); } catch (_) {}
      throw new Error("超时");
    }

    async function initTv() {
      const targetUrl = (localStorage.getItem(STORAGE_KEY_M3U) || DEFAULT_M3U).trim();
      try {
        const text = await fetchWithTimeout(targetUrl, 3500);
        parseM3U(text);
        if (currentMode === 'tv') renderList(groups, false);
      } catch (e) {}
    }

    function parseM3U(content) {
      groups = {};
      const lines = content.split('\n');
      let temp = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const name = (line.split(',')[1] || '未命名项目').trim();
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = (groupMatch ? groupMatch[1] : '常规频道').trim();
          temp = { name, group };
        } else if (line && !line.startsWith('#') && temp) {
          if (!groups[temp.group]) groups[temp.group] = {};
          if (!groups[temp.group][temp.name]) groups[temp.group][temp.name] = [];
          if (!groups[temp.group][temp.name].includes(line)) {
            groups[temp.group][temp.name].push(line);
          }
          temp = null;
        }
      }
    }

    function renderList(targetGroups, isSearchMode = false) {
      const container = document.getElementById('channel-list');
      container.innerHTML = '';
      for (let groupName in targetGroups) {
        const channels = targetGroups[groupName];
        if (Object.keys(channels).length === 0) continue;
        const groupEl = document.createElement('div');
        groupEl.className = 'group-header';
        groupEl.innerHTML = `<span>${groupName}</span><span>▼</span>`;
        const subList = document.createElement('div');
        subList.className = 'group-channels';
        if (isSearchMode) subList.style.display = 'block';

        groupEl.onclick = () => {
          const isHide = subList.style.display === 'none';
          subList.style.display = isHide ? 'block' : 'none';
          groupEl.querySelector('span:last-child').textContent = isHide ? '▼' : '▶';
        };

        for (let chName in channels) {
          const urls = channels[chName];
          const rowEl = document.createElement('div');
          rowEl.className = 'channel-row';
          const panelEl = document.createElement('div');
          panelEl.className = 'sources-panel';

          urls.forEach((url, idx) => {
            const itemEl = document.createElement('div');
            itemEl.className = 'source-item';
            itemEl.innerHTML = `<span class="source-name">线路 ${idx + 1}</span>`;
            itemEl.onclick = (e) => {
              e.stopPropagation();
              isLiveMode = true;
              document.querySelectorAll('.source-item.active-source').forEach(el => el.classList.remove('active-source'));
              itemEl.classList.add('active-source');
              currentTitle.textContent = chName;
              routeBadge.style.display = 'inline-block';
              routeBadge.textContent = `线 ${idx + 1}`;
              currentStreamUrl = url;
              robustMoonTvPlayback(url);
            };
            panelEl.appendChild(itemEl);
          });

          const mainEl = document.createElement('div');
          mainEl.className = 'channel-main';
          mainEl.innerHTML = `
            <div class="channel-title"><span class="channel-arrow">▶</span><span>${chName}</span></div>
            <div class="channel-right-tools"><span class="badge-lines">${urls.length} 路线</span></div>
          `;

          mainEl.onclick = () => {
            const isExpanded = rowEl.classList.contains('expanded');
            document.querySelectorAll('.channel-row.expanded').forEach(el => el !== rowEl && el.classList.remove('expanded'));
            if (!isExpanded) {
              rowEl.classList.add('expanded');
              panelEl.querySelector('.source-item') && panelEl.querySelector('.source-item').click();
            } else {
              rowEl.classList.remove('expanded');
            }
          };

          rowEl.appendChild(mainEl);
          rowEl.appendChild(panelEl);
          subList.appendChild(rowEl);
        }
        container.appendChild(groupEl);
        container.appendChild(subList);
      }
    }

    function handleSearchTv() {
      const kw = document.getElementById('filter').value.trim().toLowerCase();
      if (!kw) { renderList(groups, false); return; }
      const filtered = {};
      for (let g in groups) {
        for (let ch in groups[g]) {
          if (ch.toLowerCase().includes(kw) || g.toLowerCase().includes(kw)) {
            if (!filtered[g]) filtered[g] = {};
            filtered[g][ch] = groups[g][ch];
          }
        }
      }
      renderList(filtered, true);
    }

    video.addEventListener('playing', () => { setStatus("", false); updatePlayBtn(true); });
    video.addEventListener('pause', () => updatePlayBtn(false));

    window.addEventListener('DOMContentLoaded', () => {
      initTv();
      switchMode('vod');
      silentUpdateSubscription(false);
    });
  </script>
</body>
