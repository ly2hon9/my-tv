<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f0f">
  <title>拾光影视</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-base: #0f0f0f;
      --bg-workspace: #08080a;
      --bg-sidebar: #161616;
      --bg-search-box: #1f1f1f;
      --bg-input: #111111;
      --bg-card: #181818;
      --bg-card-hover: #222222;
      --bg-tag: #2a2a2a;
      --bg-sub-panel: #111111;
      --border-color: #282828;
      --border-light: #383838;
      --text-main: #eeeeee;
      --text-sub: #888888;
      --text-mute: #666666;
      --accent: #0070f3;
      --accent-soft: rgba(0, 112, 243, 0.15);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.5);

      /* 高级毛玻璃系统变量 (暗色) */
      --glass-bg: rgba(28, 28, 32, 0.78);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      --glass-mask: rgba(0, 0, 0, 0.65);
    }

    body.theme-light {
      --bg-base: #f1f5f9;
      --bg-workspace: #e2e8f0;
      --bg-sidebar: #f8fafc;
      --bg-search-box: #ffffff;
      --bg-input: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --bg-tag: #e2e8f0;
      --bg-sub-panel: #f8fafc;
      --border-color: #e2e8f0;
      --border-light: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --text-mute: #94a3b8;
      --accent: #0070f3;
      --accent-soft: rgba(0, 112, 243, 0.08);
      --card-shadow: 0 4px 12px rgba(0,0,0,0.05);

      /* 高级毛玻璃系统变量 (亮色) */
      --glass-bg: rgba(255, 255, 255, 0.84);
      --glass-border: rgba(255, 255, 255, 0.75);
      --glass-shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
      --glass-mask: rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-base); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; display: flex; flex-direction: column; transition: background-color 0.25s, color 0.25s; }

    #auth-gate-screen {
      position: fixed; inset: 0; z-index: 9999999;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #edf5f8 0%, #f4f7f6 45%, #fcfdfc 100%);
      transition: background 0.3s ease;
    }
    #auth-gate-screen.dark-theme {
      background: linear-gradient(180deg, #0e1114 0%, #15181c 50%, #1a1e22 100%);
    }

    .gate-top-bar { position: absolute; top: 18px; right: 20px; }
    .gate-theme-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; outline: none; }

    .gate-card {
      background: #ffffff; border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.06);
      width: 86%; max-width: 320px; padding: 32px 24px 28px 24px;
      box-sizing: border-box; text-align: center;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #auth-gate-screen.dark-theme .gate-card {
      background: #1e2126; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .gate-logo {
      font-size: 23px; font-weight: 800; color: #54a56a;
      letter-spacing: 3px; margin-bottom: 22px; font-family: -apple-system, sans-serif;
    }
    .gate-sub-tip { font-size: 11px; color: #888; margin-top: -14px; margin-bottom: 18px; display: none; }

    .gate-input-box {
      display: flex; align-items: center; background: #f7f8fa;
      border: 1px solid #eef0f4; border-radius: 8px; padding: 0 12px;
      height: 44px; margin-bottom: 14px; box-sizing: border-box;
      transition: border-color 0.2s, background 0.2s;
    }
    #auth-gate-screen.dark-theme .gate-input-box {
      background: #14161a; border-color: #2b3038;
    }
    .gate-input-box:focus-within {
      border-color: #72b784; background: #fff;
    }
    #auth-gate-screen.dark-theme .gate-input-box:focus-within {
      background: #111316; border-color: #54a56a;
    }

    .gate-input-icon { font-size: 14px; color: #999; flex-shrink: 0; margin-right: 8px; user-select: none; }
    .gate-input-box input {
      border: none; background: transparent; outline: none;
      font-size: 13px; color: #333; flex: 1; width: 100%;
    }
    #auth-gate-screen.dark-theme .gate-input-box input { color: #eee; }
    .gate-input-box input::placeholder { color: #aaa; }

    .gate-eye-btn { 
      background: none; border: none; cursor: pointer; color: #888; padding: 0 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; outline: none;
      transition: color 0.15s;
    }
    .gate-eye-btn:hover { color: #555; }
    #auth-gate-screen.dark-theme .gate-eye-btn:hover { color: #ccc; }

    .gate-options-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: #888; margin-top: 4px; margin-bottom: 22px; user-select: none;
    }
    .gate-remember-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #888; }
    .gate-remember-wrap input { accent-color: #54a56a; width: 14px; height: 14px; cursor: pointer; }
    .gate-switch-link { color: #54a56a; cursor: pointer; font-weight: 500; }

    .gate-submit-btn {
      width: 100%; height: 42px; background: #b0d4bb;
      color: #fff; font-size: 14px; font-weight: 600; border: none;
      border-radius: 8px; cursor: pointer; transition: background 0.25s, box-shadow 0.25s, transform 0.1s;
    }
    .gate-submit-btn.btn-ready {
      background: #2e7d44 !important;
      box-shadow: 0 4px 14px rgba(46, 125, 68, 0.4);
    }
    .gate-submit-btn.btn-ready:hover { background: #256637 !important; }
    .gate-submit-btn:active { transform: scale(0.98); }

    .gate-error-tip { font-size: 12px; color: #ef4444; margin-top: 10px; display: none; text-align: center; }

    #player-wrap { 
      width: 100%; height: 40vh; min-height: 240px; background: #000; position: relative; 
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: default;
    }
    #player-wrap.pseudo-fullscreen {
      position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 99999 !important; max-height: none !important;
    }

    video { width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; transition: object-fit 0.2s; }
    video.fit-cover { object-fit: cover; }
    video.fit-fill { object-fit: fill; }

    #top-bar { 
      position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); 
      display: flex; justify-content: space-between; align-items: center; z-index: 10; transition: opacity 0.3s ease;
    }
    .top-left-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #current-title { font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #btn-fav-toggle { background: none; border: none; font-size: 18px; cursor: pointer; color: #aaa; transition: transform 0.15s, color 0.15s; line-height: 1; flex-shrink: 0; }
    #btn-fav-toggle.active { color: #facc15; transform: scale(1.15); }
    #current-route-badge { font-size: 11px; background: #0070f3; color: #fff; padding: 2px 6px; border-radius: 4px; display: none; flex-shrink: 0; }

    #status-layer { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 8; 
      color: #fff; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.18); padding: 14px 22px; border-radius: 12px; 
      font-size: 13px; pointer-events: auto; display: none; text-align: center; max-width: 85%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.7); line-height: 1.6;
    }

    #gesture-tip {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 24px;
      font-size: 14px; font-weight: 600; z-index: 9; pointer-events: none; opacity: 0; transition: opacity 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }

    #custom-controls {
      position: absolute; bottom: 0; left: 0; right: 0; 
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 75%, transparent 100%); 
      display: flex; flex-direction: column; z-index: 15; transition: opacity 0.3s ease;
    }
    #player-wrap.controls-hidden #custom-controls,
    #player-wrap.controls-hidden #top-bar { opacity: 0; pointer-events: none; }
    #player-wrap.controls-hidden { cursor: none; }

    #progress-container {
      width: 100%; height: 18px; cursor: pointer; display: flex; align-items: center; padding: 0 10px; touch-action: none; user-select: none;
    }
    #progress-track {
      width: 100%; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; position: relative; transition: height 0.15s ease;
    }
    #progress-container.dragging #progress-track,
    #progress-container:hover #progress-track { height: 5px; }
    #progress-bar { height: 100%; width: 0%; background: #0070f3; border-radius: 2px; position: relative; }
    #progress-thumb {
      width: 12px; height: 12px; border-radius: 50%; background: #fff; position: absolute; right: -6px; top: 50%; 
      transform: translateY(-50%) scale(0); transition: transform 0.15s ease; box-shadow: 0 0 6px rgba(0,0,0,0.8); pointer-events: none;
    }
    #progress-container.dragging #progress-thumb,
    #progress-container:hover #progress-thumb { transform: translateY(-50%) scale(1); }

    .controls-inner { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; gap: 6px; }
    .ctrl-left { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85; transition: opacity 0.2s; font-size: 12px; padding: 2px; }
    .ctrl-btn:hover { opacity: 1; }
    .ctrl-time { font-size: 11px; color: #aaa; font-family: monospace; white-space: nowrap; user-select: none; }
    
    .pill-btn {
      font-size: 11px; font-weight: 600; padding: 2px 5px; border-radius: 4px;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #ddd; white-space: nowrap;
    }

    .volume-box { display: flex; align-items: center; gap: 4px; }
    .volume-slider { width: 50px; height: 3px; -webkit-appearance: none; background: rgba(255,255,255,0.3); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }

    .ctrl-right { display: flex; align-items: center; gap: 6px; min-width: 0; }

    .external-group { 
      display: flex; align-items: center; gap: 5px; 
      background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px); 
      padding: 3px 6px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); 
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex-shrink: 1; max-width: 140px;
    }
    .external-group::-webkit-scrollbar { display: none; }
    .ext-btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer; padding: 0; flex-shrink: 0; }
    .ext-btn svg { width: 14px; height: 14px; }

    #sidebar { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg-sidebar); border-top: 1px solid var(--border-color); transition: background 0.25s, border-color 0.25s; }
    #search-box { padding: 10px 12px; background: var(--bg-search-box); border-bottom: 1px solid var(--border-color); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; transition: background 0.25s, border-color 0.25s; }

    .search-row-primary { display: flex; align-items: center; gap: 6px; width: 100%; }
    .search-row-secondary { display: flex; align-items: center; gap: 6px; width: 100%; }

    .search-input-wrap { flex: 1; position: relative; display: flex; align-items: center; }
    #search-box input { width: 100%; padding: 8px 28px 8px 12px; border-radius: 6px; border: 1px solid var(--border-light); background: var(--bg-input); color: var(--text-main); font-size: 13px; outline: none; transition: background 0.25s, border-color 0.25s, color 0.25s; }
    .btn-clear-kw { position: absolute; right: 8px; color: var(--text-sub); cursor: pointer; font-size: 14px; display: none; }

    .btn-search { background: var(--accent); border: none; color: #fff; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    
    .btn-quick-theme {
      background: var(--bg-input); border: 1px solid var(--border-light); border-radius: 6px;
      width: 35px; height: 34px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; outline: none; transition: background 0.2s, border-color 0.2s; }
    .btn-quick-theme:hover { background: var(--bg-card-hover); }

    .btn-tool-mid { 
      flex: 1; background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 6px; 
      padding: 7px 0; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; text-align: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn-tool-mid:hover { background: var(--bg-card-hover); }
    .btn-tool-mid.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .mode-tab-group { display: flex; gap: 6px; }
    .mode-tab { flex: 1; padding: 7px 0; background: var(--bg-input); border: 1px solid var(--border-light); color: var(--text-sub); font-size: 12px; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.2s ease; outline: none; }
    .mode-tab.active { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; font-weight: 600; }

    #channel-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ===================================================================
       单排常驻吸顶工具栏：手机端一排完整排下，绝不左右滑动
       =================================================================== */
    .top-unified-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 3px; padding: 6px 8px; background: var(--bg-search-box);
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 20;
      width: 100%; box-sizing: border-box; overflow: hidden;
    }

    .bar-left-group {
      display: flex; align-items: center; gap: 3px; flex: 1; min-width: 0;
    }

    .bar-right-group {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }

    .filter-pill-btn {
      background: var(--bg-input); border: 1px solid var(--border-light); color: var(--text-sub);
      padding: 3px 6px; border-radius: 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
      display: inline-flex; align-items: center; justify-content: center; outline: none;
      line-height: 1.2;
    }
    .filter-pill-btn:hover { background: var(--bg-card-hover); color: var(--text-main); }
    .filter-pill-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
      box-shadow: 0 2px 6px rgba(0, 112, 243, 0.35); font-weight: 600;
    }

    .btn-sort-action { 
      background: var(--bg-card); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 6px; 
      padding: 3px 7px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      gap: 3px; white-space: nowrap; font-weight: 500; transition: all 0.15s ease; outline: none;
      line-height: 1.2;
    }
    .btn-sort-action:hover { background: var(--bg-card-hover); }
    .btn-sort-action.active-sort { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    @media (max-width: 400px) {
      .filter-pill-btn, .btn-sort-action {
        padding: 2.5px 4.5px;
        font-size: 10px;
      }
      .top-unified-bar {
        padding: 5px 4px;
        gap: 2px;
      }
    }

    .title-group-box { border-bottom: 1px solid var(--border-color); background: var(--bg-card); transition: background 0.2s; }
    .title-group-header {
      padding: 10px 12px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; transition: background 0.15s;
    }
    .title-group-header:hover { background: var(--bg-card-hover); }
    .title-group-box.active-group .title-group-header { background: var(--accent-soft); border-left: 3px solid var(--accent); }
    .group-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .group-poster { width: 44px; height: 60px; border-radius: 4px; object-fit: cover; background: var(--border-color); flex-shrink: 0; }
    .group-info-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
    .group-main-title { font-size: 14px; font-weight: bold; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-meta-tag { font-size: 11px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .group-badge-count { background: var(--bg-tag); color: var(--accent); padding: 1px 6px; border-radius: 10px; font-weight: 500; }
    .group-pub-time { font-size: 10px; color: var(--text-mute); font-family: monospace; }
    .group-arrow { font-size: 12px; color: var(--text-sub); transition: transform 0.2s ease; margin-left: 8px; flex-shrink: 0; }
    .title-group-box.expanded .group-arrow { transform: rotate(180deg); color: var(--accent); }

    .group-body-panel { display: none; background: var(--bg-sub-panel); padding: 6px 10px 12px 10px; border-top: 1px solid var(--border-color); }
    .title-group-box.expanded .group-body-panel { display: block; }

    .episodes-collapse-box { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 6px; padding: 8px 10px; margin-top: 8px; margin-bottom: 6px; }
    .episodes-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-main); }
    .episodes-actions { display: flex; align-items: center; gap: 8px; }
    .btn-ep-order { background: var(--bg-tag); border: 1px solid var(--border-light); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; }
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
    .ep-item { background: var(--bg-tag); border: 1px solid var(--border-light); padding: 5px 2px; border-radius: 4px; font-size: 11px; color: var(--text-sub); text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ep-item.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }

    .source-sub-card { 
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; margin-top: 6px; background: var(--bg-card); border: 1px solid var(--border-light); 
      border-radius: 6px; cursor: pointer; transition: background 0.15s;
    }
    .source-sub-card:hover { background: var(--bg-card-hover); }
    .source-sub-card.active-sub { border-color: var(--accent); background: var(--accent-soft); }
    
    .source-sub-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .card-sitename-tag { background: var(--bg-tag); padding: 2px 6px; border-radius: 3px; font-size: 11px; color: var(--text-main); font-weight: 500; }
    .source-sub-card.active-sub .card-sitename-tag, .single-source-card.active-group .card-sitename-tag { background: var(--accent); color: #fff; }
    
    .card-quality { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
    .card-quality.q-4k { background: #4a2828; color: #f87171; }
    .card-quality.q-1080 { background: #283e2e; color: #4ade80; }
    .card-quality.q-720 { background: #26354a; color: #60a5fa; }
    .card-quality.q-normal { background: var(--bg-tag); color: var(--text-sub); }

    .card-censor { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; line-height: 1.4; display: inline-flex; align-items: center; gap: 2px; }
    .card-censor.c-wuma { background: #3b0764; color: #f0abfc; border: 1px solid #a855f7; }
    .card-censor.c-youma { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
    body.theme-light .card-censor.c-wuma { background: #fdf4ff; color: #a21caf; border-color: #f0abfc; }
    body.theme-light .card-censor.c-youma { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }

    .card-status-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: monospace; }
    .metric-ping-ok { color: #4ade80; }
    .metric-ping-warn { color: #facc15; }
    .metric-ping-err { color: #f87171; }
    .metric-ping-wait { color: var(--text-sub); }

    .history-card { 
      display: flex; gap: 10px; align-items: center; padding: 10px 14px; 
      border-bottom: 1px solid var(--border-color); background: var(--bg-card); cursor: pointer;
      box-sizing: border-box; transform-origin: top center;
    }
    .history-card:hover { background: var(--bg-card-hover); }
    .history-info { flex: 1; min-width: 0; }
    .history-title { font-size: 14px; font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .history-meta { font-size: 12px; color: var(--text-sub); margin-top: 4px; display: flex; gap: 10px; align-items: center; }
    .btn-del-item { background: none; border: none; color: var(--text-mute); font-size: 14px; cursor: pointer; padding: 4px; }
    .btn-del-item:hover { color: #ef4444; }

    .group-header { padding: 12px 16px; background: var(--bg-card); font-size: 13px; font-weight: bold; color: var(--text-sub); cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); user-select: none; }
    .channel-row { border-bottom: 1px solid var(--border-color); background: var(--bg-card); }
    .channel-main { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .channel-title { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text-main); }
    .channel-row.expanded .channel-arrow { transform: rotate(90deg); color: var(--accent); }
    .channel-row.playing .channel-title { color: var(--accent); font-weight: bold; }
    .sources-panel { display: none; background: var(--bg-sub-panel); padding: 8px 12px 12px 16px; border-top: 1px solid var(--border-color); }
    .channel-row.expanded .sources-panel { display: block; }
    .source-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-top: 6px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 6px; cursor: pointer; }
    .source-item.active-source { border-color: var(--accent); background: var(--accent-soft); }

    /* ===================================================================
       高级全套毛玻璃系统 (Glassmorphism Modal System)
       =================================================================== */
    .glass-modal-mask {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--glass-mask);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 10000;
      display: none; align-items: center; justify-content: center;
      padding: 16px; box-sizing: border-box;
      animation: glassFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes glassFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .glass-modal-card {
      background: var(--glass-bg);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: var(--glass-shadow);
      color: var(--text-main);
      width: 100%; max-width: 480px;
      padding: 22px 20px 20px 20px;
      box-sizing: border-box;
      max-height: 88vh; overflow-y: auto;
      scrollbar-width: thin;
      transition: all 0.25s ease;
    }
    .glass-modal-card h3 {
      font-size: 16px; font-weight: 700;
      margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
      color: var(--text-main);
    }

    .glass-nav-card-btn {
      width: 100%; height: 46px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; margin-bottom: 10px;
      color: var(--text-main); font-size: 13px; font-weight: 600;
      cursor: pointer; outline: none; transition: all 0.15s ease;
    }
    body.theme-light .glass-nav-card-btn { background: rgba(0, 0, 0, 0.03); }
    .glass-nav-card-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .input-label { font-size: 12px; color: var(--text-sub); margin-top: 10px; margin-bottom: 4px; display: block; }
    .glass-modal-card input, .glass-modal-card select {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      border: 1px solid var(--border-light);
      background: var(--bg-input); color: var(--text-main);
      font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    .glass-modal-card input:focus, .glass-modal-card select:focus {
      border-color: var(--accent);
    }
    .sub-stats { font-size: 12px; color: var(--accent); margin-top: 6px; }
    .last-sync-time { font-size: 12px; color: var(--text-sub); margin-top: 4px; font-family: monospace; }

    .settings-user-header-box {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 10px 14px; margin-bottom: 14px;
    }
    body.theme-light .settings-user-header-box { background: rgba(0, 0, 0, 0.03); }

    .user-badge-role { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .role-admin { background: #3b2d11; color: #facc15; }

    /* 采集源列表内部独立视窗 */
    #sites-items-container {
      max-height: 320px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-sub-panel);
      padding: 4px 6px;
      scrollbar-width: thin;
    }

    .site-toggle-row { 
      display: flex; 
      align-items: center; 
      padding: 8px 4px; 
      border-bottom: 1px solid var(--border-color); 
      font-size: 12px; 
    }
    .site-toggle-row:last-child { border-bottom: none; }
    .btn-site-toggle { padding: 3px 8px; border-radius: 4px; font-size: 11px; border: none; cursor: pointer; font-weight: 500; }
    .btn-site-toggle.enabled { background: #238636; color: #fff; }
    .btn-site-toggle.disabled { background: var(--border-light); color: var(--text-sub); }
    
    .btn-small-perm { background: var(--bg-card); color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; font-weight: 500; }
    .btn-small-del, .btn-danger-del { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; margin-left: 4px; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn-action { padding: 8px 14px; border-radius: 8px; font-size: 13px; border: none; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .btn-cancel { background: var(--bg-tag); color: var(--text-main); }
    .btn-sync { background: #238636; color: #fff; }
    .btn-save { background: var(--accent); color: #fff; }

    .perm-sites-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px; max-height: 260px; overflow-y: auto; margin-top: 10px; padding: 6px 0;
    }
    .perm-site-chip {
      display: flex; align-items: center; gap: 6px; background: var(--bg-input); border: 1px solid var(--border-light);
      padding: 6px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; user-select: none; color: var(--text-main);
    }
    .perm-site-chip input { width: 14px; height: 14px; accent-color: var(--accent); }

    .group-card-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 8px;
      padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
    }

    .scroll-loading-indicator {
      padding: 12px; text-align: center; font-size: 12px; color: var(--text-sub);
    }

    @media (max-width: 600px) {
      .volume-slider { display: none; }
      .pip-btn { display: none; }
    }

    @media (min-width: 601px) {
      .search-row-primary { flex: 1; }
      .search-row-secondary { width: auto; flex-shrink: 0; gap: 6px; }
      .btn-tool-mid { flex: none; padding: 8px 14px; }
      .external-group { max-width: none; }
    }

    /* 电脑 / 平板端 剧场沉浸双视窗布局 (Theatre Workspace) */
    @media (min-width: 900px) {
      body {
        flex-direction: row;
        background-color: var(--bg-workspace);
        padding: 18px 24px;
        gap: 20px;
        align-items: stretch;
      }
      #player-wrap {
        flex: 1;
        height: 100%;
        min-height: auto;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      #sidebar {
        width: 420px;
        max-width: 450px;
        height: 100%;
        border-top: none;
        border: 1px solid var(--border-color);
        border-radius: 18px;
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
    }
  </style>
</head>
<body>

  <!-- 全屏门禁系统 -->
  <div id="auth-gate-screen">
    <div class="gate-top-bar">
      <button type="button" id="gate-theme-toggle" class="gate-theme-btn" onclick="toggleGlobalThemeClick()" title="切换明暗主题"></button>
    </div>
    <div class="gate-card">
      <div class="gate-logo">拾光影视</div>
      <div id="gate-sub-tip" class="gate-sub-tip"></div>
      
      <div class="gate-input-box">
        <span class="gate-input-icon">👤</span>
        <input type="text" id="gate-username" placeholder="输入用户名" autocomplete="username">
      </div>
      
      <div class="gate-input-box">
        <span class="gate-input-icon">🔒</span>
        <input type="password" id="gate-password" placeholder="输入访问密码" autocomplete="current-password">
        <button type="button" id="gate-eye-toggle" class="gate-eye-btn" onclick="toggleGatePasswordVisibility()" title="显示/隐藏密码"></button>
      </div>
      
      <div class="gate-options-row">
        <label class="gate-remember-wrap">
          <input type="checkbox" id="gate-remember-pwd" checked>
          <span>记住密码</span>
        </label>
        <span class="gate-switch-link" id="gate-switch-link" onclick="switchGateAuthMode()">注册新账号</span>
      </div>
      
      <button type="button" class="gate-submit-btn" id="gate-submit-btn" onclick="submitGateAuth()">登 录</button>
      
      <div id="gate-error-msg" class="gate-error-tip"></div>
    </div>
  </div>

  <div id="player-wrap">
    <div id="top-bar">
      <div class="top-left-title">
        <div id="current-title">请在下方选择视频起播</div>
        <button id="btn-fav-toggle" onclick="toggleCurrentFavorite()" title="收藏当前项目">★</button>
      </div>
      <div id="current-route-badge"></div>
    </div>
    
    <div id="status-layer">
      <span class="icon">📺</span>
      <div id="status-text">正在连接直播源...</div>
    </div>

    <div id="gesture-tip"></div>

    <video id="video" playsinline webkit-playsinline></video>

    <div id="custom-controls">
      <div id="progress-container">
        <div id="progress-track">
          <div id="progress-bar">
            <div id="progress-thumb"></div>
          </div>
        </div>
      </div>

      <div class="controls-inner">
        <div class="ctrl-left">
          <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()" title="播放/暂停">
            <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="#fff"><polygon points="6,4 20,12 6,20"/></svg>
            <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="#fff" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          
          <button class="ctrl-btn pill-btn" id="speed-btn" onclick="cyclePlaybackRate()" title="倍速">1.0倍</button>
          <button class="ctrl-btn pill-btn" id="ratio-btn" onclick="cycleAspectRatio()" title="画面比例">适应</button>
          
          <div class="volume-box">
            <button class="ctrl-btn" onclick="toggleMute()" title="静音切换">
              <svg id="volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <input type="range" class="volume-slider" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
          </div>

          <span class="ctrl-time" id="stream-time">00:00 / 00:00</span>
        </div>

        <div class="ctrl-right">
          <div class="external-group" title="横向滑动选择播放器">
            <button class="ext-btn" onclick="copyCurrentUrl()" title="复制直链">
              <svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('vlc')" title="VLC 播放器">
              <svg viewBox="0 0 48 48">
                <path fill="#FF8800" d="M24 4c-.9 0-1.7.6-1.9 1.5L16.2 32h15.6l-5.9-26.5c-.2-.9-1-1.5-1.9-1.5z"/>
                <path fill="#FFFFFF" d="M19.1 19h9.8l-1.8-8h-6.2l-1.8 8z"/>
                <path fill="#FFFFFF" d="M16.9 29h14.2l-1.6-7H18.5l-1.6 7z"/>
                <path fill="#FF8800" d="M7 40c0 2.2 7.6 4 17 4s17-1.8 17-4l-3-6H10l-3 6z"/>
                <ellipse cx="24" cy="40" rx="17" ry="3.5" fill="#E65100"/>
                <path fill="#FF9800" d="M10 34h28l-2.4 5H12.4L10 34z"/>
              </svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('potplayer')" title="PotPlayer 播放器">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC800"/><polygon points="9,7 17,12 9,17" fill="#333"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('iina')" title="IINA 播放器">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#4B3869"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('nplayer')" title="nPlayer 播放器">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#007AFF"/><polygon points="10,8 16,12 10,16" fill="#fff"/></svg>
            </button>
            <button class="ext-btn" onclick="openPlayer('aptv')" title="APTV 播放器">
              <svg viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="4" fill="#000"/><polygon points="8,6 16,12 8,18" fill="#30D158"/></svg>
            </button>
          </div>

          <button class="ctrl-btn pip-btn" onclick="togglePiP()" title="画中画小窗">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1"/></svg>
          </button>

          <button class="ctrl-btn" onclick="toggleFullScreen()" title="全屏模式">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="sidebar">
    <div id="search-box">
      <div class="search-row-primary">
        <div class="search-input-wrap">
          <input type="text" id="filter" placeholder="搜索片名、视频、电视频道..." onkeydown="handleEnterSearch(event)" oninput="toggleClearBtn(this.value)">
          <span class="btn-clear-kw" id="clear-kw" onclick="clearSearchInput()">✕</span>
        </div>
        <button class="btn-search" onclick="triggerSearch()">搜索</button>
        <button type="button" class="btn-quick-theme" id="main-quick-theme-btn" onclick="toggleGlobalThemeClick()" title="切换白天/夜间主题"></button>
      </div>

      <div class="search-row-secondary">
        <button class="btn-tool-mid" id="btn-show-fav" onclick="switchSidebarView('fav')">⭐ 我的收藏</button>
        <button class="btn-tool-mid" id="btn-show-history" onclick="switchSidebarView('history')">🕒 播放历史</button>
        <button class="btn-tool-mid" id="btn-open-settings" onclick="handleMainSettingsButtonClick()">⚙ 设置</button>
      </div>

      <!-- 修复后的模式切换按钮：双向稳定切换 -->
      <div class="mode-tab-group">
        <button type="button" class="mode-tab" id="tab-tv" onclick="switchMode('tv')">📺 电视直播</button>
        <button type="button" class="mode-tab active" id="tab-vod" onclick="switchMode('vod')">🎬 影视剧场</button>
      </div>
    </div>
    <div id="channel-list">
      <div style="padding: 24px; color: var(--text-sub); text-align: center;">在上方输入关键词搜索 🔍</div>
    </div>
  </div>

  <!-- 普通成员个人账户弹窗 (高级毛玻璃) -->
  <div id="user-account-modal-mask" class="glass-modal-mask">
    <div class="glass-modal-card" style="max-width: 320px; text-align: center;">
      <h3>
        <span>👤 个人账户</span>
        <span style="font-size:16px;color:var(--text-sub);cursor:pointer;" onclick="closeUserAccountModal()">✕</span>
      </h3>
      <div style="margin: 20px 0 16px 0;">
        <div style="font-size: 17px; font-weight: bold; color: #54a56a;" id="ua-username-display">用户名</div>
        <div style="font-size: 11px; color: var(--text-sub); margin-top: 6px;">普通注册成员 (观影权限)</div>
      </div>
      <button type="button" class="btn-action" style="width: 100%; background: #cf222e; color: #fff; padding: 10px; font-size: 13px;" onclick="logoutCurrentUserFromAccountModal()">退出登录</button>
    </div>
  </div>

  <!-- 主设置弹窗 (高级毛玻璃) -->
  <div id="modal-mask" class="glass-modal-mask">
    <div id="source-modal" class="glass-modal-card">
      <h3>
        <span>⚙ 系统设置与数据管理</span>
        <span style="font-size:16px;color:var(--text-sub);cursor:pointer;" onclick="closeSourceModal()">✕</span>
      </h3>

      <!-- 1. 顶部管理员栏：主管理员 | 门禁开关 | 退出登录 -->
      <div class="settings-user-header-box">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 15px;">👤</span>
          <span id="settings-username-label" style="font-size: 13px; font-weight: bold;">管理员</span>
          <span class="user-badge-role role-admin">主管理员</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-main);">
          <span style="font-weight: 500;">门禁</span>
          <input type="checkbox" id="auth-require-toggle" style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent);" onchange="toggleRequireLoginSwitch(this.checked)">
        </div>
        <button type="button" class="btn-action btn-cancel" style="padding: 4px 10px; font-size: 11px;" onclick="logoutCurrentUser()">退出登录</button>
      </div>

      <!-- 2. 独立毛玻璃弹窗导航入口 (右侧文字已去掉，替换为极简 ↕ 箭头图标) -->
      <button type="button" class="glass-nav-card-btn" onclick="openSitesModal()">
        <span>🎬 视频采集源管理 (<span id="sites-count-badge">0</span> 个)</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.65; flex-shrink: 0;"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
      </button>

      <button type="button" class="glass-nav-card-btn" onclick="openAccountsModal()">
        <span>👥 账号与权限管理 (<span id="user-count-badge">0</span> 人)</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.65; flex-shrink: 0;"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
      </button>

      <label class="input-label">影视订阅地址：</label>
      <input type="text" id="sub-url-input" placeholder="输入影视订阅地址">
      <div class="sub-stats">数据将永久安全保存在云数据库中</div>

      <label class="input-label">电视直播源地址（M3U）：</label>
      <input type="text" id="source-m3u-input" placeholder="输入直播源 M3U 地址">

      <label class="input-label">自动更新周期：</label>
      <select id="auto-sync-interval">
        <option value="0">仅手动更新 (推荐)</option>
        <option value="12">每 12 小时自动更新</option>
        <option value="24">每 24 小时 (1 天) 自动更新</option>
        <option value="72">每 3 天自动更新</option>
        <option value="168">每 7 天自动更新</option>
      </select>

    function isSafeUrl(url) {

    async function hashPassword(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function parseQualityTag(remarks) {
      if (!remarks) return { text: '正片', cls: 'q-normal' };
      const r = remarks.toUpperCase();
      if (r.includes('4K') || r.includes('2160')) return { text: '4K', cls: 'q-4k' };
      if (r.includes('1080') || r.includes('BD') || r.includes('蓝光') || r.includes('FHD')) return { text: '1080p', cls: 'q-1080' };
      if (r.includes('720') || r.includes('HD')) return { text: '720p', cls: 'q-720' };
      if (r.includes('TC') || r.includes('抢先')) return { text: 'TC', cls: 'q-normal' };
      return { text: remarks.length <= 6 ? remarks : '正片', cls: 'q-normal' };
    }

    function detectCensorshipTag(vod, siteName) {
      if (!vod) return '';
      const name = (vod.vod_name || '').toLowerCase();
      const type = (vod.type_name || '').toLowerCase();
      const remarks = (vod.vod_remarks || '').toLowerCase();
      const sub = (vod.vod_sub || '').toLowerCase();
      const sName = (siteName || '').toLowerCase();
      const fullStr = `${name} ${type} ${remarks} ${sub} ${sName}`;

      const uncensoredRegex = /(无码|步兵|uncensored|无遮|无马|破解去码|流出无码|去码|无修正|未修正|一本道|加勒比|caribbean|1pondo|10musume|pacopacomama|heyzo|tokyo[-_ ]?hot|东京热|天然素人|c0930|h0930|h4610|mywife|muramura|gachinco|s-cute|\bfc2\b)/i;
      if (uncensoredRegex.test(fullStr)) {
        return '🔞 无码';
      }

      const censoredRegex = /(有码|骑兵|censored|薄码|带码|有马|日韩有码|日本有码|亚洲有码)/i;
      if (censoredRegex.test(fullStr)) {
        return '🔞 有码';
      }

      const isAdultContext = isNSFWSource(siteName) ||
        /(自拍|伦理|成人|福利|三级|情色|色情|偷拍|无码|有码|av|女优|同人|cosplay|写真)/i.test(type) ||
        /(av|女优|jav)/i.test(name);

      if (isAdultContext) {
        const javCensoredCodeRegex = /\b(ssni|ipx|midv|jul|stars|mide|miaa|snis|abp|ipz|adn|ebod|pppd|sdde|tek|jufe|fsdss|dldss|cae|pred|cesd|wanz|das|hbad|mifd|sod|moodyz|ideapocket|prestige|attackers|kmhr|bibi|soe|star|ssis|meyd|dand|hunt|rebd|gun)[-_ ]?\d{2,5}\b/i;
        if (javCensoredCodeRegex.test(name) || javCensoredCodeRegex.test(remarks) || javCensoredCodeRegex.test(sub)) {
          return '🔞 有码';
        }
      }

      return '';
    }

    function normalizeCleanKey(str) {
      if (!str) return '';
      return String(str).toLowerCase()
        .replace(/[\s\:\：\-\_\·\/\\\|，,。.\+]+/g, '')
        .replace(/[（(].*?[)）]/g, '');
    }

    function parseTitleAndVersion(rawName) {
      if (!rawName) return { canonical: "未知影视", version: "" };
      let str = String(rawName).trim();
      let versionList = [];

      const bracketRegex = /[\[\(\（\【\［\{]([^\]\)\）\】\］\}]+)[\]\)\）\】\］\}]/g;
      let m;
      while ((m = bracketRegex.exec(str)) !== null) {
        if (m[1] && m[1].trim()) versionList.push(m[1].trim());
      }
      let cleaned = str.replace(bracketRegex, ' ').trim();

      const endPatterns = [
        /\s*(19\d{2}|20\d{2})\s*$/i,
        /\s*(国语|粤语|英语|韩语|日语|俄语|法语|双语|双字|中字|中英|中英双字|中英双语|国粤|国粤双语|中文字幕|英文字幕|原声|内嵌中字|内嵌字幕)\s*$/i,
        /\s*(4K|2160P|1080P|720P|HD|BD|TC|TS|DVD|蓝光|超清|高清|标清|修复版|4K修复|蓝光重制|重置版|重制版)\s*$/i,
        /\s*(抢先版|完整版|未删减版|未删减|加长版|公映版|院线版|电影版|剧场版|TV版|原版|正片|纯净版|解说版|解说)\s*$/i
      ];

      let changed = true;
      while (changed) {
        changed = false;
        cleaned = cleaned.replace(/[\s\:\：\-\_\·\/\|\\]+$/, '').trim();
        for (const pattern of endPatterns) {
          const match = cleaned.match(pattern);
          if (match) {
            const matchedTag = match[0].trim();
            if (matchedTag && !versionList.includes(matchedTag)) {
              versionList.push(matchedTag);
            }
            cleaned = cleaned.replace(pattern, '').trim();
            changed = true;
          }
        }
      }

      cleaned = cleaned.replace(/^(经典|最新|高清|电影|精选)[\:\：\-\_\s]+/, '').trim();
      cleaned = cleaned.replace(/[\s\:\：\-\_\·\/\|\\]+$/, '').trim();

      return { 
        canonical: cleaned || rawName.trim(), 
        version: versionList.join(' ').trim() 
      };
    }

    const VodSearchCache = {

      ttl: 15 * 60 * 1000,
      memMap: new Map(),

      },

      get(kw, groupId) {
        if (!kw) return null;
        const key = this.makeKey(kw, groupId);
        const memHit = this.memMap.get(key);
        if (memHit && (Date.now() - memHit.time < this.ttl)) {
          return memHit.data;
        }
        return null;
      },

      set(kw, groupId, data) {
        if (!kw || !data || data.length === 0) return;
        const key = this.makeKey(kw, groupId);
        this.memMap.set(key, { time: Date.now(), data });
        if (this.memMap.size > this.maxMemEntries) {
          const oldestKey = this.memMap.keys().next().value;
          this.memMap.delete(oldestKey);
        }
      }
    };

    const B58_CHARS = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const B58_MAP = {};
    for (let i = 0; i < B58_CHARS.length; i++) B58_MAP[B58_CHARS[i]] = i;

    function decodeBase58(string) {
      if (!string || typeof string !== 'string') return '';
      const input = string.trim();
      let leadingOnes = 0;
      while (leadingOnes < input.length && input[leadingOnes] === '1') leadingOnes++;

      const bytes = [0];
      for (let i = leadingOnes; i < input.length; i++) {
        const c = input[i];
        if (!(c in B58_MAP)) throw new Error('无效字符: ' + c);
        for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
        bytes[0] += B58_MAP[c];
        let carry = 0;
        for (let j = 0; j < bytes.length; ++j) {
          bytes[j] += carry;
          carry = bytes[j] >> 8;
          bytes[j] &= 0xff;
        }
        while (carry > 0) {
          bytes.push(carry & 0xff);
          carry >>= 8;
        }
      }

      const result = new Uint8Array(leadingOnes + bytes.length);
      for (let i = 0; i < leadingOnes; i++) result[i] = 0;
      for (let i = 0; i < bytes.length; i++) result[leadingOnes + i] = bytes[bytes.length - 1 - i];
      return new TextDecoder('utf-8').decode(result);
    }

    function formatTime(sec) {

    function showControls() {
      wrap.classList.remove('controls-hidden');
      clearTimeout(controlsHideTimer);

    }

    wrap.addEventListener('mousemove', showControls);

    let seekChainTimer = null;
    let seekAccumSec = 0;
    let seekActiveDir = null;
    let lastTapTime = 0;
    let lastTapSide = null;

    wrap.addEventListener('touchend', (e) => {
      if (e.target.closest('#custom-controls') || e.target.closest('#top-bar')) return;
      const touch = e.changedTouches[0];
      if (!touch) return;

      const rect = wrap.getBoundingClientRect();
      const xRatio = (touch.clientX - rect.left) / rect.width;
      const now = performance.now();
      const dt = now - lastTapTime;

      let side = 'center';
      if (xRatio < 0.35) side = 'left';
      else if (xRatio > 0.65) side = 'right';

      if (isLiveMode) {
        if (dt < 320 && side === 'center') {

          showGestureTip(video.paused ? "⏸ 暂停" : "▶ 播放");

        if (side === 'left') {
          video.currentTime = Math.max(0, video.currentTime - 10);
          showGestureTip(`⏪ 快退 ${seekAccumSec} 秒`);
        } else {
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          showGestureTip(`⏩ 快进 ${seekAccumSec} 秒`);
        }

        if (video.duration && isFinite(video.duration)) {
          streamTimeEl.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
          progressBar.style.width = `${(video.currentTime / video.duration) * 100}%`;
        }

        lastTapTime = now;
        clearTimeout(seekChainTimer);
        seekChainTimer = setTimeout(() => {
          seekActiveDir = null;
          seekAccumSec = 0;
        }, 750);

        showControls();
        return;
      }

      if (dt < 320 && lastTapSide === side) {
        if (side === 'left') {
          seekActiveDir = 'left';
          seekAccumSec = 10;
          video.currentTime = Math.max(0, video.currentTime - 10);
          showGestureTip(`⏪ 快退 10 秒`);
          clearTimeout(seekChainTimer);
          seekChainTimer = setTimeout(() => {
            seekActiveDir = null;
            seekAccumSec = 0;
          }, 750);
        } else if (side === 'right') {
          seekActiveDir = 'right';
          seekAccumSec = 10;
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          showGestureTip(`⏩ 快进 10 秒`);
          clearTimeout(seekChainTimer);
          seekChainTimer = setTimeout(() => {
            seekActiveDir = null;
            seekAccumSec = 0;
          }, 750);
        } else {
          togglePlay();
          showGestureTip(video.paused ? "⏸ 暂停" : "▶ 播放");
        }

        if (video.duration && isFinite(video.duration)) {
          streamTimeEl.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
          progressBar.style.width = `${(video.currentTime / video.duration) * 100}%`;
        }
      } else {
        if (seekActiveDir && seekActiveDir !== side) {
          seekActiveDir = null;
          seekAccumSec = 0;
          clearTimeout(seekChainTimer);
        }
      }

      lastTapTime = now;
      lastTapSide = side;
      showControls();
    }, { passive: true });

    function cyclePlaybackRate() {

    async function savePlaybackProgress() {
      if (isLiveMode || !currentPlayingMeta || !video.duration || video.currentTime < 2) return;
      const nowSec = Math.floor(video.currentTime);
      if (Math.abs(nowSec - lastSavedTime) < 4) return;
      lastSavedTime = nowSec;

      let history = await getHistoryList();
      const existingIdx = history.findIndex(h => h.key === currentVodUniqueKey);
      const item = {
        key: currentVodUniqueKey,
        title: currentPlayingMeta.title,
        epName: currentPlayingMeta.epName || '正片',
        url: currentStreamUrl,
        time: nowSec,
        duration: Math.floor(video.duration),
        siteName: currentPlayingMeta.siteName || '',
        thumb: currentPlayingMeta.thumb || '',
        censorTag: currentPlayingMeta.censorTag || '',
        updatedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      if (existingIdx >= 0) history.splice(existingIdx, 1);
      history.unshift(item);
      if (history.length > 50) history.pop();
      setD1Data(getCurrentHistoryKey(), history);
    }

    video.addEventListener('timeupdate', () => {
      savePlaybackProgress();
      if (isDraggingProgress) return;

      if (isLiveMode || !video.duration || !isFinite(video.duration)) {
        streamTimeEl.textContent = "直播";
        progressBar.style.width = "100%";
        return;
      }
      const cur = video.currentTime;
      const dur = video.duration;
      streamTimeEl.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      progressBar.style.width = `${(cur / dur) * 100}%`;
    });

    function calcProgressRatio(clientX) {
      const rect = progressTrack.getBoundingClientRect();
      return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    }

    function onPointerDown(e) {
      if (isLiveMode || !video.duration || !isFinite(video.duration)) return;
      isDraggingProgress = true;
      showControls();
      progressContainer.classList.add('dragging');
      progressContainer.setPointerCapture(e.pointerId);

      const ratio = calcProgressRatio(e.clientX);
      progressBar.style.width = `${ratio * 100}%`;
      dragTargetTime = ratio * video.duration;
      streamTimeEl.textContent = `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
    }

    function onPointerMove(e) {
      if (!isDraggingProgress) return;
      showControls();
      const ratio = calcProgressRatio(e.clientX);
      progressBar.style.width = `${ratio * 100}%`;
      dragTargetTime = ratio * video.duration;
      streamTimeEl.textContent = `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
    }

    function onPointerUp(e) {
      if (!isDraggingProgress) return;
      isDraggingProgress = false;
      progressContainer.classList.remove('dragging');
      try { progressContainer.releasePointerCapture(e.pointerId); } catch (_) {}
      video.currentTime = dragTargetTime;
      showControls();
    }

    progressContainer.addEventListener('pointerdown', onPointerDown);
    progressContainer.addEventListener('pointermove', onPointerMove);
    progressContainer.addEventListener('pointerup', onPointerUp);
    progressContainer.addEventListener('pointercancel', onPointerUp);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.code) {
        case 'Space': case 'KeyK': e.preventDefault(); togglePlay(); break;
        case 'ArrowLeft': case 'KeyJ': e.preventDefault(); if (!isLiveMode) { video.currentTime = Math.max(0, video.currentTime - 10); showControls(); } break;
        case 'ArrowRight': case 'KeyL': e.preventDefault(); if (!isLiveMode) { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showControls(); } break;
        case 'ArrowUp': e.preventDefault(); changeVolume(Math.min(1, video.volume + 0.1)); volSlider.value = video.volume; showControls(); break;
        case 'ArrowDown': e.preventDefault(); changeVolume(Math.max(0, video.volume - 0.1)); volSlider.value = video.volume; showControls(); break;
        case 'KeyM': e.preventDefault(); toggleMute(); break;
        case 'KeyF': e.preventDefault(); toggleFullScreen(); break;
      }
    });

    function togglePlay() {
      if (!currentStreamUrl) return;
      if (video.paused) video.play().then(() => { updatePlayBtn(true); showControls(); }).catch(() => {});
      else { video.pause(); updatePlayBtn(false); showControls(); }
    }

    function updatePlayBtn(isPlaying) {
      playIcon.style.display = isPlaying ? 'none' : 'block';
      pauseIcon.style.display = isPlaying ? 'block' : 'none';

    function toggleMute() {
      video.muted = !video.muted;
      document.getElementById('volume-icon').setAttribute('stroke', video.muted ? '#ff6b6b' : '#fff');

    function toggleFullScreen() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); return; }
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => enterPseudoFullscreen());
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        else enterPseudoFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

        case 'vlc': s = navigator.userAgent.match(/(iPhone|iPad|iPod)/i) ? `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}` : `vlc://${rawUrl}`; break;
        case 'potplayer': s = `potplayer://${rawUrl.replace(/^https?:\/\//i, '')}`; break;
        case 'iina': s = `iina://weblink?url=${encodeURIComponent(rawUrl)}`; break;
        case 'nplayer': s = `nplayer-${rawUrl}`; break;
        case 'aptv': s = `aptv://install?url=${encodeURIComponent(rawUrl)}`; break;
      }
      if (s) window.location.href = s;
    }

    const SVG_SUN = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="12" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
    const SVG_MOON = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

    function applyGlobalTheme(themeMode) {
      currentThemeSetting = themeMode;
      let isDark = false;

      if (themeMode === 'light') {
        isDark = false;
      } else if (themeMode === 'dark') {
        isDark = true;
      } else {
        const hour = new Date().getHours();
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        isDark = prefersDark || (hour >= 19 || hour < 6);
      }

      document.body.classList.toggle('theme-light', !isDark);

      const gateScreen = document.getElementById('auth-gate-screen');
      if (gateScreen) gateScreen.classList.toggle('dark-theme', isDark);

      const gateThemeBtn = document.getElementById('gate-theme-toggle');
      if (gateThemeBtn) gateThemeBtn.innerHTML = isDark ? SVG_MOON : SVG_SUN;

      const mainThemeBtn = document.getElementById('main-quick-theme-btn');
      if (mainThemeBtn) mainThemeBtn.innerHTML = isDark ? SVG_MOON : SVG_SUN;

      const sel = document.getElementById('sys-theme-select');
      if (sel) sel.value = themeMode;
    }

    function toggleGlobalThemeClick() {
      const isCurrentlyDark = !document.body.classList.contains('theme-light');
      const newMode = isCurrentlyDark ? 'light' : 'dark';
      applyGlobalTheme(newMode);
      localStorage.setItem(KEY_THEME_PREF, newMode);
      setD1Data(KEY_THEME_PREF, newMode);
      showGestureTip(newMode === 'light' ? "☀️ 已切至白天白色主题" : "🌙 已切至夜间黑色主题");
    }

    function changeSystemTheme(val) {
      applyGlobalTheme(val);
      localStorage.setItem(KEY_THEME_PREF, val);
      setD1Data(KEY_THEME_PREF, val);
      showGestureTip("✓ 主题外观已更新");
    }

    function checkGateInputsReady() {
      const u = (document.getElementById('gate-username').value || '').trim();

    function switchGateAuthMode() {
      if (gateAuthMode === 'init_admin') return;
      const isLogin = gateAuthMode === 'login';
      gateAuthMode = isLogin ? 'register' : 'login';
      document.getElementById('gate-submit-btn').textContent = isLogin ? '注 册' : '登 录';
      document.getElementById('gate-switch-link').textContent = isLogin ? '返回账号登录' : '注册新账号';
      document.getElementById('gate-error-msg').style.display = 'none';
      checkGateInputsReady();
    }

    async function submitGateAuth() {
      const u = (document.getElementById('gate-username').value || '').trim();
      const p = (document.getElementById('gate-password').value || '').trim();
      const remember = document.getElementById('gate-remember-pwd').checked;

      if (!u || !p) {
        showGateError("账号或密码错误");
        return;
      }

      const passHash = await hashPassword(p);

      if (gateAuthMode === 'init_admin') {
        adminAccount = { username: u, passHash: passHash };
        await setD1Data(KEY_ADMIN_INFO, adminAccount);
        currentUser = { username: u, role: 'admin', allowedSites: ['*'] };
        if (remember) localStorage.setItem(KEY_SAVED_CREDS, JSON.stringify({ u, passHash }));
        localStorage.setItem(KEY_CURRENT_USER, JSON.stringify(currentUser));
        updateMainRoleButton();
        document.getElementById('auth-gate-screen').style.display = 'none';
        showGestureTip("✓ 初始化成功");
        return;
      }

      if (gateAuthMode === 'login') {
        if (adminAccount && u === adminAccount.username && passHash === adminAccount.passHash) {
          currentUser = { username: u, role: 'admin', allowedSites: ['*'] };
        } else {
          const found = userList.find(item => item.username === u && item.passHash === passHash);
          if (found) {
            currentUser = { username: found.username, role: 'user', groupId: found.groupId || 'def', groupName: found.groupName || '默认分组' };
          } else {
            showGateError("账号或密码错误");
            return;
          }
        }

        if (remember) localStorage.setItem(KEY_SAVED_CREDS, JSON.stringify({ u, passHash }));
        else localStorage.removeItem(KEY_SAVED_CREDS);

        localStorage.setItem(KEY_CURRENT_USER, JSON.stringify(currentUser));
        updateMainRoleButton();
        document.getElementById('auth-gate-screen').style.display = 'none';
      } else {
        if ((adminAccount && u === adminAccount.username) || userList.some(item => item.username === u)) {
          showGateError("账号已存在");
          return;
        }

        const favKey = `favs_u_${u}`;
        const histKey = `history_u_${u}`;
        localStorage.removeItem(favKey);
        localStorage.removeItem(histKey);
        setD1Data(favKey, '[]');
        setD1Data(histKey, '[]');

        const defaultGroup = sourceGroups.find(g => g.isDefault) || sourceGroups[0] || { id: 'def', name: '默认分组' };
        const newUser = { username: u, passHash: passHash, groupId: defaultGroup.id, groupName: defaultGroup.name };
        userList.push(newUser);
        setD1Data(KEY_USERS_LIST, userList);

        currentUser = { username: u, role: 'user', groupId: defaultGroup.id, groupName: defaultGroup.name };
        if (remember) localStorage.setItem(KEY_SAVED_CREDS, JSON.stringify({ u, passHash }));
        localStorage.setItem(KEY_CURRENT_USER, JSON.stringify(currentUser));
        updateMainRoleButton();
        document.getElementById('auth-gate-screen').style.display = 'none';
        showGestureTip("✓ 注册成功");
      }
    }

    async function promptCustomFailureThreshold() {
      if (!currentUser || currentUser.role !== 'admin') {
        alert("仅主管理员有权修改此设置！");
        return;
      }
      const val = prompt("请输入失效自动禁用阈值次数（达到该次数后自动禁用并沉底）：", failThreshold);
      if (val === null) return;
      const num = parseInt(val, 10);
      if (isNaN(num) || num <= 0) {
        alert("请输入大于 0 的有效整数！");
        return;
      }
      failThreshold = num;
      localStorage.setItem(KEY_FAIL_THRESHOLD, String(failThreshold));
      setD1Data(KEY_FAIL_THRESHOLD, String(failThreshold));

      for (const siteName in sourceFailures) {
        const count = sourceFailures[siteName]?.count || 0;
        if (count >= failThreshold && !disabledSites.includes(siteName)) {
          disabledSites.push(siteName);
        }
      }
      await setD1Data(KEY_DISABLED_SITES, disabledSites);
      renderSitesManagerList();
      showGestureTip(`✓ 禁用阈值已同步设置为 ${failThreshold} 次`);
    }

    async function recordSourceFailure(siteName, videoKey) {
      if (!currentUser || currentUser.role !== 'admin') return;
      if (!siteName) return;

      const vKey = videoKey || currentVodUniqueKey || currentPlayingMeta?.title || '未知影片';
      if (!sourceFailures[siteName]) {
        sourceFailures[siteName] = { count: 0, failedVideos: [] };
      }
      const rec = sourceFailures[siteName];
      if (!rec.failedVideos) rec.failedVideos = [];

      if (!rec.failedVideos.includes(vKey)) {
        rec.failedVideos.push(vKey);
        rec.count = rec.failedVideos.length;

        if (rec.count >= failThreshold && !disabledSites.includes(siteName)) {
          disabledSites.push(siteName);
          await setD1Data(KEY_DISABLED_SITES, disabledSites);
          showGestureTip(`⚠️ 源【${siteName}】失效达到 ${failThreshold} 次，已自动禁用并沉底`);
        }
        await setD1Data(KEY_SOURCE_FAILURES, sourceFailures);

        if (document.getElementById('sites-modal-mask').style.display === 'flex') {
          renderSitesManagerList();
        }
      }
    }

    async function resetAllFailedSites() {

        alert("仅主管理员有权执行此操作！");
        return;
      }
      if (!confirm("确定重置所有源的失效统计并恢复启用吗？")) return;
      sourceFailures = {};
      disabledSites = [];
      await setD1Data(KEY_SOURCE_FAILURES, sourceFailures);
      await setD1Data(KEY_DISABLED_SITES, disabledSites);
      renderSitesManagerList();
      showGestureTip("✓ 已重置全部失效统计并恢复");
    }

    function renderSitesManagerList() {
      const container = document.getElementById('sites-items-container');
      const badge = document.getElementById('sites-count-badge');
      const badgeSub = document.getElementById('sites-count-badge-sub');
      if (badge) badge.textContent = parsedSites.length;
      if (badgeSub) badgeSub.textContent = parsedSites.length;
      const thBadge = document.getElementById('custom-threshold-badge');
      if (thBadge) thBadge.textContent = failThreshold;

      if (!parsedSites || parsedSites.length === 0) {
        container.innerHTML = '<div style="padding:10px;text-align:center;color:var(--text-sub);font-size:12px;">暂无解析到的视频源，请先同步订阅或手动添加</div>';
        return;
      }

      const sortedSites = parsedSites.slice().sort((a, b) => {
        const isDisA = disabledSites.includes(a.name) ? 1 : 0;
        const isDisB = disabledSites.includes(b.name) ? 1 : 0;
        if (isDisA !== isDisB) return isDisA - isDisB;
        const failA = sourceFailures[a.name]?.count || 0;
        const failB = sourceFailures[b.name]?.count || 0;
        return failB - failA;
      });

      container.innerHTML = sortedSites.map((site) => {
        const isDis = disabledSites.includes(site.name);
        const failCount = sourceFailures[site.name]?.count || 0;

        return `
          <div class="site-toggle-row" style="${isDis ? 'opacity:0.65;background:rgba(0,0,0,0.1);' : ''}">
            <div style="flex:1.2; min-width:0; display:flex; align-items:center;">

      const lastTime = new Date(lastTimeStr).getTime();

        await triggerSilentSync();

    function extractSitesFromAnyJson(parsed) {
      const results = [];
      if (!parsed || typeof parsed !== 'object') return results;
      if (parsed.api_site && typeof parsed.api_site === 'object') {
        for (let key in parsed.api_site) {
          const item = parsed.api_site[key];
          if (item?.api && isSafeUrl(item.api)) results.push({ name: item.name || key, api: item.api.trim() });
        }
      }
      let list = Array.isArray(parsed) ? parsed : (parsed.video?.sites) || parsed.sites || [];
      for (const item of list) {
        const api = item.api || item.url;
        if (api && typeof api === 'string' && isSafeUrl(api)) results.push({ name: item.name || item.key || '影视源', api: api.trim() });
      }
      return results;
    }

    function parseSubscriptionPayload(text) {
      let raw = text.trim();
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (_) {
        try {
          const decoded = decodeBase58(raw);
          parsed = JSON.parse(decoded.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, ''));
        } catch (_) {}
      }
      return extractSitesFromAnyJson(parsed);
    }

    async function fetchWithSmartProxy(targetUrl, timeout = 2500, signal = null) {
      const fetchWithTimer = (url) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        if (signal) signal.addEventListener('abort', () => controller.abort());
        return fetch(url, { signal: controller.signal })
          .then(res => { clearTimeout(timer); if (!res.ok) throw new Error(); return res.text(); })
          .catch(e => { clearTimeout(timer); throw e; });
      };

      try { return await fetchWithTimer(targetUrl); } catch (_) {}
      try { return await fetchWithTimer(`/api/data?action=proxy&proxy_url=${encodeURIComponent(targetUrl)}`); } catch (_) {}
      throw new Error("网络超时");
    }

    async function asyncPool(poolLimit, array, iteratorFn) {
      const ret = [];
      const executing = [];
      for (const item of array) {
        const p = Promise.resolve().then(() => iteratorFn(item));
        ret.push(p);
        if (poolLimit <= array.length) {
          const e = p.then(() => executing.splice(executing.indexOf(e), 1));
          executing.push(e);
          if (executing.length >= poolLimit) await Promise.race(executing);
        }
      }
      return Promise.all(ret);
    }

      if (window.location.protocol === 'https:' && testUrl.startsWith('http://')) {
        testUrl = testUrl.replace(/^http:\/\//i, 'https://');
      }
      return testUrl;
    }

    async function probeStreamLatency(testUrl) {
      if (!isSafeUrl(testUrl)) return 9999;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1500);
      const t0 = performance.now();
      try {
        await fetch(testUrl, { method: 'HEAD', mode: 'no-cors', cache: 'no-cache', signal: controller.signal });
        clearTimeout(timer);
        return Math.max(1, Math.round(performance.now() - t0));
      } catch (_) {
        clearTimeout(timer);
        return 9999;
      }
    }
