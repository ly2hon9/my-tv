<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>聚合影视与电视直播</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      color: #eee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    /* =========================
       PLAYER
    ========================= */

    #player-wrap {
      width: 100%;
      height: 40vh;
      min-height: 240px;
      background: #000;
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: default;
    }

    #player-wrap.pseudo-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 99999 !important;
      max-height: none !important;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
      transition: object-fit .2s;
    }

    video.fit-cover {
      object-fit: cover;
    }

    video.fit-fill {
      object-fit: fill;
    }

    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding:
        max(10px, env(safe-area-inset-top))
        14px
        18px;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.9),
        rgba(0,0,0,.25),
        transparent
      );
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .top-left-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      pointer-events: auto;
    }

    #current-title {
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: min(70vw, 700px);
    }

    #btn-fav-toggle {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #aaa;
      transition: transform .15s, color .15s;
      line-height: 1;
      flex-shrink: 0;
    }

    #btn-fav-toggle.active {
      color: #facc15;
      transform: scale(1.15);
    }

    #current-route-badge {
      font-size: 11px;
      background: #0070f3;
      color: #fff;
      padding: 3px 7px;
      border-radius: 4px;
      display: none;
      flex-shrink: 0;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 8;
      color: #fff;
      background: rgba(25,25,25,.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.12);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      pointer-events: none;
      display: none;
      text-align: center;
      max-width: 88%;
      box-shadow: 0 10px 30px rgba(0,0,0,.6);
      line-height: 1.6;
    }

    #gesture-tip {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 9;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
    }

    #custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.97) 0%,
          rgba(0,0,0,.55) 70%,
          transparent 100%
        );
      display: flex;
      flex-direction: column;
      z-index: 15;
      transition: opacity .3s ease;
      padding-bottom: max(2px, env(safe-area-inset-bottom));
    }

    #player-wrap.controls-hidden #custom-controls,
    #player-wrap.controls-hidden #top-bar {
      opacity: 0;
      pointer-events: none;
    }

    #player-wrap.controls-hidden {
      cursor: none;
    }

    #progress-container {
      width: 100%;
      height: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0 10px;
      touch-action: none;
      user-select: none;
    }

    #progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.25);
      border-radius: 2px;
      position: relative;
      transition: height .15s ease;
    }

    #progress-container.dragging #progress-track,
    #progress-container:hover #progress-track {
      height: 5px;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #0070f3;
      border-radius: 2px;
      position: relative;
    }

    #progress-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      transition: transform .15s ease;
      box-shadow: 0 0 6px rgba(0,0,0,.8);
      pointer-events: none;
    }

    #progress-container.dragging #progress-thumb,
    #progress-container:hover #progress-thumb {
      transform: translateY(-50%) scale(1);
    }

    .controls-inner {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      gap: 6px;
      min-width: 0;
    }

    .ctrl-left,
    .ctrl-right {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .ctrl-left {
      flex-shrink: 1;
      overflow: hidden;
    }

    .ctrl-right {
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      opacity: .88;
      transition: opacity .2s;
      font-size: 12px;
      padding: 2px;
      flex-shrink: 0;
    }

    .ctrl-btn:hover {
      opacity: 1;
    }

    .ctrl-time {
      font-size: 11px;
      color: #aaa;
      font-family: monospace;
      white-space: nowrap;
      user-select: none;
    }

    .pill-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      color: #ddd;
      white-space: nowrap;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .volume-slider {
      width: 50px;
      height: 3px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255,255,255,.3);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
    }

    .external-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 6px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.15);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 1;
      max-width: 150px;
    }

    .external-group::-webkit-scrollbar {
      display: none;
    }

    .ext-btn {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.9);
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .ext-btn svg {
      width: 14px;
      height: 14px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    #sidebar {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #161616;
      border-top: 1px solid #282828;
    }

    #search-box {
      padding: 10px 12px;
      background: #1f1f1f;
      border-bottom: 1px solid #2b2b2b;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row-primary,
    .search-row-secondary {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    #search-box input {
      width: 100%;
      padding: 8px 30px 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    #search-box input:focus {
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0,112,243,.15);
    }

    .btn-clear-kw {
      position: absolute;
      right: 8px;
      color: #777;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .btn-search {
      background: #0070f3;
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-search:active {
      transform: scale(.98);
    }

    .btn-tool-mid,
    .btn-source-mgr {
      flex: 1;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #eee;
      border-radius: 6px;
      padding: 7px 0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      text-align: center;
      min-width: 0;
    }

    .btn-tool-mid:hover,
    .btn-source-mgr:hover {
      background: #383838;
    }

    .btn-tool-mid.active {
      background: #0070f3;
      border-color: #0070f3;
      color: #fff;
    }

    .mode-tab-group {
      display: flex;
      gap: 6px;
    }

    .mode-tab {
      flex: 1;
      padding: 6px 0;
      background: #252525;
      border: 1px solid #383838;
      color: #999;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }

    .mode-tab.active {
      background: #0070f3;
      color: #fff;
      border-color: #0070f3;
      font-weight: 500;
    }

    #channel-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* =========================
       VOD
    ========================= */

    .episodes-collapse-box {
      background: #191919;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 14px;
    }

    .episodes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 6px;
      margin-top: 10px;
      max-height: 170px;
      overflow-y: auto;
    }

    .ep-item {
      background: #222;
      border: 1px solid #333;
      padding: 6px 2px;
      border-radius: 4px;
      font-size: 12px;
      color: #bbb;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ep-item.active {
      background: #0070f3;
      color: #fff;
      border-color: #0070f3;
      font-weight: bold;
    }

    .sources-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #1c1c1c;
      border-bottom: 1px solid #282828;
      gap: 8px;
    }

    .sources-header-title {
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .source-card {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #222;
      background: #161616;
      cursor: pointer;
      transition: background .15s;
    }

    .source-card:hover {
      background: #1f1f1f;
    }

    .source-card.active {
      background: #11253e;
      border-left: 3px solid #0070f3;
    }

    .card-thumb {
      width: 50px;
      height: 68px;
      border-radius: 4px;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
    }

    .card-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: #eee;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-quality {
      font-size: 10px;
      background: #283e2e;
      color: #4ade80;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .card-sitename {
      font-size: 11px;
      color: #aaa;
      margin: 3px 0;
    }

    .card-sitename-tag {
      background: #262626;
      padding: 1px 5px;
      border-radius: 3px;
      color: #ddd;
    }

    .card-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #777;
      font-family: monospace;
    }

    .metric-speed {
      color: #4ade80;
    }

    .metric-ping {
      color: #facc15;
    }

    /* =========================
       HISTORY / FAVORITES
    ========================= */

    .history-card {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      background: #181818;
      cursor: pointer;
    }

    .history-card:hover {
      background: #222;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-meta {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-del-item {
      background: none;
      border: none;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }

    .btn-del-item:hover {
      color: #ef4444;
    }

    /* =========================
       TV
    ========================= */

    .group-header {
      padding: 12px 16px;
      background: #222;
      font-size: 13px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #1a1a1a;
      user-select: none;
    }

    .channel-row {
      border-bottom: 1px solid #222;
      background: #181818;
    }

    .channel-main {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .channel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      min-width: 0;
    }

    .channel-title > span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .channel-arrow {
      transition: transform .2s;
      flex-shrink: 0;
    }

    .channel-row.expanded .channel-arrow {
      transform: rotate(90deg);
      color: #0070f3;
    }

    .channel-row.playing .channel-title {
      color: #0070f3;
      font-weight: bold;
    }

    .sources-panel {
      display: none;
      background: #111;
      padding: 8px 12px 12px 16px;
      border-top: 1px solid #242424;
    }

    .channel-row.expanded .sources-panel {
      display: block;
    }

    .source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin-top: 6px;
      background: #1c1c1c;
      border: 1px solid #2c2c2c;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: #ccc;
    }

    .source-item.active-source {
      border-color: #0070f3;
      background: #0d2847;
      color: #fff;
    }

    .badge-lines {
      font-size: 10px;
      color: #777;
      background: #242424;
      padding: 2px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* =========================
       MODAL
    ========================= */

    #modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #source-modal {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 20px;
      box-shadow: 0 16px 36px rgba(0,0,0,.8);
    }

    #source-modal h3 {
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-label {
      font-size: 12px;
      color: #aaa;
      margin-top: 10px;
      margin-bottom: 4px;
      display: block;
    }

    #source-modal input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    #source-modal input:focus {
      border-color: #0070f3;
    }

    .sub-stats {
      font-size: 12px;
      color: #0070f3;
      margin-top: 6px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-cancel {
      background: #333;
      color: #eee;
    }

    .btn-save {
      background: #0070f3;
      color: #fff;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .volume-slider {
        display: none;
      }

      .pip-btn {
        display: none;
      }

      .external-group {
        max-width: 130px;
      }

      .ctrl-time {
        max-width: 90px;
        overflow: hidden;
      }

      .ctrl-left {
        gap: 4px;
      }

      .ctrl-right {
        gap: 4px;
      }

      #current-title {
        max-width: 55vw;
      }
    }

    @media (min-width: 601px) {
      .search-row-primary {
        flex: 1;
      }

      .search-row-secondary {
        width: auto;
        flex-shrink: 0;
      }

      .btn-tool-mid,
      .btn-source-mgr {
        flex: none;
        padding: 8px 12px;
      }

      .external-group {
        max-width: none;
      }
    }

    @media (min-width: 768px) {
      body {
        display: flex;
        flex-direction: row;
      }

      #sidebar {
        width: 420px;
        border-top: none;
        border-right: 1px solid #282828;
        height: 100%;
        order: 1;
      }

      #player-wrap {
        flex: 1;
        height: 100%;
        min-height: auto;
        order: 2;
      }
    }

    @media (max-width: 767px) {
      body {
        display: flex;
        flex-direction: column;
      }

      #player-wrap {
        height: 40vh;
      }

      #sidebar {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- ================= PLAYER ================= -->

  <div id="player-wrap">

    <div id="top-bar">
      <div class="top-left-title">
        <div id="current-title">请选择视频或频道</div>

        <button
          id="btn-fav-toggle"
          onclick="toggleCurrentFavorite()"
          title="收藏当前项目"
          aria-label="收藏当前项目"
        >★</button>
      </div>

      <div id="current-route-badge"></div>
    </div>

    <div id="status-layer">

/* =========================================================
   SAFE HTML HELPERS

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function safeUrl(url) {

  if (!url || typeof url !== "string") {
    return "";
  }

  const value = url.trim();

  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {
    return value;
  }

  return "";
}


/* =========================================================
   D1 / LOCAL STORAGE
========================================================= */

async function getD1Data(key, defaultVal = "") {

  try {

    const res = await fetch(
      `${CONFIG.API_DATA}?key=${encodeURIComponent(key)}`,
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (res.ok) {

      const data = await res.json();

      if (
        data &&
        data.value !== null &&
        data.value !== undefined
      ) {

        const value =
          typeof data.value === "string"
            ? data.value
            : JSON.stringify(data.value);

        localStorage.setItem(key, value);

        return value;
      }
    }

  } catch (_) {}

  const localValue = localStorage.getItem(key);

  return localValue !== null
    ? localValue
    : defaultVal;
}


async function setD1Data(key, value) {

  const valStr =
    typeof value === "object"
      ? JSON.stringify(value)
      : String(value);

  localStorage.setItem(key, valStr);

  try {

    const res = await fetch(
      CONFIG.API_DATA,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          key,
          value: valStr
        })
      }
    );

    return res.ok;

  } catch (_) {

    return false;

  }
}


/* =========================================================
   BASE58
========================================================= */

const B58_MAP = {};

const B58_CHARS =
  "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

for (
  let i = 0;
  i < B58_CHARS.length;
  i++
) {
  B58_MAP[B58_CHARS[i]] = i;
}


function decodeBase58(str) {

  if (
    !str ||
    typeof str !== "string"
  ) {
    return "";
  }

  str = str.trim();

  const bytes = [0];

  try {

    for (let i = 0; i < str.length; i++) {

      const c = str[i];

      if (!(c in B58_MAP)) {
        throw new Error("invalid base58");
      }

      let carry = B58_MAP[c];

      for (
        let j = 0;
        j < bytes.length;
        j++
      ) {

        const value =
          bytes[j] * 58 + carry;

        bytes[j] = value & 255;

        carry = value >> 8;
      }

      while (carry > 0) {

        bytes.push(carry & 255);

        carry >>= 8;
      }
    }

    let leadingZeroCount = 0;

    while (
      leadingZeroCount < str.length &&
      str[leadingZeroCount] === "1"
    ) {
      leadingZeroCount++;
    }

    for (
      let i = 0;
      i < leadingZeroCount;
      i++
    ) {
      bytes.push(0);
    }

    bytes.reverse();

    return new TextDecoder("utf-8")
      .decode(
        new Uint8Array(bytes)
      );

  } catch (_) {

    return "";

  }
}


/* =========================================================
   UTILITIES
========================================================= */

function sleep(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );

}


function formatTime(sec) {

  if (
    !Number.isFinite(sec) ||
    sec < 0
  ) {
    return "00:00";
  }

  const hours =
    Math.floor(sec / 3600);

  const minutes =
    Math.floor(
      (sec % 3600) / 60
    );

  const seconds =
    Math.floor(sec % 60);

  if (hours > 0) {

    return (
      String(hours).padStart(2, "0") +
      ":" +
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0")
    );

  }

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0")
  );
}


function normalizeUrl(url) {

  if (!url) return "";

  return String(url)
    .trim()
    .replace(/^["']|["']$/g, "");
}


function isHlsUrl(url) {

  return /\.m3u8($|[?#])/i.test(url);
}


function isVideoUrl(url) {

  return /\.(mp4|webm|mov|m4v|mkv)($|[?#])/i.test(url);
}

========================================================= */

  icon = "📺"
) {

  }

function showGestureTip(text) {

  gestureTip.textContent = text;

  gestureTip.style.opacity = "1";

  clearTimeout(gestureTimer);

  gestureTimer = setTimeout(() => {

    gestureTip.style.opacity = "0";

}


/* =========================================================
   CONTROLS
========================================================= */

function showControls() {

  wrap.classList.remove(
    "controls-hidden"
  );

  clearTimeout(
    controlsHideTimer
  );

  if (
    !video.paused &&
    !isDraggingProgress
  ) {

    controlsHideTimer =
      setTimeout(() => {

        wrap.classList.add(
          "controls-hidden"
        );

      }, CONFIG.CONTROLS_HIDE_DELAY);
  }
}


wrap.addEventListener(
  "mousemove",
  showControls
);

wrap.addEventListener(
  "pointerdown",
  showControls
);


/* =========================================================
   TOUCH GESTURES
========================================================= */

let lastTapTime = 0;

wrap.addEventListener(
  "touchend",
  event => {

    const now =
      performance.now();

    const rect =
      wrap.getBoundingClientRect();

    const touch =
      event.changedTouches[0];

    if (!touch) return;

    if (
      now - lastTapTime <
      300
    ) {

      const xRatio =
        (touch.clientX - rect.left) /
        rect.width;

      if (
        xRatio < .35 &&
        !isLiveMode
      ) {

        video.currentTime =
          Math.max(
            0,
            video.currentTime - 10
          );

        showGestureTip(
          "⏪ 快退 10 秒"
        );

      } else if (
        xRatio > .65 &&
        !isLiveMode
      ) {

        video.currentTime =
          Math.min(
            video.duration || 0,
            video.currentTime + 10
          );

        showGestureTip(
          "⏩ 快进 10 秒"
        );

      } else {

        togglePlay();

      }
    }

    lastTapTime = now;

    showControls();

  },
  {
    passive: true
  }
);


/* =========================================================
   PLAYBACK RATE
========================================================= */

function cyclePlaybackRate() {

  currentRateIdx =
    (currentRateIdx + 1) %
    RATES.length;

  const rate =
    RATES[currentRateIdx];

  video.playbackRate = rate;

  speedBtn.textContent =
    `${rate}倍`;

  showGestureTip(
    `倍速：${rate}x`
  );
}


/* =========================================================
   ASPECT RATIO
========================================================= */

function cycleAspectRatio() {

  currentRatioIdx =
    (currentRatioIdx + 1) %
    RATIOS.length;

  const item =
    RATIOS[currentRatioIdx];

  video.className =
    item.className;

  ratioBtn.textContent =
    item.text;

  showGestureTip(
    `画面比例：${item.text}`

/* =========================================================
   VOLUME
========================================================= */

function changeVolume(value) {

  const volume =
    Math.max(
      0,
      Math.min(
        1,
        Number(value)
      )
    );

  video.volume = volume;

  video.muted =
    volume === 0;

  updateVolumeIcon();
}


function toggleMute() {

  video.muted =
    !video.muted;

  updateVolumeIcon();

}


function updateVolumeIcon() {

  const icon =
    document.getElementById(
      "volume-icon"
    );

  if (!icon) return;

  icon.setAttribute(
    "stroke",
    video.muted
      ? "#ff6b6b"
      : "#fff"
  );

  volSlider.value =
    video.muted
      ? 0
      : video.volume;
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function updatePlayBtn(
  isPlaying
) {

  playIcon.style.display =
    isPlaying
      ? "none"
      : "block";

  pauseIcon.style.display =
    isPlaying
      ? "block"
      : "none";
}


function togglePlay() {

  if (video.paused) {

    video.play()
      .then(() => {

        updatePlayBtn(true);

        showControls();

      })
      .catch(() => {

        setStatus(
          "请轻触画面或再次点击播放按钮",
          true,
          "▶️"
        );

      });

  } else {

    video.pause();

    updatePlayBtn(false);

    showControls();

  }
}


/* =========================================================
   PIP
========================================================= */

async function togglePiP() {

  try {

    if (
      document.pictureInPictureElement
    ) {

      await document
        .exitPictureInPicture();

      return;
    }

    if (
      video.requestPictureInPicture
    ) {

      await video.requestPictureInPicture();

      return;
    }

    throw new Error();

  } catch (_) {

    alert(
      "当前设备或浏览器暂不支持画中画"
    );

  }
}


/* =========================================================
   FULLSCREEN
========================================================= */

function toggleFullScreen() {

  const isIOS =
    /iPad|iPhone|iPod/.test(
      navigator.userAgent
    ) &&
    !window.MSStream;

  if (
    isIOS &&
    video.webkitEnterFullscreen
  ) {

    video.webkitEnterFullscreen();

    return;
  }

  if (
    !document.fullscreenElement &&
    !document.webkitFullscreenElement
  ) {

    if (
      wrap.requestFullscreen
    ) {

      wrap
        .requestFullscreen()
        .catch(
          enterPseudoFullscreen
        );

    } else if (
      wrap.webkitRequestFullscreen
    ) {

      wrap.webkitRequestFullscreen();

    } else {

      enterPseudoFullscreen();

    }

  } else {

    if (
      document.exitFullscreen
    ) {

      document.exitFullscreen();

    } else if (
      document.webkitExitFullscreen
    ) {

      document.webkitExitFullscreen();

    }
  }
}


function enterPseudoFullscreen() {

  wrap.classList.toggle(
    "pseudo-fullscreen"
  );

}


/* =========================================================
   EXTERNAL PLAYER
========================================================= */

function openPlayer(type) {

  if (!currentStreamUrl) {

    alert(
      "请先选择一条线路或视频！"
    );

    return;
  }

  const rawUrl =
    normalizeUrl(
      currentStreamUrl
    );

  if (!safeUrl(rawUrl)) {

    alert(
      "当前视频地址格式无法交给外部播放器。"
    );

    return;
  }

  let targetScheme = "";

  const isIOS =
    /iPhone|iPad|iPod/i.test(
      navigator.userAgent
    );

  switch (type) {

    case "vlc":

      targetScheme =
        isIOS
          ? `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}`
          : `vlc://${rawUrl}`;

      break;

    case "potplayer":

      targetScheme =
        `potplayer://${rawUrl.replace(
          /^https?:\/\//i,
          ""
        )}`;

      break;

    case "iina":

      targetScheme =
        `iina://weblink?url=${encodeURIComponent(rawUrl)}`;

      break;

    case "nplayer":

      targetScheme =
        `nplayer-${rawUrl}`;

      break;

    case "aptv":

      targetScheme =
        `aptv://install?url=${encodeURIComponent(rawUrl)}`;

      break;
  }

  if (targetScheme) {

    window.location.href =
      targetScheme;

  }
}

async function savePlaybackProgress() {

  if (
    isLiveMode ||
    !currentPlayingMeta ||
    !video.duration ||
    !Number.isFinite(
      video.duration
    ) ||
    video.currentTime < 2
  ) {

    return;
  }

  const now =
    Math.floor(
      video.currentTime
    );

  if (
    Math.abs(
      now - lastSavedTime
    ) <
    CONFIG.PROGRESS_SAVE_INTERVAL
  ) {

    return;
  }

  lastSavedTime = now;

  let history =
    await getHistoryList();

  const index =
    history.findIndex(
      item =>
        item.key ===
        currentVodUniqueKey
    );

  const record = {

    key:
      currentVodUniqueKey,

    title:
      currentPlayingMeta.title,

    epName:
      currentPlayingMeta.epName ||
      "正片",

    url:
      currentStreamUrl,

    time:
      now,

    duration:
      Math.floor(
        video.duration
      ),

    siteName:
      currentPlayingMeta.siteName ||
      "",

    thumb:
      currentPlayingMeta.thumb ||
      "",

    updatedAt:
      new Date().toLocaleString()

  };

  if (index >= 0) {

    history.splice(
      index,
      1
    );

  }

  history.unshift(record);

  if (
    history.length >
    CONFIG.MAX_HISTORY
  ) {

    history =
      history.slice(
        0,
        CONFIG.MAX_HISTORY
      );
  }

  setD1Data(
    KEY_HISTORY,
    history
  );

}


async function restorePlaybackProgress() {

  if (
    isLiveMode ||
    !currentVodUniqueKey
  ) {

    return;
  }

  const history =
    await getHistoryList();

  const record =
    history.find(
      item =>
        item.key ===
        currentVodUniqueKey
    );

  if (
    record &&
    record.time > 5 &&
    (
      !video.duration ||
      record.time <
      video.duration - 15
    )
  ) {

    try {

      video.currentTime =
        record.time;

      setStatus(
        `已恢复上次播放进度：${formatTime(record.time)}`,
        true,
        "⏯️"
      );

      setTimeout(
        () =>
          setStatus(
            "",
            false
          ),
        1800
      );

    } catch (_) {}

  }
}

/* =========================================================
   PROGRESS BAR
========================================================= */

video.addEventListener(
  "timeupdate",
  () => {

    savePlaybackProgress();

    if (
      isDraggingProgress
    ) {
      return;
    }

    if (
      isLiveMode ||
      !video.duration ||
      !Number.isFinite(
        video.duration
      )
    ) {

      streamTimeEl.textContent =
        "直播";

      progressBar.style.width =
        "100%";

      return;
    }

    const current =
      video.currentTime;

    const duration =
      video.duration;

    streamTimeEl.textContent =
      `${formatTime(current)} / ${formatTime(duration)}`;

    progressBar.style.width =
      `${Math.min(
        100,
        Math.max(
          0,
          current / duration * 100
        )
      )}%`;

  }
);


function calcProgressRatio(
  clientX
) {

  const rect =
    progressTrack.getBoundingClientRect();

  if (!rect.width) {
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      1,
      (clientX - rect.left) /
      rect.width
    )
  );

}


function onPointerDown(event) {

  if (
    isLiveMode ||
    !video.duration ||
    !Number.isFinite(
      video.duration
    )
  ) {

    return;
  }

  isDraggingProgress =
    true;

  showControls();

  progressContainer.classList.add(
    "dragging"
  );

  try {

    progressContainer.setPointerCapture(
      event.pointerId
    );

  } catch (_) {}

  const ratio =
    calcProgressRatio(
      event.clientX
    );

  progressBar.style.width =
    `${ratio * 100}%`;

  dragTargetTime =
    ratio * video.duration;

  streamTimeEl.textContent =
    `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
}


function onPointerMove(event) {

  if (
    !isDraggingProgress
  ) {

    return;
  }

  showControls();

  const ratio =
    calcProgressRatio(
      event.clientX
    );

  progressBar.style.width =
    `${ratio * 100}%`;

  dragTargetTime =
    ratio * video.duration;

  streamTimeEl.textContent =
    `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
}


function onPointerUp(event) {

  if (
    !isDraggingProgress
  ) {

    return;
  }

  isDraggingProgress =
    false;

  progressContainer.classList.remove(
    "dragging"
  );

  try {

    progressContainer.releasePointerCapture(
      event.pointerId
    );

  } catch (_) {}

  if (
    Number.isFinite(
      dragTargetTime
    )
  ) {

    video.currentTime =
      dragTargetTime;

  }

  showControls();

}


progressContainer.addEventListener(
  "pointerdown",
  onPointerDown
);

progressContainer.addEventListener(
  "pointermove",
  onPointerMove
);

progressContainer.addEventListener(
  "pointerup",
  onPointerUp
);

progressContainer.addEventListener(
  "pointercancel",
  onPointerUp
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  event => {

    if (
      event.target.tagName ===
      "INPUT"
    ) {

      return;
    }

    switch (
      event.code
    ) {

      case "Space":
      case "KeyK":

        event.preventDefault();

        togglePlay();

        break;

      case "ArrowLeft":
      case "KeyJ":

        event.preventDefault();

        if (!isLiveMode) {

          video.currentTime =
            Math.max(
              0,
              video.currentTime - 10
            );

        }

        showControls();

        break;

      case "ArrowRight":
      case "KeyL":

        event.preventDefault();

        if (!isLiveMode) {

          video.currentTime =
            Math.min(
              video.duration || 0,
              video.currentTime + 10
            );

        }

        showControls();

        break;

      case "ArrowUp":

        event.preventDefault();

        changeVolume(
          video.volume + .1
        );

        showControls();

        break;

      case "ArrowDown":

        event.preventDefault();

        changeVolume(
          video.volume - .1
        );

        showControls();

        break;

      case "KeyM":

        event.preventDefault();

        toggleMute();

        break;

      case "KeyF":

        event.preventDefault();

        toggleFullScreen();

        break;
    }

  }
);

   AUTO NEXT EPISODE
========================================================= */

video.addEventListener(
  "ended",
  () => {

    if (
      isLiveMode ||
      !currentPlayingMeta
    ) {

      return;
    }

    const currentItem =
      currentVodResults.find(
        item =>
          item.siteName ===
          currentActiveSiteName
      ) ||
      currentVodResults[0];

    if (!currentItem) {
      return;
    }

    const episodes =
      getEpisodesList(
        currentItem
      );

    if (
      episodes.length > 0 &&
      currentActiveEp <
      episodes.length - 1
    ) {

      const next =
        currentActiveEp + 1;

      setStatus(
        `🎉 本集播放完毕，即将播放第 ${next + 1} 集...`,
        true,
        "▶️"
      );

      setTimeout(
        () => {

          currentActiveEp =
            next;

          renderMoonTvStyleSources(
            currentVodResults
          );

          playCurrentVodSource(
            currentItem,
            next
          );

        },
        1000
      );

    }

  }
);

/* =========================================================
   SUBSCRIPTION PARSER
========================================================= */

function extractSitesFromAnyJson(
  parsed
) {

  const results = [];

  if (
    !parsed ||
    typeof parsed !== "object"
  ) {

    return results;

  }

  if (
    parsed.api_site &&
    typeof parsed.api_site ===
    "object"
  ) {

    for (
      const key in parsed.api_site
    ) {

      const item =
        parsed.api_site[key];

      if (
        item &&
        item.api
      ) {

        results.push({

          name:
            item.name ||
            key,

          api:
            normalizeUrl(
              item.api
            )

        });

      }

    }

  }

  let list = [];

  if (
    Array.isArray(parsed)
  ) {

    list = parsed;

  } else if (
    parsed.video &&
    Array.isArray(
      parsed.video.sites
    )
  ) {

    list =
      parsed.video.sites;

  } else if (
    Array.isArray(
      parsed.sites
    )
  ) {

    list =
      parsed.sites;

  }

  for (
    const item of list
  ) {

    if (
      !item ||
      typeof item !== "object"
    ) {

      continue;

    }

    const api =
      item.api ||
      item.url;

    if (
      typeof api !==
      "string"
    ) {

      continue;

    }

    const clean =
      normalizeUrl(api);

    if (
      !clean
    ) {

      continue;

    }

    results.push({

      name:
        item.name ||
        item.key ||
        "影视源",

      api:
        clean

    });

  }

  /* 去重 */

  const unique = [];

  const seen =
    new Set();

  for (
    const item of results
  ) {

    const key =
      `${item.name}|${item.api}`;

    if (
      seen.has(key)
    ) {

      continue;

    }

    seen.add(key);

    unique.push(item);

  }

  return unique;
}


function parseSubscriptionPayload(
  text
) {

  if (
    !text ||
    typeof text !==
    "string"
  ) {

    return [];

  }

  let raw =
    text.trim();

  try {

    return extractSitesFromAnyJson(
      JSON.parse(raw)
    );

  } catch (_) {}

  try {

    const decoded =
      decodeBase58(raw);

    if (
      decoded
    ) {

      const cleaned =
        decoded.replace(
          /\/\*[\s\S]*?\*\//g,
          ""
        );

      return extractSitesFromAnyJson(
        JSON.parse(cleaned)
      );

    }

  } catch (_) {}

  return [];

}


/* =========================================================
   FETCH WITH TIMEOUT
========================================================= */

async function fetchText(
  url,
  timeout = CONFIG.SEARCH_TIMEOUT
) {

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () =>
        controller.abort(),
      timeout
    );

  try {

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );

    if (
      !response.ok
    ) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    return await response.text();

  } finally {

    clearTimeout(
      timer
    );

  }
}


/*
  注意：
  这里保留了你的 CORS fallback。

  如果你自己的 Cloudflare Pages Function
  可以直接代理第三方源，建议以后把这里
  改成自己的 /api/proxy，而不是依赖公共
  CORS 服务。
*/

async function fetchWithTimeout(
  url,
  timeout = CONFIG.SEARCH_TIMEOUT
) {

  try {

    return await fetchText(
      url,
      timeout
    );

  } catch (_) {}

  try {

    return await fetchText(
      "https://api.allorigins.win/raw?url=" +
      encodeURIComponent(url),
      timeout
    );

  } catch (_) {}

  try {

    return await fetchText(
      "https://corsproxy.io/?" +
      encodeURIComponent(url),
      timeout
    );

  } catch (_) {}

  throw new Error(
    "请求超时"
  );
}


/* =========================================================
   SUBSCRIPTION SYNC
========================================================= */

async function syncSubscription(
  showAlert = false
) {

  const subUrl =
    await getD1Data(
      KEY_SUB,
      ""
    );

  if (
    !subUrl
  ) {

    if (showAlert) {

      alert(
        "还没有配置影视订阅地址。"
      );

    }

    return;

  }

  setStatus(
    "正在同步影视源...",
    true,
    "🔄"
  );

  try {

    let text =
      await fetchWithTimeout(
        subUrl,
        6000
      );

    let sites =
      parseSubscriptionPayload(
        text
      );

    if (
      sites.length === 0 &&
      subUrl.includes(
        "format=2"
      )
    ) {

      text =
        await fetchWithTimeout(
          subUrl.replace(
            "format=2",
            "format=1"
          ),
          6000
        );

      sites =
        parseSubscriptionPayload(
          text
        );

    }

    if (
      sites.length > 0
    ) {

      parsedSites =
        sites;

      await setD1Data(
        KEY_SITES,
        JSON.stringify(
          parsedSites
        )
      );

      setStatus(
        "",
        false
      );

      if (showAlert) {

        alert(
          `影视源同步成功，共 ${sites.length} 个接口。`
        );

      }

    } else {

      throw new Error(
        "没有解析到有效影视源"
      );

    }

  } catch (error) {

    setStatus(
      "影视订阅同步失败，正在使用缓存源。",
      true,
      "⚠️"
    );

    if (showAlert) {

      alert(
        "订阅同步失败。\n\n" +
        "如果之前已经同步过，程序会继续使用缓存源。"
      );

    }

    setTimeout(
      () =>
        setStatus(
          "",
          false
        ),
      2500
    );

  }

}

/* =========================================================
   CONCURRENCY POOL
========================================================= */

async function runPool(
  items,
  worker,
  concurrency
) {

  const results =
    new Array(
      items.length
    );

  let nextIndex = 0;

  async function runner() {

    while (true) {

      const index =
        nextIndex++;

      if (
        index >=
        items.length
      ) {

        return;

      }

      try {

        results[index] =
          await worker(
            items[index],
            index
          );

      } catch (_) {

        results[index] =
          null;

      }

    }

  }

  const runners =
    Array.from(
      {
        length:
          Math.min(
            concurrency,
            items.length
          )
      },
      runner
    );

  await Promise.all(
    runners
  );

  return results;

}


/* =========================================================
   VOD SEARCH
========================================================= */

async function fastStreamSearchVod(
  keyword
) {

  const searchToken =
    ++currentSearchToken;

  currentSearchStartedAt =
    performance.now();

  currentVodResults =
    [];

  currentActiveSiteName =
    "";

  currentActiveEp =
    0;

  channelList.innerHTML =
    `
    <div style="padding:24px;color:#888;text-align:center;">
      ⚡ 正在检索《${escapeHtml(keyword)}》...
      <br>
      <span style="font-size:11px;color:#555;">
        共 ${parsedSites.length} 个影视源
      </span>
    </div>
    `;

  if (
    parsedSites.length === 0
  ) {

    channelList.innerHTML =
      `
      <div style="padding:30px;color:#777;text-align:center;font-size:13px;">
        暂无影视源。
        <br><br>
        请点击「⚙️ 订阅配置」添加影视订阅地址。
      </div>
      `;

    return;

  }

  const querySites =
    parsedSites.slice(
      0
    );

  const results =
    await runPool(
      querySites,
      async site => {

        let apiUrl =
          normalizeUrl(
            site.api
          );

        if (!apiUrl) {
          return null;
        }

        if (
          !apiUrl.includes("?")
        ) {

          apiUrl += "?";

        } else if (
          !apiUrl.endsWith("?") &&
          !apiUrl.endsWith("&")
        ) {

          apiUrl += "&";

        }

        apiUrl +=
          "ac=videolist" +
          "&wd=" +
          encodeURIComponent(
            keyword
          );

        const start =
          performance.now();

        try {

          const text =
            await fetchWithTimeout(
              apiUrl,
              CONFIG.SEARCH_TIMEOUT
            );

          const latency =
            Math.round(
              performance.now() -
              start
            );

          const data =
            JSON.parse(text);

          if (
            !Array.isArray(
              data.list
            ) ||
            data.list.length === 0
          ) {

            return null;

          }

          const exact =
            data.list.find(
              item =>
                item.vod_name &&
                item.vod_name
                  .toLowerCase()
                  .includes(
                    keyword.toLowerCase()
                  )
            );

          const best =
            exact ||
            data.list[0];

          return {

            siteName:
              site.name,

            vod:
              best,

            ping:
              latency,

            status:
              "ok",

            matched:
              !!exact

          };

        } catch (_) {

          return null;

        }

      },
      CONFIG.MAX_SEARCH_CONCURRENCY
    );

  if (
    searchToken !==
    currentSearchToken
  ) {

    return;

  }

  currentVodResults =
    results.filter(
      Boolean
    );

  currentVodResults.sort(
    (a, b) => {

      if (
        a.matched !==
        b.matched
      ) {

        return a.matched
          ? -1
          : 1;

      }

      return a.ping -
        b.ping;

    }
  );

  const elapsed =
    Math.round(
      performance.now() -
      currentSearchStartedAt
    );

  if (
    currentVodResults.length ===
    0
  ) {

    channelList.innerHTML =
      `
      <div style="padding:30px;color:#777;text-align:center;font-size:13px;">
        未检索到《${escapeHtml(keyword)}》
        <br><br>
        <span style="font-size:11px;color:#555;">
          已检测 ${querySites.length} 个源，耗时 ${elapsed}ms
        </span>
      </div>
      `;

    return;

  }

  currentActiveSiteName =
    currentVodResults[0].siteName;

  currentActiveEp =
    0;

  renderMoonTvStyleSources(
    currentVodResults
  );

  /*
    首选最快且匹配的源
  */

  playCurrentVodSource(
    currentVodResults[0],
    0
  );

}

/* =========================================================
   EPISODES
========================================================= */

function getEpisodesList(
  item
) {

  if (
    !item ||
    !item.vod
  ) {

    return [];

  }

  const playUrlStr =
    item.vod.vod_play_url ||
    "";

  if (!playUrlStr) {
    return [];
  }

  const playGroups =
    playUrlStr.split(
      "$$$"
    );

  /*
    优先寻找 m3u8，
    没有就使用第一个播放组
  */

  const group =
    playGroups.find(
      value =>
        /m3u8/i.test(
          value
        )
    ) ||
    playGroups[0] ||
    "";

  const rawEpisodes =
    group
      .split("#")
      .filter(Boolean);

  return rawEpisodes.map(
    (episode, index) => {

      const separator =
        episode.indexOf("$");

      if (
        separator >= 0
      ) {

        return {

          name:
            episode
              .slice(
                0,
                separator
              )
              .trim() ||
            `第${index + 1}集`,

          url:
            episode
              .slice(
                separator + 1
              )
              .trim()

        };

      }

      return {

        name:
          `第${index + 1}集`,

        url:
          episode.trim()

      };

    }
  ).filter(
    item =>
      safeUrl(item.url)
  );

}


/* =========================================================
   PLAY VOD
========================================================= */

function playCurrentVodSource(
  item,
  episodeIndex = 0
) {

  if (
    !item ||
    !item.vod
  ) {

    return;

  }

  isLiveMode =
    false;

  const episodes =
    getEpisodesList(
      item
    );

  const target =
    episodes[
      episodeIndex
    ] ||
    episodes[0];

  if (!target) {

    setStatus(
      "当前源没有可播放地址。",
      true,
      "⚠️"
    );

    return;

  }

  let rawUrl =
    normalizeUrl(
      target.url
    );

  /*
    HTTPS 页面不允许 HTTP 混合内容。
    注意：这里不能保证远端 HTTP 源真的支持 HTTPS。
  */

  if (
    location.protocol ===
      "https:" &&
    rawUrl.startsWith(
      "http://"
    )
  ) {

    rawUrl =
      rawUrl.replace(
        /^http:\/\//i,
        "https://"
      );

  }

  currentVodUniqueKey =
    `${item.vod.vod_name}_${target.name}`;

  currentTitle.textContent =
    `${item.vod.vod_name} - ${target.name}`;

  routeBadge.style.display =
    "inline-block";

  routeBadge.textContent =
    item.siteName;

  currentStreamUrl =
    rawUrl;

  currentPlayingMeta = {

    title:
      item.vod.vod_name,

    epName:
      target.name,

    siteName:
      item.siteName,

    thumb:
      item.vod.vod_pic ||
      ""

  };

  lastSavedTime =
    0;

  updateFavIconState();

  manualPlayOnly(
    rawUrl
  );

}


/* =========================================================
   DESTROY PLAYER
========================================================= */

function destroyPlayer() {

  if (hls) {

    try {

      hls.destroy();

    } catch (_) {}

    hls =
      null;

  }

  try {

    video.pause();

  } catch (_) {}

  video.removeAttribute(
    "src"
  );

  try {

    video.load();

  } catch (_) {}

}


/* =========================================================
   PLAY URL
========================================================= */

async function manualPlayOnly(
  url
) {

  const loadToken =
    ++currentLoadToken;

  const cleanUrl =
    normalizeUrl(url);

  if (
    !safeUrl(cleanUrl)
  ) {

    setStatus(
      "当前播放地址无效。",
      true,
      "⚠️"
    );

    return;

  }

  destroyPlayer();

  setStatus(
    "正在建立连接...",
    true,
    "🔄"
  );

  updatePlayBtn(false);

  const isApple =
    /iPad|iPhone|iPod|Macintosh/i.test(
      navigator.userAgent
    ) &&
    !window.MSStream;

  /*
    Safari 原生 HLS
  */

  if (
    isApple &&
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src =
      cleanUrl;

    video.load();

    try {

      await video.play();

      if (
        loadToken !==
        currentLoadToken
      ) {

        return;

      }

      setStatus(
        "",
        false
      );

      updatePlayBtn(true);

      showControls();

      await restorePlaybackProgress();

    } catch (_) {

      setStatus(
        "请轻触画面或点击播放按钮起播",
        true,
        "▶️"
      );

    }

    return;
  }

  /*
    HLS.js
  */

  if (
    window.Hls &&
    Hls.isSupported() &&
    (
      isHlsUrl(cleanUrl) ||
      !isVideoUrl(cleanUrl)
    )
  ) {

    hls =
      new Hls({

        enableWorker:
          true,

        lowLatencyMode:
          isLiveMode,

        backBufferLength:
          CONFIG.HLS_BACK_BUFFER_LENGTH,

        maxBufferLength:
          CONFIG.HLS_MAX_BUFFER_LENGTH,

        maxMaxBufferLength:
          60,

        manifestLoadingMaxRetry:
          2,

        levelLoadingMaxRetry:
          2,

        fragLoadingMaxRetry:
          2,

        xhrSetup:
          xhr => {

            xhr.withCredentials =
              false;

          }

      });

    hls.loadSource(
      cleanUrl
    );

    hls.attachMedia(
      video
    );

    hls.on(
      Hls.Events.MANIFEST_PARSED,
      async () => {

        if (
          loadToken !==
          currentLoadToken
        ) {

          return;

        }

        try {

          await video.play();

          setStatus(
            "",
            false
          );

          updatePlayBtn(true);

          showControls();

          await restorePlaybackProgress();

        } catch (_) {

          setStatus(
            "请轻触画面开始播放",
            true,
            "▶️"
          );

        }

      }
    );

    hls.on(
      Hls.Events.ERROR,
      (
        event,
        data
      ) => {

        if (
          loadToken !==
          currentLoadToken
        ) {

          return;

        }

        if (
          data.fatal
        ) {

          switch (
            data.type
          ) {

            case Hls.ErrorTypes.NETWORK_ERROR:

              setStatus(
                "网络错误，正在尝试恢复...",
                true,
                "🔄"
              );

              try {

                hls.startLoad();

              } catch (_) {

                showFailTip();

              }

              break;

            case Hls.ErrorTypes.MEDIA_ERROR:

              setStatus(
                "媒体解码错误，正在恢复...",
                true,
                "🔄"
              );

              try {

                hls.recoverMediaError();

              } catch (_) {

                showFailTip();

              }

              break;

            default:

              showFailTip();

              break;

          }

        }

      }
    );

    return;
  }

  /*
    普通 HTML5 视频
  */

  video.src =
    cleanUrl;

  video.load();

  try {

    await video.play();

    setStatus(
      "",
      false
    );

    updatePlayBtn(true);

    showControls();

    await restorePlaybackProgress();

  } catch (_) {

    setStatus(
      "请点击播放按钮开始播放",
      true,
      "▶️"
    );

  }

}


/* =========================================================
   FAILURE
========================================================= */

function showFailTip() {

  setStatus(
    `
    当前线路播放失败
    <br>
    <span style="color:#aaa;font-size:12px;">
      可以尝试其他换源线路，或使用下方外部播放器
    </span>
    `,
    true,
    "⚠️"
  );

  updatePlayBtn(false);

}


/* =========================================================
   TV M3U
========================================================= */

async function initTv() {

  const targetUrl =
    await getD1Data(
      KEY_M3U,
      ""
    );

  if (
    !targetUrl
  ) {

    groups =
      {};

    if (
      currentMode ===
      "tv"
    ) {

      renderList(
        groups,
        false
      );

    }

    return;

  }

  try {

    setStatus(
      "正在同步电视直播源...",
      true,
      "📺"
    );

    const text =
      await fetchWithTimeout(
        targetUrl,
        6000
      );

    parseM3U(
      text
    );

    setStatus(
      "",
      false
    );

    if (
      currentMode ===
      "tv" &&
      currentView ===
      "normal"
    ) {

      renderList(
        groups,
        false
      );

    }

  } catch (_) {

    groups =
      {};

    if (
      currentMode ===
      "tv"
    ) {

      renderList(
        groups,
        false
      );

    }

    setStatus(
      "",
      false
    );

  }

}


/* =========================================================
   M3U PARSER
========================================================= */

function parseM3U(
  content
) {

  groups =
    {};

  if (
    !content ||
    typeof content !==
    "string"
  ) {

    return;

  }

  const lines =
    content
      .replace(
        /^\uFEFF/,
        ""
      )
      .split(/\r?\n/);

  let temp = null;

  for (
    let line of lines
  ) {

    line =
      line.trim();

    if (
      !line
    ) {

      continue;

    }

    if (
      line.startsWith(
        "#EXTINF:"
      )
    ) {

      const commaIndex =
        line.indexOf(",");

      let name =
        commaIndex >= 0
          ? line
              .slice(
                commaIndex + 1
              )
              .trim()
          : "未命名频道";

      const groupMatch =
        line.match(
          /group-title\s*=\s*"([^"]*)"/i
        );

      const tvgNameMatch =
        line.match(
          /tvg-name\s*=\s*"([^"]*)"/i
        );

      if (
        tvgNameMatch &&
        tvgNameMatch[1]
      ) {

        name =
          tvgNameMatch[1].trim();

      }

      const group =
        (
          groupMatch &&
          groupMatch[1]
        )
          ? groupMatch[1].trim()
          : "常规频道";

      temp = {

        name:
          name ||
          "未命名频道",

        group:
          group ||
          "常规频道"

      };

    } else if (
      line &&
      !line.startsWith("#") &&
      temp
    ) {

      const url =
        normalizeUrl(
          line
        );

      if (
        !safeUrl(url)
      ) {

        temp = null;

        continue;

      }

      if (
        !groups[temp.group]
      ) {

        groups[temp.group] =
          {};

      }

      if (
        !groups[temp.group][
          temp.name
        ]
      ) {

        groups[temp.group][
          temp.name
        ] = [];

      }

      if (
        !groups[temp.group][
          temp.name
        ].includes(url)
      ) {

        groups[temp.group][
          temp.name
        ].push(url);

      }

      temp = null;

    }

  }

}


/* =========================================================
   TV RENDER
========================================================= */

function renderList(
  targetGroups,
  isSearchMode = false
) {

  channelList.innerHTML =
    "";

  const groupNames =
    Object.keys(
      targetGroups || {}
    );

  if (
    groupNames.length ===
    0
  ) {

    channelList.innerHTML =
      `
      <div style="padding:40px 16px;color:#777;text-align:center;font-size:13px;">
        暂无电视直播源
        <br><br>
        <span style="font-size:11px;color:#555;">
          请点击「订阅配置」添加 M3U 地址
        </span>
      </div>
      `;

    return;

  }

  for (
    const groupName of groupNames
  ) {

    const channels =
      targetGroups[
        groupName
      ];

    if (
      !channels ||
      Object.keys(
        channels
      ).length === 0
    ) {

      continue;

    }

    const groupEl =
      document.createElement(
        "div"
      );

    groupEl.className =
      "group-header";

    groupEl.innerHTML =
      `
      <span>
        ${escapeHtml(groupName)}
      </span>

      <span>
        ${isSearchMode
          ? "▼"
          : "▶"}
      </span>
      `;

    const subList =
      document.createElement(
        "div"
      );

    subList.className =
      "group-channels";

    subList.style.display =
      isSearchMode
        ? "block"
        : "none";

    groupEl.onclick =
      () => {

        const hidden =
          subList.style.display ===
          "none";

        subList.style.display =
          hidden
            ? "block"
            : "none";

        groupEl.querySelector(
          "span:last-child"
        ).textContent =
          hidden
            ? "▼"
            : "▶";

      };

    for (
      const channelName in channels
    ) {

      const urls =
        channels[
          channelName
        ];

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "channel-row";

      const panel =
        document.createElement(
          "div"
        );

      panel.className =
        "sources-panel";

      urls.forEach(
        (url, index) => {

          const source =
            document.createElement(
              "div"
            );

          source.className =
            "source-item";

          source.innerHTML =
            `
            <span>
              线路 ${index + 1}
            </span>

            <span
              style="color:#666;font-size:10px;"
            >
              ${isHlsUrl(url)
                ? "HLS"
                : "视频"}
            </span>
            `;

          source.onclick =
            event => {

              event.stopPropagation();

              isLiveMode =
                true;

              currentVodUniqueKey =
                "";

              document
                .querySelectorAll(
                  ".source-item.active-source"
                )
                .forEach(
                  element =>
                    element.classList.remove(
                      "active-source"
                    )
                );

              source.classList.add(
                "active-source"
              );

              document
                .querySelectorAll(
                  ".channel-row.playing"
                )
                .forEach(
                  element =>
                    element.classList.remove(
                      "playing"
                    )
                );

              row.classList.add(
                "playing"
              );

              currentTitle.textContent =
                channelName;

              routeBadge.style.display =
                "inline-block";

              routeBadge.textContent =
                `线 ${index + 1}`;

              currentStreamUrl =
                url;

              currentPlayingMeta = {

                title:
                  channelName,

                siteName:
                  `线路 ${index + 1}`,

                thumb:
                  ""

              };

              updateFavIconState();

              manualPlayOnly(
                url
              );

            };

          panel.appendChild(
            source
          );

        }
      );

      const main =
        document.createElement(
          "div"
        );

      main.className =
        "channel-main";

      main.innerHTML =
        `
        <div class="channel-title">

          <span class="channel-arrow">
            ▶
          </span>

          <span>
            ${escapeHtml(
              channelName
            )}
          </span>

        </div>

        <div>
          <span class="badge-lines">
            ${urls.length} 路
          </span>
        </div>
        `;

      main.onclick =
        () => {

          const expanded =
            row.classList.contains(
              "expanded"
            );

          document
            .querySelectorAll(
              ".channel-row.expanded"
            )
            .forEach(
              element => {

                if (
                  element !== row
                ) {

                  element.classList.remove(
                    "expanded"
                  );

                }

              }
            );

          if (!expanded) {

            row.classList.add(
              "expanded"
            );

            const first =
              panel.querySelector(
                ".source-item"
              );

            if (first) {

              first.click();

            }

          } else {

            row.classList.remove(
              "expanded"
            );

          }

        };

      row.appendChild(
        main
      );

      row.appendChild(
        panel
      );

      subList.appendChild(
        row
      );

    }

    channelList.appendChild(
      groupEl
    );

    channelList.appendChild(
      subList
    );

  }

}


/* =========================================================
   TV SEARCH
========================================================= */

function handleSearchTv() {

  const keyword =
    filterInput.value
      .trim()
      .toLowerCase();

  if (
    !keyword
  ) {

    renderList(
      groups,
      false
    );

    return;

  }

  const filtered =
    {};

  for (
    const groupName in groups
  ) {

    for (
      const channelName in
      groups[groupName]
    ) {

      if (
        channelName
          .toLowerCase()
          .includes(keyword) ||
        groupName
          .toLowerCase()
          .includes(keyword)
      ) {

        if (
          !filtered[groupName]
        ) {

          filtered[groupName] =
            {};

        }

        filtered[groupName][
          channelName
        ] =
          groups[groupName][
            channelName
          ];

      }

    }

  }

  renderList(
    filtered,
    true
  );

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function loadCachedSites() {

  const cached =
    await getD1Data(
      KEY_SITES,
      ""
    );

  if (!cached) {
    return;
  }

  try {

    const parsed =
      typeof cached ===
      "object"
        ? cached
        : JSON.parse(cached);

    if (
      Array.isArray(parsed)
    ) {

      parsedSites =
        parsed.filter(
          item =>
            item &&
            item.api
        );

    }

  } catch (_) {}

}


async function init() {

  try {

    await loadCachedSites();

    /*
      先显示缓存数据，
      不让用户等待 D1 / 网络。
    */

    switchMode(
      "vod"
    );

    /*
      后台同步
    */

    initTv();

    syncSubscription(
      false
    );

  } catch (_) {

    switchMode(
      "vod"
    );

  }

}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      /*
        不主动停止视频，
        让手机系统自行决定。
      */

      return;

    }

    if (
      video.src &&
      !video.paused
    ) {

      showControls();

    }

  }
);


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    /*
      最后一笔进度尝试写入本地。
      D1 异步请求不保证浏览器关闭前完成。
    */

    if (
      !isLiveMode &&
      currentPlayingMeta &&
      video.duration &&
      video.currentTime > 2
    ) {

      try {

        const raw =
          localStorage.getItem(
            KEY_HISTORY
          );

        let history =
          raw
            ? JSON.parse(raw)
            : [];

        const record = {

          key:
            currentVodUniqueKey,

          title:
            currentPlayingMeta.title,

          epName:
            currentPlayingMeta.epName ||
            "正片",

          url:
            currentStreamUrl,

          time:
            Math.floor(
              video.currentTime
            ),

          duration:
            Math.floor(
              video.duration
            ),

          siteName:
            currentPlayingMeta.siteName ||
            "",

          thumb:
            currentPlayingMeta.thumb ||
            "",

          updatedAt:
            new Date().toLocaleString()

        };

        history =
          history.filter(
            item =>
              item.key !==
              record.key
          );

        history.unshift(
          record
        );

        history =
          history.slice(
            0,
            CONFIG.MAX_HISTORY
          );

        localStorage.setItem(
          KEY_HISTORY,
          JSON.stringify(history)
        );

      } catch (_) {}

    }

  }
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
