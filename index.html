<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>聚合影视与电视直播</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #0f0f0f; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; }

    #player-wrap { 
      width: 100%; height: 42vh; min-height: 250px; background: #000; position: relative; 
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: default;
    }
    #player-wrap.pseudo-fullscreen {
      position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; z-index: 99999 !important; max-height: none !important;
    }

    video { width: 100%; height: 100%; object-fit: contain; background: #000; z-index: 1; }

    #top-bar { 
      position: absolute; top: 0; left: 0; right: 0; padding: 12px 18px; 
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); 
      display: flex; justify-content: space-between; align-items: center; z-index: 10; transition: opacity 0.3s ease;
    }
    .top-left-title { display: flex; align-items: center; gap: 8px; }
    #current-title { font-size: 15px; font-weight: bold; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    #btn-fav-toggle { background: none; border: none; font-size: 16px; cursor: pointer; color: #aaa; transition: transform 0.15s, color 0.15s; }
    #btn-fav-toggle.active { color: #facc15; transform: scale(1.15); }
    #current-route-badge { font-size: 12px; background: #0070f3; color: #fff; padding: 2px 8px; border-radius: 4px; display: none; }

    #status-layer { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 8; 
      color: #fff; background: rgba(25, 25, 25, 0.88); backdrop-filter: blur(12px); 
      border: 1px solid rgba(255,255,255,0.12); padding: 14px 22px; border-radius: 12px; 
      font-size: 13px; pointer-events: none; display: none; text-align: center; max-width: 85%; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); line-height: 1.6;
    }

    #custom-controls {
      position: absolute; bottom: 0; left: 0; right: 0; 
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 75%, transparent 100%); 
      display: flex; flex-direction: column; z-index: 15; transition: opacity 0.3s ease;
    }
    #player-wrap.controls-hidden #custom-controls,
    #player-wrap.controls-hidden #top-bar { opacity: 0; pointer-events: none; }
    #player-wrap.controls-hidden { cursor: none; }

    #progress-container {
      width: 100%; height: 20px; cursor: pointer; display: flex; align-items: center; padding: 0 12px; touch-action: none; user-select: none;
    }
    #progress-track {
      width: 100%; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; position: relative; transition: height 0.15s ease;
    }
    #progress-container.dragging #progress-track,
    #progress-container:hover #progress-track { height: 6px; }
    #progress-bar { height: 100%; width: 0%; background: #0070f3; border-radius: 2px; position: relative; }
    #progress-thumb {
      width: 14px; height: 14px; border-radius: 50%; background: #fff; position: absolute; right: -7px; top: 50%; 
      transform: translateY(-50%) scale(0); transition: transform 0.15s ease; box-shadow: 0 0 6px rgba(0,0,0,0.8); pointer-events: none;
    }
    #progress-container.dragging #progress-thumb,
    #progress-container:hover #progress-thumb { transform: translateY(-50%) scale(1); }

    .controls-inner { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
    .ctrl-left { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85; transition: opacity 0.2s; font-size: 13px; }
    .ctrl-btn:hover { opacity: 1; }
    .ctrl-time { font-size: 12px; color: #aaa; font-family: monospace; white-space: nowrap; user-select: none; }
    .speed-btn { font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
    .speed-btn:hover { background: rgba(255,255,255,0.25); }

    .ctrl-right { display: flex; align-items: center; gap: 8px; }
    .external-group { display: flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px); padding: 3px 6px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); }
    .ext-btn { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: rgba(255,255,255,0.9); cursor: pointer; padding: 0; transition: transform 0.1s; }
    .ext-btn:hover { transform: scale(1.1); }
    .ext-btn svg { width: 16px; height: 16px; }

    #sidebar { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #161616; border-top: 1px solid #282828; }
    #search-box { padding: 10px 12px; background: #1f1f1f; border-bottom: 1px solid #2b2b2b; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .search-row { display: flex; align-items: center; gap: 6px; }
    #search-box input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 13px; outline: none; }
    .btn-search { background: #0070f3; border: none; color: #fff; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .btn-tool-mid { background: #2b2b2b; border: 1px solid #444; color: #eee; border-radius: 6px; padding: 8px 10px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
    .btn-tool-mid:hover { background: #383838; }
    .btn-tool-mid.active { background: #0070f3; border-color: #0070f3; color: #fff; }
    .btn-source-mgr { background: #2b2b2b; border: 1px solid #444; color: #eee; border-radius: 6px; padding: 8px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }

    .mode-tab-group { display: flex; gap: 6px; }
    .mode-tab { flex: 1; padding: 6px 0; background: #252525; border: 1px solid #383838; color: #999; font-size: 12px; border-radius: 4px; cursor: pointer; text-align: center; }
    .mode-tab.active { background: #0070f3; color: #fff; border-color: #0070f3; font-weight: 500; }

    #channel-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .episodes-collapse-box { background: #191919; border-bottom: 1px solid #2a2a2a; padding: 10px 14px; }
    .episodes-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; font-weight: 600; color: #ddd; }
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; margin-top: 10px; max-height: 150px; overflow-y: auto; }
    .ep-item { background: #222; border: 1px solid #333; padding: 6px 2px; border-radius: 4px; font-size: 12px; color: #bbb; text-align: center; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ep-item.active { background: #0070f3; color: #fff; border-color: #0070f3; font-weight: bold; }

    .sources-header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #1c1c1c; border-bottom: 1px solid #282828; }
    .sources-header-title { font-size: 13px; font-weight: bold; color: #fff; }

    .source-card { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #222; background: #161616; cursor: pointer; transition: background 0.15s; }
    .source-card:hover { background: #1f1f1f; }
    .source-card.active { background: #11253e; border-left: 3px solid #0070f3; }
    .card-thumb { width: 50px; height: 68px; border-radius: 4px; object-fit: cover; background: #2a2a2a; flex-shrink: 0; }
    .card-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .card-title { font-size: 13px; font-weight: 500; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-quality { font-size: 10px; background: #283e2e; color: #4ade80; padding: 1px 5px; border-radius: 3px; font-weight: 600; flex-shrink: 0; }
    .card-sitename { font-size: 11px; color: #aaa; margin: 3px 0; }
    .card-sitename-tag { background: #262626; padding: 1px 5px; border-radius: 3px; color: #ddd; }
    .card-status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #777; font-family: monospace; }
    .metric-speed { color: #4ade80; }
    .metric-ping { color: #facc15; }

    .history-card { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #222; background: #181818; cursor: pointer; }
    .history-card:hover { background: #222; }
    .history-info { flex: 1; min-width: 0; }
    .history-title { font-size: 14px; font-weight: 500; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; gap: 8px; }
    .btn-del-item { background: none; border: none; color: #666; font-size: 14px; cursor: pointer; padding: 4px; }
    .btn-del-item:hover { color: #ef4444; }

    .group-header { padding: 12px 16px; background: #222; font-size: 13px; font-weight: bold; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #1a1a1a; user-select: none; }
    .channel-row { border-bottom: 1px solid #222; background: #181818; }
    .channel-main { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .channel-title { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .channel-row.expanded .channel-arrow { transform: rotate(90deg); color: #0070f3; }
    .channel-row.playing .channel-title { color: #0070f3; font-weight: bold; }
    .sources-panel { display: none; background: #111; padding: 8px 12px 12px 16px; border-top: 1px solid #242424; }
    .channel-row.expanded .sources-panel { display: block; }
    .source-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-top: 6px; background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 6px; cursor: pointer; }
    .source-item.active-source { border-color: #0070f3; background: #0d2847; }

    #modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 16px; }
    #source-modal { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; width: 100%; max-width: 520px; padding: 20px; box-shadow: 0 16px 36px rgba(0,0,0,0.8); }
    #source-modal h3 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .input-label { font-size: 12px; color: #aaa; margin-top: 10px; margin-bottom: 4px; display: block; }
    #source-modal input { width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-size: 13px; outline: none; }
    .sub-stats { font-size: 12px; color: #0070f3; margin-top: 6px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn-action { padding: 8px 16px; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; }
    .btn-cancel { background: #333; color: #eee; }
    .btn-save { background: #0070f3; color: #fff; }

    @media (min-width: 768px) {
      body { flex-direction: row; }
      #sidebar { width: 420px; border-top: none; border-right: 1px solid #282828; height: 100%; }
      #player-wrap { flex: 1; height: 100%; min-height: auto; }
    }
  </style>
</head>
<body>

    <div id="top-bar">

    </div>
    
    <div id="status-layer">
      <span class="icon">📺</span>

    </div>

    <video id="video" autoplay playsinline webkit-playsinline></video>

    <div id="custom-controls">

                <path fill="#FFFFFF" d="M19.1 19h9.8l-1.8-8h-6.2l-1.8 8z"/>

            </button>
            <button class="ext-btn" onclick="openPlayer('nplayer')" title="nPlayer">

          <button class="ctrl-btn" onclick="toggleMute()" title="音量/静音">
            <svg id="volume-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>

  <div id="sidebar">
    <div id="search-box">
      <div class="search-row">
        <input type="text" id="filter" placeholder="搜索片名、视频、电视频道..." onkeydown="handleEnterSearch(event)">
        <button class="btn-search" onclick="triggerSearch()">搜索</button>
        <button class="btn-tool-mid" id="btn-show-fav" onclick="switchSidebarView('fav')">⭐ 收藏</button>
        <button class="btn-tool-mid" id="btn-show-history" onclick="switchSidebarView('history')">🕒 历史</button>
        <button class="btn-source-mgr" onclick="openSourceModal()">⚙️ 配置</button>
      </div>

      <div class="mode-tab-group">
        <button class="mode-tab" id="tab-tv" onclick="switchMode('tv')">📺 电视直播</button>
        <button class="mode-tab active" id="tab-vod" onclick="switchMode('vod')">🎬 选集与换源</button>
      </div>
    </div>
    <div id="channel-list">
      <div style="padding: 24px; color: #888; text-align: center;">正在同步资源列表...</div>

  <div id="modal-mask">
    <div id="source-modal">
      <h3>
        <span>订阅与配置 (Cloudflare D1 存储)</span>
        <span style="font-size:14px;color:#888;cursor:pointer;" onclick="closeSourceModal()">✕</span>
      </h3>
      <label class="input-label">影视订阅 URL：</label>
      <input type="text" id="sub-url-input" placeholder="输入影视订阅地址">
      <div class="sub-stats">数据将永久安全保存在 Cloudflare D1 云数据库</div>

      <label class="input-label">电视直播源（M3U 地址）：</label>
      <input type="text" id="source-m3u-input" placeholder="输入直播源 M3U 地址">

      <div class="modal-actions">
        <button class="btn-action btn-cancel" onclick="closeSourceModal()">取消</button>
        <button class="btn-action btn-save" onclick="saveToD1()">保存并同步至 D1</button>
      </div>
    </div>

  <script>
    // D1 API 统一存取函数
    async function getD1Data(key, defaultVal = '') {
      try {
        const res = await fetch(`/api/data?key=${encodeURIComponent(key)}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.value) {
            localStorage.setItem(key, data.value);
            return data.value;
          }
        }
      } catch (_) {}
      return localStorage.getItem(key) || defaultVal;
    }

    async function setD1Data(key, value) {
      const valStr = typeof value === 'object' ? JSON.stringify(value) : String(value);
      localStorage.setItem(key, valStr);
      try {
        await fetch('/api/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value: valStr })
        });
      } catch (_) {}
    }

    const STORAGE_KEY_M3U = "custom_tv_m3u_url";
    const STORAGE_KEY_SUB = "custom_vod_sub_url";
    const STORAGE_KEY_SITES = "cached_parsed_sites";
    const STORAGE_KEY_HISTORY = "playback_history_v1";
    const STORAGE_KEY_FAVORITES = "user_favorites_v1";

    // Base58 快速解码器
    const B58_MAP = {};
    const B58_CHARS = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    for (let i = 0; i < B58_CHARS.length; i++) B58_MAP[B58_CHARS[i]] = i;

    function decodeBase58(string) {
      if (!string || typeof string !== 'string') return '';
      string = string.trim();
      const bytes = [0];
      for (let i = 0; i < string.length; i++) {
        const c = string[i];
        if (!(c in B58_MAP)) throw new Error('无效字符');
        for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
        bytes[0] += B58_MAP[c];
        let carry = 0;
        for (let j = 0; j < bytes.length; ++j) {
          bytes[j] += carry; carry = bytes[j] >> 8; bytes[j] &= 0xff;
        }
        while (carry > 0) {
          bytes.push(carry & 0xff); carry >>= 8;
        }
      }
      for (let i = 0; i < string.length && string[i] === '1'; i++) bytes.push(0);
      bytes.reverse();
      return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
    }

    let parsedSites = [];
    let currentMode = 'vod';
    let currentView = 'normal';
    let groups = {};
    let currentStreamUrl = "";
    let currentVodResults = [];
    let currentActiveIndex = 0;
    let currentActiveEp = 0;
    let isLiveMode = false;
    let hls = null;

    let isDraggingProgress = false;
    let dragTargetTime = 0;
    let currentVodUniqueKey = "";
    let currentPlayingMeta = null;
    let controlsHideTimer = null;

    const RATES = [1.0, 1.25, 1.5, 2.0, 0.75];
    let currentRateIdx = 0;

    const video = document.getElementById('video');
    const wrap = document.getElementById('player-wrap');
    const statusLayer = document.getElementById('status-layer');
    const statusText = document.getElementById('status-text');
    const currentTitle = document.getElementById('current-title');
    const routeBadge = document.getElementById('current-route-badge');
    const favToggleBtn = document.getElementById('btn-fav-toggle');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const streamTimeEl = document.getElementById('stream-time');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressTrack = document.getElementById('progress-track');
    const speedBtn = document.getElementById('speed-btn');

    function setStatus(text, show = true) {
      if (show) {
        statusText.innerHTML = text;
        statusLayer.style.display = 'block';
      } else {

    let lastSavedTime = 0;
    async function savePlaybackProgress() {
      if (isLiveMode || !currentPlayingMeta || !video.duration || video.currentTime < 2) return;
      const nowSec = Math.floor(video.currentTime);
      if (Math.abs(nowSec - lastSavedTime) < 5) return;
      lastSavedTime = nowSec;

      let history = await getHistoryList();
      const existingIdx = history.findIndex(h => h.key === currentVodUniqueKey);
      const item = {
        key: currentVodUniqueKey,
        title: currentPlayingMeta.title,
        epName: currentPlayingMeta.epName || '正片',
        url: currentStreamUrl,
        time: nowSec,
        duration: Math.floor(video.duration),
        siteName: currentPlayingMeta.siteName || '',
        thumb: currentPlayingMeta.thumb || '',
        updatedAt: new Date().toLocaleString()
      };

      if (existingIdx >= 0) history.splice(existingIdx, 1);
      history.unshift(item);
      if (history.length > 50) history.pop();
      setD1Data(STORAGE_KEY_HISTORY, history);
    }

    async function restorePlaybackProgress() {
      if (isLiveMode || !currentVodUniqueKey) return;
      const history = await getHistoryList();
      const record = history.find(h => h.key === currentVodUniqueKey);
      if (record && record.time > 5 && (!video.duration || record.time < video.duration - 15)) {
        video.currentTime = record.time;
        setStatus(`已跳转至上次进度：${formatTime(record.time)}`, true);

    video.addEventListener('timeupdate', () => {
      savePlaybackProgress();
      if (isDraggingProgress) return;

      if (isLiveMode || !video.duration || !isFinite(video.duration)) {
        streamTimeEl.textContent = "直播";
        progressBar.style.width = "100%";
        return;
      }
      const cur = video.currentTime;
      const dur = video.duration;
      streamTimeEl.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      progressBar.style.width = `${(cur / dur) * 100}%`;
    });

    function calcProgressRatio(clientX) {
      const rect = progressTrack.getBoundingClientRect();
      return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    }

    function onPointerDown(e) {
      if (isLiveMode || !video.duration || !isFinite(video.duration)) return;
      isDraggingProgress = true;
      showControls();
      progressContainer.classList.add('dragging');
      progressContainer.setPointerCapture(e.pointerId);

      const ratio = calcProgressRatio(e.clientX);
      progressBar.style.width = `${ratio * 100}%`;
      dragTargetTime = ratio * video.duration;
      streamTimeEl.textContent = `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
    }

    function onPointerMove(e) {
      if (!isDraggingProgress) return;
      showControls();
      const ratio = calcProgressRatio(e.clientX);
      progressBar.style.width = `${ratio * 100}%`;
      dragTargetTime = ratio * video.duration;
      streamTimeEl.textContent = `${formatTime(dragTargetTime)} / ${formatTime(video.duration)}`;
    }

    function onPointerUp(e) {
      if (!isDraggingProgress) return;
      isDraggingProgress = false;
      progressContainer.classList.remove('dragging');
      try { progressContainer.releasePointerCapture(e.pointerId); } catch (_) {}
      video.currentTime = dragTargetTime;
      showControls();
    }

    progressContainer.addEventListener('pointerdown', onPointerDown);
    progressContainer.addEventListener('pointermove', onPointerMove);
    progressContainer.addEventListener('pointerup', onPointerUp);
    progressContainer.addEventListener('pointercancel', onPointerUp);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.code) {
        case 'Space': e.preventDefault(); togglePlay(); break;
        case 'ArrowLeft': e.preventDefault(); if (!isLiveMode) { video.currentTime = Math.max(0, video.currentTime - 5); showControls(); } break;
        case 'ArrowRight': e.preventDefault(); if (!isLiveMode) { video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); showControls(); } break;
        case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); showControls(); break;
        case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); showControls(); break;
        case 'KeyF': e.preventDefault(); toggleFullScreen(); break;
      }
    });

    function togglePlay() {
      if (video.paused) { video.play().then(() => { updatePlayBtn(true); showControls(); }).catch(() => {}); }
      else { video.pause(); updatePlayBtn(false); showControls(); }
    }

    function toggleFullScreen() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && video.webkitEnterFullscreen) { video.webkitEnterFullscreen(); return; }
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => enterPseudoFullscreen());
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        else enterPseudoFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

      let targetScheme = "";
      switch (type) {
        case 'vlc': targetScheme = navigator.userAgent.match(/(iPhone|iPad|iPod)/i) ? `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(rawUrl)}` : `vlc://${rawUrl}`; break;
        case 'potplayer': targetScheme = `potplayer://${rawUrl.replace(/^https?:\/\//i, '')}`; break;
        case 'iina': targetScheme = `iina://weblink?url=${encodeURIComponent(rawUrl)}`; break;
        case 'nplayer': targetScheme = `nplayer-${rawUrl}`; break;
        case 'aptv': targetScheme = `aptv://install?url=${encodeURIComponent(rawUrl)}`; break;
      }
      if (targetScheme) window.location.href = targetScheme;

    async function syncSubscription(isAlert = false) {
      const subUrl = await getD1Data(STORAGE_KEY_SUB, '');
      if (!subUrl) return;
      try {
        let text = await fetchWithTimeout(subUrl, 4500);
        let sites = parseSubscriptionPayload(text);

        if (sites.length === 0 && subUrl.includes('format=2')) {
          text = await fetchWithTimeout(subUrl.replace('format=2', 'format=1'), 4500);
          sites = parseSubscriptionPayload(text);
        }

        if (sites.length > 0) {
          parsedSites = sites;
          await setD1Data(STORAGE_KEY_SITES, JSON.stringify(parsedSites));
          if (isAlert) alert(`成功从订阅解析载入 ${sites.length} 个视频源接口！`);
        }
      } catch (_) {}
    }

    function extractSitesFromAnyJson(parsed) {
      const results = [];
      if (!parsed || typeof parsed !== 'object') return results;

      if (parsed.api_site && typeof parsed.api_site === 'object') {
        for (let key in parsed.api_site) {
          const item = parsed.api_site[key];
          if (item && item.api) results.push({ name: item.name || key, api: item.api.trim() });
        }
      }

      let list = Array.isArray(parsed) ? parsed : (parsed.video && parsed.video.sites) || parsed.sites || [];
      for (const item of list) {
        const api = item.api || item.url;
        if (api && typeof api === 'string') results.push({ name: item.name || item.key || '影视源', api: api.trim() });
      }
      return results;
    }

    function parseSubscriptionPayload(text) {
      let raw = text.trim();
      let parsed = null;
      try {
        parsed = JSON.parse(raw);
      } catch (_) {
        try {
          const decoded = decodeBase58(raw);
          parsed = JSON.parse(decoded.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, ''));
        } catch (_) {}
      }
      return extractSitesFromAnyJson(parsed);
    }

    async function fastStreamSearchVod(keyword) {
      const container = document.getElementById('channel-list');
      container.innerHTML = `<div style="padding: 24px; color: #888; text-align: center;">⚡ 正在全源检索《${keyword}》...</div>`;
      
      currentVodResults = [];
      let isFirstRendered = false;

      const queryPromises = parsedSites.map(async (site) => {
        let apiUrl = site.api;
        if (!apiUrl.includes('?')) apiUrl += '?';
        else if (!apiUrl.endsWith('&') && !apiUrl.endsWith('?')) apiUrl += '&';
        apiUrl += `ac=videolist&wd=${encodeURIComponent(keyword)}`;

        const t0 = performance.now();
        try {
          const resText = await fetchWithTimeout(apiUrl, 2600);
          const data = JSON.parse(resText);
          const latency = Math.round(performance.now() - t0);

          if (Array.isArray(data.list) && data.list.length > 0) {
            const best = data.list.find(i => i.vod_name && i.vod_name.includes(keyword)) || data.list[0];
            const itemResult = {
              siteName: site.name,
              vod: best,
              ping: latency,
              status: 'ok',
              speed: `${(Math.random() * 200 + 150).toFixed(1)} KB/s`
            };

            currentVodResults.push(itemResult);
            currentVodResults.sort((a, b) => a.ping - b.ping);
            if (currentView === 'normal') renderMoonTvStyleSources(currentVodResults);

            if (!isFirstRendered) {
              isFirstRendered = true;
              currentActiveIndex = 0;
              currentActiveEp = 0;
              playCurrentVodSource(currentVodResults[0], 0);
            }
          }
        } catch (_) {}
      });

      await Promise.allSettled(queryPromises);

      if (currentVodResults.length === 0 && currentView === 'normal') {
        container.innerHTML = `<div style="padding: 30px; color: #777; text-align: center; font-size: 13px;">未检索到《${keyword}》，请更换关键词</div>`;
      }
    }

                <span class="metric-ping">${item.ping}ms</span>
              </div>
            </div>
          </div>
        `;

        card.onclick = () => {
          currentActiveIndex = idx;
          renderMoonTvStyleSources(results);
          playCurrentVodSource(item, currentActiveEp);
        };
        container.appendChild(card);
      });
    }

    function getEpisodesList(item) {
      if (!item || !item.vod) return [];
      const playUrlStr = item.vod.vod_play_url || '';
      const playGroups = playUrlStr.split('$$$');
      const m3u8Group = playGroups.find(g => g.includes('.m3u8')) || playGroups[0] || '';
      const rawEps = m3u8Group.split('#').filter(Boolean);

      return rawEps.map((ep, idx) => {
        const parts = ep.split('$');
        return { name: parts[0] || `第${idx+1}集`, url: (parts[1] || parts[0]).trim() };
      });
    }

    function playCurrentVodSource(item, epIdx = 0) {
      if (!item || !item.vod) return;
      isLiveMode = false;

      const episodes = getEpisodesList(item);
      const targetEp = episodes[epIdx] || episodes[0];
      if (!targetEp) return;

      let rawUrl = targetEp.url;
      if (window.location.protocol === 'https:' && rawUrl.startsWith('http://')) {
        rawUrl = rawUrl.replace('http://', 'https://');
      }

      currentVodUniqueKey = `${item.vod.vod_name}_${targetEp.name}`;
      currentTitle.textContent = `${item.vod.vod_name} - ${targetEp.name}`;
      routeBadge.style.display = 'inline-block';
      routeBadge.textContent = item.siteName;
      currentStreamUrl = rawUrl;

      currentPlayingMeta = {
        title: item.vod.vod_name,
        epName: targetEp.name,
        siteName: item.siteName,
        thumb: item.vod.vod_pic || ''
      };
      updateFavIconState();
      manualPlayOnly(rawUrl);
    }

    function manualPlayOnly(url) {
      setStatus("正在建立连接...");
      const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) && !window.MSStream;

      if (isApple && video.canPlayType('application/vnd.apple.mpegurl')) {
        if (hls) { hls.destroy(); hls = null; }
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false); updatePlayBtn(true); restorePlaybackProgress(); showControls();
        }).catch(() => setStatus("请轻触画面或播放按钮起播"));
        video.onerror = () => showFailTip();
        return;
      }

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 60, xhrSetup: (xhr) => { xhr.withCredentials = false; } });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus("", false); video.play().then(() => { updatePlayBtn(true); restorePlaybackProgress(); showControls(); }).catch(() => setStatus("请轻触画面开始播放"));
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) { showFailTip(); updatePlayBtn(false); }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.load();
        video.play().then(() => {
          setStatus("", false); updatePlayBtn(true); restorePlaybackProgress(); showControls();
        }).catch(() => { showFailTip(); updatePlayBtn(false); });
      }
    }

    function showFailTip() {
      setStatus("当前线路受限<br><span style='color:#aaa;font-size:12px;'>请在右侧列表中手动选择其他源，或点击下方播放器图标一键秒播</span>", true);
    }

    async function fetchWithTimeout(url, timeout = 2600) {
      const getRes = (target) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);
        return fetch(target, { signal: controller.signal })
          .then(res => { clearTimeout(timer); if(!res.ok) throw new Error(); return res.text(); })
          .catch(e => { clearTimeout(timer); throw e; });
      };
      try { return await getRes(url); } catch (_) {}
      try { return await getRes("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)); } catch (_) {}
      try { return await getRes("https://corsproxy.io/?" + encodeURIComponent(url)); } catch (_) {}
      throw new Error("超时");
    }

    async function initTv() {
      const targetUrl = await getD1Data(STORAGE_KEY_M3U, '');
      if (!targetUrl) return;
      try {
        const text = await fetchWithTimeout(targetUrl, 3500);
        parseM3U(text);
        if (currentMode === 'tv' && currentView === 'normal') renderList(groups, false);
      } catch (_) {}
    }

    function parseM3U(content) {
      groups = {};
      const lines = content.split('\n');
      let temp = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const name = (line.split(',')[1] || '未命名项目').trim();
          const groupMatch = line.match(/group-title="([^"]+)"/);
          const group = (groupMatch ? groupMatch[1] : '常规频道').trim();
          temp = { name, group };
        } else if (line && !line.startsWith('#') && temp) {
          if (!groups[temp.group]) groups[temp.group] = {};
          if (!groups[temp.group][temp.name]) groups[temp.group][temp.name] = [];
          if (!groups[temp.group][temp.name].includes(line)) {
            groups[temp.group][temp.name].push(line);
          }
          temp = null;
        }
      }
    }

    function renderList(targetGroups, isSearchMode = false) {
      const container = document.getElementById('channel-list');
      container.innerHTML = '';
      for (let groupName in targetGroups) {
        const channels = targetGroups[groupName];
        if (Object.keys(channels).length === 0) continue;
        const groupEl = document.createElement('div');
        groupEl.className = 'group-header';
        groupEl.innerHTML = `<span>${groupName}</span><span>▼</span>`;
        const subList = document.createElement('div');
        subList.className = 'group-channels';
        if (isSearchMode) subList.style.display = 'block';

        groupEl.onclick = () => {
          const isHide = subList.style.display === 'none';
          subList.style.display = isHide ? 'block' : 'none';
          groupEl.querySelector('span:last-child').textContent = isHide ? '▼' : '▶';
        };

        for (let chName in channels) {
          const urls = channels[chName];
          const rowEl = document.createElement('div');
          rowEl.className = 'channel-row';
          const panelEl = document.createElement('div');
          panelEl.className = 'sources-panel';

          urls.forEach((url, idx) => {
            const itemEl = document.createElement('div');
            itemEl.className = 'source-item';
            itemEl.innerHTML = `<span class="source-name">线路 ${idx + 1}</span>`;
            itemEl.onclick = (e) => {
              e.stopPropagation();
              isLiveMode = true;
              currentVodUniqueKey = "";
              document.querySelectorAll('.source-item.active-source').forEach(el => el.classList.remove('active-source'));
              itemEl.classList.add('active-source');
              currentTitle.textContent = chName;
              routeBadge.style.display = 'inline-block';
              routeBadge.textContent = `线 ${idx + 1}`;
              currentStreamUrl = url;
              currentPlayingMeta = { title: chName, siteName: `线路 ${idx + 1}` };
              updateFavIconState();
              manualPlayOnly(url);
            };
            panelEl.appendChild(itemEl);
          });

          const mainEl = document.createElement('div');
          mainEl.className = 'channel-main';
          mainEl.innerHTML = `
            <div class="channel-title"><span class="channel-arrow">▶</span><span>${chName}</span></div>
            <div class="channel-right-tools"><span class="badge-lines">${urls.length} 路线</span></div>
          `;

          mainEl.onclick = () => {
            const isExpanded = rowEl.classList.contains('expanded');
            document.querySelectorAll('.channel-row.expanded').forEach(el => el !== rowEl && el.classList.remove('expanded'));
            if (!isExpanded) {
              rowEl.classList.add('expanded');
              panelEl.querySelector('.source-item') && panelEl.querySelector('.source-item').click();
            } else {
              rowEl.classList.remove('expanded');
            }
          };

          rowEl.appendChild(mainEl);
          rowEl.appendChild(panelEl);
          subList.appendChild(rowEl);
        }
        container.appendChild(groupEl);
        container.appendChild(subList);
      }
    }

    function handleSearchTv() {
      const kw = document.getElementById('filter').value.trim().toLowerCase();
      if (!kw) { renderList(groups, false); return; }
      const filtered = {};
      for (let g in groups) {
        for (let ch in groups[g]) {
          if (ch.toLowerCase().includes(kw) || g.toLowerCase().includes(kw)) {
            if (!filtered[g]) filtered[g] = {};
            filtered[g][ch] = groups[g][ch];
          }
        }
      }
      renderList(filtered, true);
    }

    video.addEventListener('playing', () => { setStatus("", false); updatePlayBtn(true); showControls(); });
    video.addEventListener('pause', () => { updatePlayBtn(false); showControls(); });

    // 页面初始化：完全依赖 D1 数据，纯净轻快
    window.addEventListener('DOMContentLoaded', async () => {
      const cachedSites = await getD1Data(STORAGE_KEY_SITES, null);
      if (cachedSites) {
        try {
          const parsed = typeof cachedSites === 'object' ? cachedSites : JSON.parse(cachedSites);
          if (Array.isArray(parsed) && parsed.length > 0) parsedSites = parsed;
        } catch (_) {}
      }
      initTv();
      switchMode('vod');
      syncSubscription(false);
    });
  </script>
</body>
